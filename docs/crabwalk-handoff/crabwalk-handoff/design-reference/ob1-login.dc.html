<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crabwalk — Log in or sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Tiro+Devanagari+Marathi&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFEB}
*{box-sizing:border-box}
a{color:#2F4156}a:hover{color:#436475}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #C8D9E6; font-family: 'Instrument Sans', system-ui, sans-serif; color: #2F4156">

  <!-- top bar -->
  <div style="position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="28" height="28" viewBox="0 0 34 34" fill="none" stroke="#2F4156" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <ellipse cx="17" cy="19" rx="8" ry="5.5"></ellipse>
        <path d="M9.5 17 C 6 15, 5 11, 7 8 M7 8 L5 6 M7 8 L9.5 6.5 M24.5 17 C 28 15, 29 11, 27 8 M27 8 L29 6 M27 8 L24.5 6.5 M10 21 L5 24 M11 23 L7 27 M24 21 L29 24 M23 23 L27 27"></path>
      </svg>
      <span style="font-family: 'Gloock', Georgia, serif; font-size: 22px">Crabwalk</span>
    </div>
    <div role="group" aria-label="Language" style="display: flex; background: rgba(255,255,255,.6); border-radius: 999px; padding: 3px">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
        <button onClick="{{l.pick}}" aria-pressed="{{l.sel}}" style="border: 0; border-radius: 999px; min-width: 40px; min-height: 36px; padding: 0 10px; font-family: {{l.font}}; font-size: 14px; font-weight: 600; background: {{l.bg}}; color: {{l.fg}}">{{l.label}}</button>
      </sc-for>
    </div>
  </div>

  <!-- illustration -->
  <svg viewBox="0 0 390 360" style="position: absolute; left: 0; top: 40px; width: 390px; height: 360px" role="img" aria-label="Crabby the crab waving on the Ratnagiri coast">
    <circle cx="300" cy="80" r="34" fill="#F5EFEB"></circle>
    <path d="M0 170 C 70 140, 130 160, 190 140 S 300 120, 390 150 L390 360 L0 360 Z" fill="#A9C2D4"></path>
    <path d="M0 210 C 90 190, 170 205, 250 190 S 350 185, 390 195 L390 360 L0 360 Z" fill="#8AA7B9"></path>
    <rect x="0" y="232" width="390" height="128" fill="#567C8D"></rect>
    <path d="M0 250 Q 25 244 50 250 T 100 250 T 150 250 T 200 250 T 250 250 T 300 250 T 350 250 T 400 250" fill="none" stroke="#C8D9E6" stroke-width="2" opacity=".5"></path>
    <path d="M390 360 L390 140 C 360 146, 340 170, 320 190 C 300 210, 290 250, 270 280 C 255 305, 250 335, 245 360 Z" fill="#2F4156"></path>
    <rect x="352" y="96" width="14" height="46" fill="#F5EFEB"></rect>
    <rect x="349" y="88" width="20" height="10" fill="#2F4156"></rect>
    <path d="M347 88 L359 76 L371 88 Z" fill="#2F4156"></path>
    <!-- Crabby -->
    <g transform="translate(70 168) scale(.52)">
      <ellipse cx="210" cy="312" rx="150" ry="16" fill="#436475" opacity=".5"></ellipse>
      <g stroke="#2F4156" stroke-width="12" stroke-linecap="round" fill="none">
        <path d="M120 230 L72 262 L60 300"></path><path d="M132 248 L96 290 L94 312"></path><path d="M150 260 L132 300 L138 318"></path>
        <path d="M300 230 L348 262 L360 300"></path><path d="M288 248 L324 290 L326 312"></path><path d="M270 260 L288 300 L282 318"></path>
      </g>
      <g stroke="#2F4156" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M118 196 C 84 180, 70 150, 74 112"></path><path d="M302 196 C 336 176, 352 130, 346 84"></path>
      </g>
      <path d="M74 112 C 40 108, 30 70, 52 50 C 66 38, 92 42, 100 60 L 78 76 L 104 82 C 104 104, 92 114, 74 112 Z" fill="#C8D9E6" stroke="#2F4156" stroke-width="5" stroke-linejoin="round"></path>
      <path d="M346 84 C 384 82, 396 40, 372 20 C 356 8, 328 14, 322 34 L 344 48 L 318 56 C 318 76, 328 86, 346 84 Z" fill="#C8D9E6" stroke="#2F4156" stroke-width="5" stroke-linejoin="round"></path>
      <g stroke="#2F4156" stroke-width="9" stroke-linecap="round"><path d="M180 150 L170 98"></path><path d="M240 150 L250 98"></path></g>
      <ellipse cx="210" cy="206" rx="112" ry="72" fill="#C8D9E6" stroke="#2F4156" stroke-width="6"></ellipse>
      <circle cx="170" cy="86" r="24" fill="#FFFFFF" stroke="#2F4156" stroke-width="5"></circle>
      <circle cx="250" cy="86" r="24" fill="#FFFFFF" stroke="#2F4156" stroke-width="5"></circle>
      <circle cx="175" cy="90" r="10" fill="#2F4156"></circle><circle cx="255" cy="90" r="10" fill="#2F4156"></circle>
      <circle cx="179" cy="86" r="3.5" fill="#FFFFFF"></circle><circle cx="259" cy="86" r="3.5" fill="#FFFFFF"></circle>
      <path d="M188 214 C 196 232, 224 232, 232 214" fill="none" stroke="#2F4156" stroke-width="6" stroke-linecap="round"></path>
    </g>
  </svg>
  <div style="position: absolute; left: 196px; top: 150px; background: #2F4156; color: #F5EFEB; border-radius: 18px 18px 18px 4px; padding: 8px 14px; box-shadow: 0 10px 24px rgba(47,65,86,.25)">
    <p style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 15px; line-height: 1.3">नमस्कार!</p>
    <p style="margin: 0; font-size: 13px; font-weight: 600">I'm Crabby.</p>
  </div>

  <!-- sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 474px; background: #F5EFEB; border-radius: 32px 32px 0 0; padding: 28px 24px 28px; display: flex; flex-direction: column">
    <h1 style="margin: 0; font-family: 'Gloock', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.08">Your Konkan trip<br>starts here</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.55; color: #436475">Log in or sign up to save places, plan trips and chat with Crabby.</p>

    <label for="ob-phone" style="margin-top: 22px; font-size: 13px; font-weight: 600">Mobile number</label>
    <div style="margin-top: 8px; display: flex; gap: 8px">
      <span style="flex: none; height: 52px; padding: 0 14px; border: 1px solid #DCD3CC; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; font-size: 16px; font-weight: 600">+91</span>
      <input id="ob-phone" type="tel" inputmode="numeric" placeholder="10-digit number" style="flex: 1; min-width: 0; height: 52px; border: 1px solid #DCD3CC; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #2F4156; outline: none">
    </div>
    <a href="ob2-about.dc.html" style="margin-top: 14px; height: 54px; border-radius: 999px; background: #2F4156; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Send OTP</a>

    <div style="margin: 18px 0; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #436475" aria-hidden="true">
      <span style="flex: 1; height: 1px; background: #DCD3CC"></span>or<span style="flex: 1; height: 1px; background: #DCD3CC"></span>
    </div>
    <div style="display: flex; gap: 10px">
      <a href="ob2-about.dc.html" style="flex: 1; height: 50px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCD3CC; color: #2F4156; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">Google</a>
      <a href="ob2-about.dc.html" style="flex: 1; height: 50px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCD3CC; color: #2F4156; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>Email</a>
    </div>

    <a href="Main.dc.html" style="margin-top: auto; text-align: center; font-size: 15px; font-weight: 600; color: #2F4156">Just looking? Explore without an account</a>
    <p style="margin: 10px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: #436475">By continuing you agree to our <a href="#terms" style="color: #2F4156">Terms</a> and <a href="#privacy" style="color: #2F4156">Privacy Policy</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'en' };
  }
  renderVals() {
    var self = this;
    var defs = [['en', 'EN', "'Instrument Sans', sans-serif"], ['hi', 'हि', "'Tiro Devanagari Marathi', serif"], ['mr', 'म', "'Tiro Devanagari Marathi', serif"]];
    var langs = defs.map(function (d) {
      var on = self.state.lang === d[0];
      return { label: d[1], font: d[2], sel: on ? 'true' : 'false', bg: on ? '#2F4156' : 'transparent', fg: on ? '#FFFFFF' : '#2F4156', pick: function () { self.setState({ lang: d[0] }); } };
    });
    return { langs: langs };
  }
}
</script>
</body>
</html>
