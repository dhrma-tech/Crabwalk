<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crabwalk onboarding — Food and budget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFEB}
*{box-sizing:border-box}
a{color:#2F4156}a:hover{color:#436475}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5EFEB; font-family: 'Instrument Sans', system-ui, sans-serif; color: #2F4156">

  <div style="display: flex; align-items: center; gap: 14px; padding: 18px 20px 0">
    <a href="ob4-interests.dc.html" aria-label="Back" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DCD3CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2F4156"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div role="img" aria-label="Step 4 of 4" style="flex: 1; display: flex; gap: 6px">
      <span style="flex: 1; height: 6px; border-radius: 999px; background: #2F4156"></span>
      <span style="flex: 1; height: 6px; border-radius: 999px; background: #2F4156"></span>
      <span style="flex: 1; height: 6px; border-radius: 999px; background: #2F4156"></span>
      <span style="flex: 1; height: 6px; border-radius: 999px; background: #2F4156"></span>
    </div>
    <a href="Main.dc.html" style="font-size: 14px; font-weight: 600; color: #436475; padding: 12px 2px; text-decoration: none">Skip</a>
  </div>

  <div style="padding: 22px 24px 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: #C8D9E6; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 34 34" fill="none" stroke="#2F4156" stroke-width="2" stroke-linecap="round"><ellipse cx="17" cy="19" rx="8" ry="5.5"></ellipse><path d="M9.5 17 C 6 15, 5 11, 7 8 M24.5 17 C 28 15, 29 11, 27 8 M10 21 L5 24 M24 21 L29 24"></path></svg></span>
      <p style="margin: 0; background: #FFFFFF; border-radius: 4px 16px 16px 16px; padding: 8px 14px; font-size: 14px; color: #436475">Last one. Then your coast is ready.</p>
    </div>
    <h1 style="margin: 16px 0 0; font-family: 'Gloock', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.08">How do you eat<br>and stay?</h1>

    <p style="margin: 20px 0 0; font-size: 13px; font-weight: 600">Food</p>
    <div role="radiogroup" aria-label="Food preference" style="margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{foods}}" as="f" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{f.sel}}" onClick="{{f.pick}}" style="height: 54px; border-radius: 16px; border: {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; transition: background .2s, color .2s">
          <span style="flex: none; width: 16px; height: 16px; border: 1.5px solid {{f.dot}}; border-radius: 3px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center" aria-hidden="true"><span style="width: 7px; height: 7px; border-radius: 999px; background: {{f.dot}}"></span></span>{{f.label}}</button>
      </sc-for>
    </div>

    <p style="margin: 20px 0 0; font-size: 13px; font-weight: 600">Budget per person, per day <span style="font-weight: 400; color: #436475">(stay + food + travel)</span></p>
    <div role="radiogroup" aria-label="Daily budget" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{budgets}}" as="b" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{b.sel}}" onClick="{{b.pick}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #2F4156; background: {{b.bg}}; color: {{b.fg}}; font: inherit; font-size: 14px; font-weight: 600; transition: background .2s, color .2s">{{b.label}}</button>
      </sc-for>
    </div>

    <p style="margin: 20px 0 0; font-size: 13px; font-weight: 600">Kind of stay</p>
    <div role="radiogroup" aria-label="Stay style" style="margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stays}}" as="s" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{s.sel}}" onClick="{{s.pick}}" style="height: 88px; border-radius: 18px; border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 4px; padding: 0 14px; font: inherit; text-align: left; transition: background .2s, color .2s">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
          <span style="font-size: 15px; font-weight: 600">{{s.label}}</span>
          <span style="font-size: 12px; opacity: .8">{{s.hint}}</span>
        </button>
      </sc-for>
    </div>

    <p style="margin: 18px 0 0; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.5; color: #436475">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#436475" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      Crabby remembers only these preferences, never your chats. Change them any time in Me.</p>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: #F5EFEB; border-top: 1px solid #E6DED8">
    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: #2F4156; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">Start exploring <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { food: 'veg', budget: 'mid', stay: 'homely' };
  }
  renderVals() {
    var self = this;
    function pickList(key, defs, extra) {
      return defs.map(function (d) {
        var on = self.state[key] === d[0];
        var item = { label: d[1], sel: on ? 'true' : 'false', bg: on ? '#2F4156' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2F4156', border: on ? '1px solid #2F4156' : '1px solid #DCD3CC', pick: function () { var p = {}; p[key] = d[0]; self.setState(p); } };
        if (extra) extra(item, d);
        return item;
      });
    }
    var foods = pickList('food', [['veg', 'Veg', '#2E7D32'], ['nonveg', 'Non-veg', '#A1371F'], ['jain', 'Jain', '#2E7D32'], ['egg', 'Eggetarian', '#B7791F']], function (item, d) { item.dot = d[2]; });
    var budgets = pickList('budget', [['low', 'Under ₹1,500'], ['mid', '₹1,500–3,000'], ['high', '₹3,000–6,000'], ['lux', '₹6,000+']]);
    budgets.forEach(function (b) { if (b.sel === 'false') b.bg = 'transparent'; });
    var stays = pickList('stay', [
      ['homely', 'Homely', 'Eat with the family', 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6'],
      ['pro', 'Professional', 'Front desk, room service', 'M3 21V7l9-4 9 4v14M3 21h18M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3']
    ], function (item, d) { item.hint = d[2]; item.icon = d[3]; });
    return { foods: foods, budgets: budgets, stays: stays };
  }
}
</script>
</body>
</html>
