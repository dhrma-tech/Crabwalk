- slug: modak
  status: ai_draft
  name:
    en: Ukadiche Modak
    mr: उकडीचे मोदक
    hi: उकड़ीचे मोदक
  what_it_is:
    en: Steamed rice-flour dumplings filled with grated coconut, jaggery and cardamom.
    mr: तांदळाच्या उकडीत ओल्या नारळ-गुळाचे सारण भरून वाफवलेले मोदक.
    hi: चावल के आटे के भाप में पके मोदक, जिनमें नारियल-गुड़ और इलायची भरी होती है।
  story:
    en: Modak is the sweet most tied to Ganeshotsav, the biggest festival in Konkan
      homes. Families make them by hand for the festival days, pleating each one before
      steaming.
    mr: मोदक हा कोकणातील घराघरांमध्ये साजरा होणाऱ्या गणोशोत्सवासोबत जोडलेला सर्वात
      महत्त्वाचा गोड पदार्थ आहे. उत्सवाच्या दिवसांत कुटुंबे हाताने मोदक बनवतात, वाफवण्यापूर्वी
      प्रत्येक मोदकावर सुबक कळ्या (चुरण्या) पाडतात.
    hi: मोदक वह मिठाई है जो कोंकण के घरों के सबसे बड़े त्योहार गणेशोत्सव से सबसे अधिक
      जुड़ी है। त्योहार के दिनों में परिवार हाथ से मोदक बनाते हैं, भाप में पकाने से
      पहले हर एक में सुंदर तह बनाते हैं।
