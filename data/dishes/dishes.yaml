- slug: solkadhi
  status: ai_draft
  name:
    en: Solkadhi
    mr: सोलकढी
    hi: सोलकढ़ी
  what_it_is:
    en: A pink, tangy drink of kokum and coconut milk, served chilled or with rice.
    mr: कोकम आणि नारळाच्या दुधापासून बनवलेले गुलाबी, आंबट-गोड पेय; थंड किंवा भातासोबत
      घेतात.
    hi: कोकम और नारियल के दूध से बना गुलाबी, खट्टा पेय; ठंडा या चावल के साथ परोसा
      जाता है।
  story:
    en: Solkadhi is the drink that closes almost every Konkan meal. Kokum gives it
      the colour and sourness, coconut milk softens it. Locals drink it after spicy
      fish or chicken curries because it is said to help digestion.
    mr: सोलकढी हे कोकणातील प्रत्येक जेवणाचा समारोप करणारे पेय आहे. कोकममुळे त्याला
      रंग व आंबटपणा मिळतो, तर नारळाचे दूध तो मऊ करतो. मसाल्याचे मासे किंवा चिकनच्या
      आमटी, रश्या नंतर लोक ती पितात कारण त्यामुळे पचन सुधारते असे मानले जाते.
    hi: सोलकढ़ी वह पेय है जो लगभग हर कोंकण भोजन का अंत करता है। कोकम इसे रंग और खटास
      देता है, और नारियल का दूध इसे नरम बनाता है। मसालेदार मछली या चिकन करी के बाद
      स्थानीय लोग इसे पीते हैं क्योंकि माना जाता है कि इससे पाचन में मदद मिलती है।
