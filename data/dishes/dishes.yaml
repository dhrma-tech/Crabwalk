- slug: surmai_thali
  status: ai_draft
  name:
    en: Surmai Thali
    mr: सुरमई थाळी
    hi: सुरमई थाली
  what_it_is:
    en: A fish meal built around kingfish (surmai), usually rava- or tawa-fried, with
      curry, rice, bhakri and solkadhi.
    mr: सुरमई माशाची थाळी; रवा/तवा फ्राय सुरमई, कालवण, भात, भाकरी आणि सोलकढी.
    hi: सुरमई (किंगफ़िश) की थाली; रवा/तवा फ्राई मछली, करी, चावल, भाकरी और सोलकढ़ी।
  story:
    en: Surmai is the premium catch of Konkan restaurants. The thali puts a fried
      slice next to a coconut fish curry, so one plate shows both sides of how the
      coast cooks fish.
    mr: सुरमई हा कोकणातील रेस्टॉरंटमधील एक खास आणि premium मासा आहे. या थाळीत तळलेला
      तुकडा नारळाच्या माशाच्या आमटीच्या शेजारी ठेवून दिला जातो, जेणेकरून एकाच ताटात
      किनारी भागात मासे कसे बनवले जातात याचे दोन्ही प्रकार पाहायला मिळतात.
    hi: सुरमई कोंकण रेस्तरां की प्रीमियम कैच है। थाली में एक तली हुई स्लाइस को नारियल
      वाली फिश करी के बगल में रखा जाता है, ताकि एक ही थाली में तट पर मछली पकाने के
      दोनों तरीके दिख सकें।
