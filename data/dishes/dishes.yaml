- slug: kokum_sherbet
  status: ai_draft
  name:
    en: Kokum Sherbet
    mr: कोकम सरबत
    hi: कोकम शरबत
  what_it_is:
    en: A deep-red sweet-sour cooler made from kokum (Garcinia indica) syrup and water.
    mr: कोकमच्या (रातांबा) सरबतापासून बनवलेले लाल आंबट-गोड थंड पेय.
    hi: कोकम (गार्सिनिया इंडिका) के शरबत से बना गहरा लाल खट्टा-मीठा ठंडा पेय।
  story:
    en: Kokum trees grow across the Konkan, and the dried fruit goes into curries
      and drinks. The sherbet is the summer drink of the coast, sold at stalls near
      beaches and temples.
    mr: कोकणात सर्वत्र कोकमची झाडे उगवतात, आणि याचे वाळलेले फळ आमट्यांमध्ये व पेयांमध्ये
      वापरले जाते. हे सरबत किनाऱ्यावरील उन्हाळ्याचे पेय आहे, जे समुद्रकिनाऱ्यांजवळ
      आणि मंदिरांजवळच्या स्टॉलवर विकले जाते.
    hi: कोंकण भर में कोकम के पेड़ उगते हैं, और सूखा फल करी और पेय पदार्थों में जाता
      है। शरबत तट का गर्मियों का पेय है, जो समुद्र तटों और मंदिरों के पास की स्टालों
      पर बिकता है।
