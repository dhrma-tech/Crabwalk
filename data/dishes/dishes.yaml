- slug: aamras
  status: ai_draft
  name:
    en: Aamras
    mr: आमरस
    hi: आमरस
  what_it_is:
    en: Sweet pulp of ripe mangoes, often Alphonso, eaten with puri or chapati in
      mango season.
    mr: पिकलेल्या (बहुधा हापूस) आंब्याचा गोड रस, आंब्याच्या हंगामात पुरी किंवा पोळीसोबत.
    hi: पके (अक्सर हापुस) आम का मीठा रस, आम के मौसम में पूरी या रोटी के साथ।
  story:
    en: Ratnagiri is home ground for the Alphonso (hapus), which received a GI tag
      in 2018. In the summer mango months, aamras with puri becomes the default festive
      meal in Konkan homes.
    mr: रत्नागिरी हे २०१४ मध्ये जीआय (GI) मानांकन मिळालेल्या हापूस आब्याची जन्मभूमी
      आहे. उन्हाळ्यातील आंब्याच्या दिवसांत पुरऱ्यांसोबत आमरस हे कोकणातील घरांमध्ये
      ठरलेले सणाचे जेवण असते.
    hi: रत्नागिरी अल्फांसो (हापुस) का घर है, जिसे 2018 में GI टैग मिला था। गर्मियों
      के आम के महीनों में, पूरी के साथ आमरस कोंकण के घरों में डिफ़ॉल्ट फेस्टिव मील
      बन जाता है।
