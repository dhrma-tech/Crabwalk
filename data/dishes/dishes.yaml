- slug: ghavane
  status: ai_draft
  name:
    en: Ghavane
    mr: घावणे
    hi: घावणे
  what_it_is:
    en: A thin, lacy crepe made only from rice flour and water, eaten with coconut-jaggery
      or with curry.
    mr: फक्त तांदळाचे पीठ आणि पाण्यापासून केलेले पातळ जाळीदार घावणे; नारळ-गुळ किंवा
      रश्शासोबत.
    hi: सिर्फ़ चावल के आटे और पानी से बना पतला जालीदार चीला; नारियल-गुड़ या करी के
      साथ।
  story:
    en: Ghavane is a Konkan breakfast staple across Ratnagiri and Sindhudurg. It is
      simple to make and is eaten sweet with coconut and jaggery or savoury with chicken
      or fish curry.
    mr: घावणे हा रत्नागिरी आणि सिंधुदुर्गमधील कोकणातील नाश्त्याचा एक मुख्य पदार्थ
      आहे. बनवायला अत्यंत सोपा असलेला हा पदार्थ नारळ आणि गुळासोबत गोड किंवा चिकन अथवा
      माशाच्या रश्यासोबत तिकट खाल्ला जातो.
    hi: घवाने रत्नागिरी और सिंधुदुर्ग में कोंकण का नाश्ते का एक मुख्य पकवान है। इसे
      बनाना आसान है और इसे नारियल और गुड़ के साथ मीठा या चिकन या मछली करी के साथ नमकीन
      खाया जाता है।
