- slug: kombdi_vade
  status: ai_draft
  name:
    en: Kombdi Vade
    mr: कोंबडी वडे
    hi: कोंबड़ी वड़े
  what_it_is:
    en: Spicy coconut-based chicken curry served with puffed, deep-fried rice-flour
      puris (vade).
    mr: नारळाच्या मसाल्यातील तिखट कोंबडीचा रस्सा आणि तांदळाच्या पिठाचे तळलेले वडे.
    hi: नारियल मसाले वाली तीखी चिकन करी, साथ में चावल के आटे के तले हुए वड़े।
  story:
    en: A Malvani classic that has become the signature non-veg meal of the whole
      Konkan coast. The vade are torn and dipped into the hot curry, and the plate
      usually comes with onion, lemon and a glass of solkadhi.
    mr: मालवणी खाद्यसंस्कृतीतील एक अस्सल पदार्थ जो संपूर्ण कोकण किनारपट्टीचे मुख्य
      मांसाहारी जेवण बनला आहे. वडे मोडून गरम रस्यात बुडवले जातात आणि ताटात सहसा कांदा,
      लिंबू व एक ग्लास सोलकढी असते.
    hi: एक मालवणी क्लासिक जो पूरे कोंकण तट का सिग्नेचर नॉन-वेज भोजन बन गया है। vade
      को तोड़ा जाता है और गर्म करी में डुबोया जाता है, और थाली के साथ आमतौर पर प्याज,
      नींबू और एक गिलास सोलकढ़ी मिलती है।
