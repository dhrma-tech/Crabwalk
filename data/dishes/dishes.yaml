- slug: kolambi_fry
  status: ai_draft
  name:
    en: Kolambi Fry
    mr: कोळंबी फ्राय
    hi: कोळंबी फ्राय
  what_it_is:
    en: Prawns rubbed with spices, coated in rice flour and semolina, then shallow-fried.
    mr: मसाले लावलेली कोळंबी तांदळाचे पीठ आणि रव्यात घोळवून शॅलो फ्राय केलेली असते.
    hi: मसाले लगी कोळंबी, चावल के आटे और सूजी में लपेटकर शेलो-फ्राय की जाती है।
  story:
    en: Kolambi is the Marathi word for prawns. Konkan seafood cooking is built mostly
      on sea fish, prawns and crab, and this rice-flour and semolina coat is a common
      way to fry them.
    mr: कोळंबी हा कोळंबीचा मराठी शब्द आहे. कोकणातील सीफूड प्रामुख्याने समुद्रातील
      मासे, कोळंबी आणि खेकड्यांवर आधारित असते, आणि तांदूळ व रव्याचे कोटिंग करून तळणे
      ही त्यांची एक सामान्य पद्धत आहे.
    hi: कोळंबी कोळंबी का मराठी शब्द है। कोंकण सीफूड कुकिंग मुख्य रूप से समुद्री मछली,
      कोळंबी और केकड़े पर आधारित होती है, और चावल के आटे और सूजी की कोटिंग करके तलना
      इसे बनाने का एक आम तरीका है।
