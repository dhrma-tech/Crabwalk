- slug: bangda_fry
  status: ai_draft
  name:
    en: Bangda Fry
    mr: बांगडा फ्राय
    hi: बांगड़ा फ्राई
  what_it_is:
    en: Whole mackerel, head removed, coated in masala and pan- or shallow-fried.
    mr: डोके काढलेला संपूर्ण बांगडा मसाला लावून तळलेला.
    hi: सिर हटाकर मसाला लगाई पूरी बांगड़ा मछली, तली हुई।
  story:
    en: Mackerel is the everyday fish of the Konkan coast, cheap and caught close
      to shore. A bangda fry with rice and solkadhi is the most common fish lunch
      in coastal homes and khanavals.
    mr: बांंगडा हा कोकण किनारपट्टीचा रोजचा मासा आहे, जो स्वस्त मिळतो आणि किनाऱ्याजवळच
      पकडला जातो. भात आणि सोलकढीसोबत बांंगडा फ्राय हे किनारपट्टीवरील घरांमध्ये आणि
      खानावळींमध्ये सर्वाधिक खाल्ले जाणारे माशाचे जेवण आहे.
    hi: मैकेरल (बांगडा) कोंकण तट की रोज की मछली है, जो सस्ती है और तट के पास पकड़ी
      जाती है। चावल और सोलकढ़ी के साथ बांगडा फ्राई तटीय घरों और खानवालो में सबसे आम
      मछली का दोपहर का भोजन है।
