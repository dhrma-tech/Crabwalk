  text:
    en:
      short_story: 'The Lokmanya Tilak Smarak Vachan Mandir is a public library in
        Chiplun that is about 155 years old. In November 2018 a museum was added to
        it.


        The museum shows Stone Age tools, Harappan objects, Jorwe and Malwa pottery
        from the Inamgaon dig near Pune, Maratha-era articles, old stone idols, and
        coins from Roman times to the Maratha states.'
      history: null
      significance: An old town library that also holds an archaeology and coin museum.
      dos: '- Ask the staff about the coin collection'
      donts: '- Don''t photograph exhibits without asking'
      safety_text: null
    mr:
      short_story: 'लोकमान्य टिळक स्मारक वाचन मंदिर हे चिपळूणमधील एक सार्वजनिक पुस्तकालय
        आहे जे सुमारे 155 वर्षे जुने आहे. नोव्हेंबर 2018 मध्ये यात एका संग्रहालयाची
        (म्युझियम) भर घालण्यात आली.


        या संग्रहालयात पाषाणयुगीन हत्यारे, हडप्पा संस्कृतीचे अवशेष, पुण्याजवळील इनामगावच्या
        उत्खननातील जोरवे व मालवा संस्कृतीची भांडी, मराठा काळातील वस्तू, जुने पाषाण
        मूर्ती आणि रोमन काळापासून ते मराठा राज्यांपर्यंतची नाणी पाहायला मिळतात.'
      history: null
      significance: एक जुने शहर वाचनालय ज्यामध्ये पुरातत्त्वशास्त्र आणि नाण्यांचे
        संग्रहालय देखील आहे.
      dos: '- कर्मचाऱ्यांना नाण्यांच्या संग्रहाबद्दल अवश्य सांगा (विचारा)'
      donts: '- विचारल्याशिवाय प्रदर्शनातील वस्तूंचे फोटो काढू नका'
      safety_text: null
    hi:
      short_story: 'लोकमान्य तिलक स्मारक वाचन मंदिर चिपळूण में एक सार्वजनिक पुस्तकालय
        है जो लगभग 155 साल पुराना है। नवंबर 2018 में इसमें एक संग्रहालय जोड़ा गया।


        संग्रहालय पाषाण युग के औजार, हड़प्पा की वस्तुएं, पुणे के पास इनामगांव की खुदाई
        से मिले जोरवे और मालवा के बर्तन, मराठा-युग की वस्तुएं, पुरानी पत्थर की मूर्तियां,
        और रोमन काल से लेकर मराठा राज्यों तक के सिक्के प्रदर्शित करता है।'
      history: null
      significance: एक पुराना टाउन लाइब्रेरी जिसमें पुरातत्व और सिक्कों का संग्रहालय
        भी है।
      dos: '- कर्मचारियों से सिक्कों के संग्रह के बारे में पूछें'
      donts: '- बिना पूछे प्रदर्शनों की तस्वीरें न लें'
