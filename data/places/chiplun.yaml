  text:
    en:
      short_story: 'The Pandav Caves are a group of ancient rock-cut Buddhist caves
        located about 2 kilometers from the Chiplun Bus Station. Despite the local
        name referencing the Pandavas, the structures are of Buddhist origin.


        Visitors can explore the excavated rock chambers and view the early architectural
        influences carved into the stone. The entire surrounding area can be seen
        in a short 15-minute visit.'
      history: The caves are of ancient Buddhist origin, illustrating the historical
        extent of Buddhist influence in the Ratnagiri district.
      significance: A site of ancient rock-cut Buddhist caves highlighting early religious
        architecture in Chiplun.
      dos: '- Carry a flashlight to see the interior details of the rock-cut chambers.

        - Respect the historical integrity of the archaeological site.'
      donts: '- Do not carve or write on the ancient rock walls.'
      safety_text: Be careful of uneven rock surfaces and low lighting inside the
        caves.
    mr:
      short_story: 'पांडव लेणी हा प्राचीन बौद्ध लेण्यांचा एक समूह असून तो चिपळूण बस
        स्थानकापासून सुमारे 2 किलोमीटर अंतरावर आहे. स्थानिक लोक याला पांडवांच्या नावाशी
        जोडत असले तरी, या वास्तू मूळतः बौद्ध धर्माशी संबंधित आहेत.


        पर्यटक या खडकात कोरलेल्या गुंफा पाहू शकतात आणि दगडावर कोरलेली सुरुवातीच्या
        काळातील वास्तुकलेची झलक अनुभवू शकतात. संपूर्ण परिसराची पाहणी अवघ्या 15 मिनिटांत
        करता येते.'
      history: या लेणी प्राचीन बौद्ध काळातील असून, त्या रत्नागिरी जिल्ह्यातील बौद्ध
        प्रभावाचा ऐतिहासिक विस्तार दर्शवतात.
      significance: चिपळूणमधील सुरुवातीच्या धार्मिक वास्तुकलेवर प्रकाश टाकणाऱ्या प्राचीन
        बौद्ध लेण्या.
      dos: '- गुंफांच्या आतील बारकावे पाहण्यासाठी सोबत बॅटरी (टॉर्च) ठेवा.

        - या पुरातत्त्वीय स्थळाचे ऐतिहासिक महत्त्व आणि पावित्र्य जपा.'
      donts: '- प्राचीन खडकांवर किंवा भिंतींवर काहीही लिहू किंवा कोरू नका.'
      safety_text: लेण्यांच्या आतील खडबडीत पृष्ठभाग आणि कमी प्रकाशामुळे चालताना काळजी
        घ्या.
    hi:
      short_story: 'पांडव गुफाएं चिपलून बस स्टेशन से लगभग 2 किलोमीटर दूर स्थित प्राचीन
        बौद्ध गुफाओं का एक समूह है। पांडवों के नाम पर आधारित स्थानीय नाम होने के बावजूद,
        ये संरचनाएं वास्तव में बौद्ध मूल की हैं।


        आगंतुक चट्टान काटकर बनाए गए कक्षों को देख सकते हैं और पत्थरों पर उकेरी गई
        प्रारंभिक वास्तुकला की झलक पा सकते हैं। पूरे क्षेत्र को 15 मिनट की छोटी सी
        यात्रा में देखा जा सकता है।'
      history: ये गुफाएं प्राचीन बौद्ध मूल की हैं, जो रत्नागिरी जिले में बौद्ध प्रभाव
        के ऐतिहासिक विस्तार को दर्शाती हैं।
      significance: प्राचीन चट्टानों को काटकर बनाई गई बौद्ध गुफाओं का एक स्थल जो चिपलून
        में प्रारंभिक धार्मिक वास्तुकला को उजागर करता है।
      dos: '- गुफाओं के अंदर की बारीकियों को देखने के लिए साथ में फ्लैशलाइट रखें।

        - पुरातात्विक स्थल की ऐतिहासिक अखंडता का सम्मान करें।'
      donts: '- प्राचीन चट्टानों की दीवारों पर कुछ भी न लिखें या उकेरें।'
      safety_text: गुफाओं के अंदर असमान सतहों और कम रोशनी के कारण सावधानी से चलें।
