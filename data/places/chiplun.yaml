  text:
    en:
      short_story: 'Jangli Jaygad is a remote hill fort located deep within the forests
        of the Sahyadri Tiger Reserve, perched at an elevation of 908 meters in the
        Western Ghats. Positioned near the Kumbharli Ghat and the Koyna region, it
        serves as a difficult trekking destination.

        The route features thick jungle trails and opportunities to observe wildlife.
        From the summit, visitors can see clear views of the Koyna reservoir and the
        surrounding valleys.'
      history: The fort was historically used as a strategic watchpost to guard the
        Kumbharli Ghat trade route, providing the Maratha empire with a vantage point
        over the Konkan and Deccan borders.
      significance: A rugged jungle fort offering one of the most difficult treks
        in the Sahyadri Tiger Reserve.
      dos: '- Hire a local guide from nearby villages like Navja, as the jungle trails
        are dense.

        - Carry ample drinking water, trekking gear, and first-aid supplies.'
      donts: '- Do not trek during the heavy monsoon season when the trails become
        slippery and infested with leeches.

        - Do not litter or disturb the wildlife in the tiger reserve.'
      safety_text: The trek passes through a dense forest with wildlife; trekking
        in groups with an experienced local guide is advised.
    mr:
      short_story: 'जंगली जयगड हा सह्याद्री व्याघ्र प्रकल्पाच्या घनदाट जंगलात वसलेला
        एक दुर्गम डोंगरी किल्ला आहे. पश्चिम घाटात सुमारे 908 मीटर उंचीवर असलेल्या
        या किल्ल्याचा ट्रेक कठीण मानला जातो. कुंभार्ली घाट आणि कोयना खोऱ्याच्या परिसरात
        असलेल्या या किल्ल्यावर जाताना दाट जंगल आणि वन्यजीवांचे दर्शन घडते.

        माथ्यावरून कोयना जलाशय आणि आजूबाजूच्या खोऱ्यांचे विस्तीर्ण दृश्य पाहता येते.'
      history: ऐतिहासिक काळात कुंभार्ली घाटातील व्यापारी मार्गावर नजर ठेवण्यासाठी
        या किल्ल्याचा वापर टेहळणीसाठी केला जात असे. मराठा साम्राज्यासाठी हे कोकण आणि
        दख्खनच्या सीमेवरील एक महत्त्वाचे ठाणे होते.
      significance: सह्याद्री व्याघ्र प्रकल्पातील एक अत्यंत आव्हानात्मक ट्रेक म्हणून
        हा किल्ला ओळखला जातो.
      dos: '- जंगलातील वाटा चकवणाऱ्या असल्याने नवजा किंवा जवळच्या गावातील स्थानिक
        वाटाड्या सोबत घ्या.

        - सोबत पुरेसे पिण्याचे पाणी, ट्रेकिंगचे साहित्य आणि प्रथमोपचार पेटी ठेवा.'
      donts: '- अतिवृष्टीच्या काळात ट्रेकिंग करणे टाळा, कारण वाटा निसरड्या होतात आणि
        जळवांचा त्रास होतो.

        - व्याघ्र प्रकल्पातील वन्यजीवांना त्रास देऊ नका किंवा कचरा करू नका.'
      safety_text: हा ट्रेक कठीण श्रेणीत मोडतो आणि वन्यजीव असलेल्या घनदाट जंगलातून
        जातो; त्यामुळे अनुभवी स्थानिक मार्गदर्शकासोबत गटाने जाणे सुरक्षित ठरते.
    hi:
      short_story: 'जंगली जयगढ़ सह्याद्री टाइगर रिजर्व के घने जंगलों में स्थित एक
        दुर्गम पहाड़ी किला है। पश्चिमी घाट में 908 मीटर की ऊंचाई पर स्थित यह किला
        एक कठिन ट्रैकिंग गंतव्य है। कुंभार्ली घाट और कोयना क्षेत्र के पास स्थित इस
        किले के रास्ते में घना जंगल और वन्यजीव देखने को मिलते हैं।

        शिखर से कोयना जलाशय और आसपास की घाटियों का विस्तृत दृश्य दिखाई देता है।'
      history: ऐतिहासिक रूप से इस किले का उपयोग कुंभार्ली घाट व्यापार मार्ग की निगरानी
        के लिए एक रणनीतिक चौकी के रूप में किया जाता था, जो मराठा साम्राज्य को कोंकण
        और दक्कन की सीमाओं पर नजर रखने में मदद करता था।
      significance: सह्याद्री टाइगर रिजर्व में सबसे कठिन ट्रेक में से एक के रूप में
        जाना जाने वाला एक जंगली किला।
      dos: '- नवजा जैसे नजदीकी गांवों से एक स्थानीय गाइड को किराए पर लें क्योंकि जंगल
        के रास्ते भ्रामक होते हैं।

        - अपने साथ पर्याप्त पीने का पानी, ट्रैकिंग गियर और प्राथमिक चिकित्सा किट रखें।'
      donts: '- भारी मानसून के मौसम में ट्रेक न करें क्योंकि रास्ते फिसलन भरे हो जाते
        हैं और जोंक का खतरा रहता है।

        - टाइगर रिजर्व में कचरा न फैलाएं और वन्यजीवों को परेशान न करें।'
      safety_text: यह एक कठिन ट्रेक है जो वन्यजीवों वाले घने जंगल से होकर गुजरता है;
        अनुभवी स्थानीय गाइड के साथ समूह में ट्रैकिंग करने की सलाह दी जाती है।
