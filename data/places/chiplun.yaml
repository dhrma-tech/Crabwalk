  text:
    en:
      short_story: 'Mugger crocodiles live along the Vashishti river near Chiplun.
        A local operator, Kokan Crocodile Safari, runs small boats from the Maldoli
        backwaters so visitors can watch them on the banks.


        The basic ride lasts about 90 minutes. Trips run at low tide, when the crocodiles
        come out on the mud, so the timing changes from day to day. Birds are common
        along the same stretch.'
      history: null
      significance: A boat ride to watch wild mugger crocodiles on the Vashishti.
      dos: '- Book ahead and confirm the tide-based start time with the operator

        - Carry binoculars and a camera with zoom'
      donts: '- Don''t lean out of the boat or put hands in the water

        - Don''t make loud noise; the crocodiles slip into the water'
      safety_text: Mugger crocodiles are wild and dangerous. Stay seated in the boat
        and follow the boatman's instructions. Do not walk near the river banks.
    mr:
      short_story: 'चिपळूणजवळ वाशिष्ठी नदीच्या काठावर मगर्स जातीचे सुसर (मगर) राहतात.
        येथील एक स्थानिक ऑपरेटर ''कोकण क्रोकोडाईल सफारी'' मालदोलच्या खाडीतून छोट्या
        बोटी चालवतो, जेणेकरून पर्यटकांना नदीकाठावर मगरी पाहता येतील.


        मूलभूत सफर साधारण 90 मिनिटांची असते. ओहोटीच्या वेळी या फेऱ्या चालतात, कारण
        तेव्हा मगरी चिखलात बाहेर येतात, त्यामुळे प्रवासाची वेळ दररोज बदलत असते. याच
        नदीच्या पट्ट्यात पक्षीही मोठ्या प्रमाणात आढळतात.'
      history: null
      significance: वाशिष्ठी नदीत जंगली मगर्स मगरी पाहण्यासाठी बोट सफारी.
      dos: '- आधीच बुकिंग करा आणि ऑपरेटरकडे ओहोटीवर आधारित सुरु असण्याची वेळ निश्चित
        करा

        - दुर्बीण (बायनाक्युलर) आणि झूम असलेला कॅमेरा सोबत ठेवा'
      donts: '- बोटीबाहेर झुकू नका किंवा पात्रात हात घालू नका

        - मोठ्याने आवाज करू नका; आवाज ऐकताच मगरी पाण्यात सरकतात'
      safety_text: मगर्स मगरी जंगली आणि धोकादायक असतात. बोटीमध्ये आरामात बसा आणि नाखव्याच्या
        (बोट चालवणाऱ्याच्या) सूचनांचे पालन करा. नदीकाठाजवळ चालत जाऊ नका.
    hi:
      short_story: 'चिपळूण के पास वाशिष्ठी नदी के किनारे मगरमच्छ रहते हैं। एक स्थानीय
        ऑपरेटर, ''कोंकण क्रोकोडाइल सफारी'', मालदोली बैकवाटर से छोटी नावें चलाता है
        ताकि पर्यटक उन्हें तटों पर देख सकें।


        बुनियादी सफारी लगभग 90 मिनट की होती है। ये यात्राएं कम ज्वार (ओहोटी) के समय
        चलती हैं, जब मगरमच्छ कीचड़ पर बाहर आते हैं, इसलिए समय दिन-प्रतिदिन बदलता रहता
