  text:
    en:
      short_story: 'This Hindu temple complex is located in Govalkot, about 7 kilometers
        from Chiplun. It is situated at the foothills of the historic Govalkot Fort.


        The temple is dedicated to Lord Someshwar (Shiva) and Goddess Karanjeshwari.
        The site features traditional temple architecture and provides lodging rooms
        on the premises for visitors participating in daily rituals.'
      history: The deities have been worshipped since ancient times and serve as a
        revered family shrine (Kuldevi) for specific local communities.
      significance: A significant religious site and family shrine located at the
        historic base of Govalkot Fort.
      dos: '- Maintain silence and respect the spiritual atmosphere.

        - Ask for permission before taking photographs inside the sanctum.'
      donts: '- Do not block the narrow access road leading to the temple with vehicles.'
      safety_text: The road leading to the temple is narrow, so drive carefully.
    mr:
      short_story: 'हे हिंदू मंदिर चिपळूणपासून सुमारे 7 किलोमीटर अंतरावर गोवळकोट येथे
        आहे. ऐतिहासिक गोवळकोट किल्ल्याच्या पायथ्याशी हे मंदिर वसलेले आहे.


        हे मंदिर श्री देव सोमेश्वर (शिव) आणि करण्जेश्वरी देवीला समर्पित आहे. मंदिरात
        पारंपारिक वास्तुकला पाहायला मिळते आणि रोजच्या पूजेत सहभागी होणाऱ्या भाविकांसाठी
        मंदिर परिसरात राहण्याची सोय उपलब्ध आहे.'
      history: प्राचीन काळापासून या देवतांची पूजा केली जात असून, विशिष्ट स्थानिक समाजासाठी
        हे एक आदरणीय कौटुंबिक श्रद्धास्थान (कुलदैवत) आहे.
      significance: गोवळकोट किल्ल्याच्या ऐतिहासिक पायथ्याशी असलेले एक महत्त्वाचे धार्मिक
        स्थळ आणि कुलदैवत.
      dos: '- शांतता राखा आणि मंदिरातील पावित्र्य जपा.

        - गाभाऱ्यात फोटो काढण्यापूर्वी परवानगी घ्या.'
      donts: '- मंदिराकडे जाणाऱ्या अरुंद रस्त्यावर वाहने उभी करून रस्ता अडवू नका.'
      safety_text: मंदिराकडे जाणारा रस्ता अरुंद आहे, त्यामुळे गाडी काळजीपूर्वक चालवा.
    hi:
      short_story: 'यह हिंदू मंदिर परिसर चिपलून से लगभग 7 किलोमीटर दूर गोवलकोट में
        स्थित है। यह ऐतिहासिक गोवलकोट किले की तलहटी में बना है।


        यह मंदिर भगवान सोमेश्वर (शिव) और देवी करण्जेश्वरी को समर्पित है। इस स्थल पर
        पारंपरिक मंदिर वास्तुकला देखने को मिलती है और रोज़ाना की पूजा में भाग लेने
        वाले आगंतुकों के लिए मंदिर परिसर में ठहरने के कमरे उपलब्ध हैं।'
      history: प्राचीन काल से इन देवताओं की पूजा की जाती रही है और विशिष्ट स्थानीय
        समुदायों के लिए यह एक पूजनीय पारिवारिक मंदिर (कुलदेवी) के रूप में कार्य करता
        है।
      significance: गोवलकोट किले के ऐतिहासिक आधार पर स्थित एक महत्वपूर्ण धार्मिक स्थल
        और पारिवारिक मंदिर।
      dos: '- शांति बनाए रखें और आध्यात्मिक माहौल का सम्मान करें।

        - गर्भगृह के अंदर तस्वीरें लेने से पहले अनुमति मांगें।'
      donts: '- मंदिर तक जाने वाली संकरी सड़क को वाहनों से अवरुद्ध न करें।'
      safety_text: मंदिर की ओर जाने वाली सड़क संकरी है, इसलिए सावधानी से गाड़ी चलाएं।
