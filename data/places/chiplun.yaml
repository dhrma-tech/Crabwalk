  how_to_reach: On the southern bank of the Vashishti river, about 10 km from Chiplun.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Gowalkot
  is_hidden_gem: false
  text:
    en:
      short_story: 'Gowalkot is a ruined stone fort on the southern bank of the Vashishti
        river, near Chiplun. The river guards three sides and a trench the fourth,
        and the hilltop gives wide views of the river and valley.


        About 22 old cannons lie around the fort, the longest 7.5 feet. There is a
        dry well inside and a temple to goddess Karanjeshwari at the foot of the hill.
        Seeing it all takes about an hour.'
      history: Sources say Siddi Habshi of Janjira built it around 1690, while also
        saying Shivaji won it in 1660 and renamed it Govindgad, so the dates conflict.
        Sambhaji Maharaj later lost it to the Siddis. Ten cannons were moved here
        from the port area in May 2017.
      significance: A river fort near Chiplun, also known as Govindgad.
      dos: '- Keep about an hour for the full fort

        - Visit the Karanjeshwari temple at the foothills'
      donts: '- Don''t climb on the cannons'
      safety_text: '- The ruins are uneven and overgrown in places; wear proper shoes'
    mr:
      short_story: 'गोवळकोट हा चिपळूणजवळ वाशिष्ठी नदीच्या दक्षिण तीरावर असलेला एक
        उध्वस्त दगडी किल्ला आहे. या किल्ल्याला तीन बाजूंनी नदीचा आणि चौथ्या बाजूने
        खंदकाचा वेढा आहे. इथल्या टेकडीवरून नदी आणि दरीचा विस्तीर्ण नजारा पाहायला मिळतो.


        किल्ल्याच्या परिसरात सुमारे 22 जुन्या तोफा पडलेल्या आहेत, त्यातील सर्वात लांब
        तोफ 7.5 फूट आहे. किल्ल्याच्या आत एक कोरडी विहीर आहे आणि टेकडीच्या पायथ्याशी
        करंजेश्वरी देवीचे मंदिर आहे. संपूर्ण किल्ला पाहण्यासाठी साधारण एक तास लागतो.'
      history: काही नोंदींनुसार सिद्दी हबशीने हा किल्ला 1690 च्या सुमारास बांधला,
        तर दुसरीकडे छत्रपती शिवाजी महाराजांनी 1660 मध्ये तो जिंकून त्याचे नाव गोविंदगड
        ठेवल्याचा उल्लेख आहे, त्यामुळे या तारखांमध्ये तफावत आहे. नंतर छत्रपती संभाजी
        महाराजांच्या काळात हा किल्ला सिद्दींच्या ताब्यात गेला. मे 2017 मध्ये बंदर
        परिसरातून दहा तोफा येथे हलवण्यात आल्या.
      significance: चिपळूणजवळील एक नदीकाठचा किल्ला, जो गोविंदगड म्हणूनही ओळखला जातो.
      dos: '- संपूर्ण किल्ला पाहण्यासाठी सुमारे एक तासाचा वेळ हाताशी ठेवा

        - पायथ्याशी असलेल्या करंजेश्वरी देवीच्या मंदिराला भेट द्या'
      donts: '- तोफांवर चढू नका'
      safety_text: '- इथले अवशेष ओबडधोबड आहेत आणि काही ठिकाणी झाडी वाढलेली आहे; त्यामुळे
        योग्य बूट घाला'
    hi:
      short_story: 'गोवालकोट चिपलून के पास वशिष्ठी नदी के दक्षिणी तट पर स्थित एक खंडहर
        नुमा पत्थर का किला है। नदी तीन तरफ से और एक खाई चौथी तरफ से इसकी रक्षा करती
        है। यहाँ की पहाड़ी से नदी और घाटी का विस्तृत नजारा दिखता है।


        किले के आसपास लगभग 22 पुरानी तोपें पड़ी हैं, जिनमें सबसे लंबी तोप 7.5 फीट
        की है। इसके अंदर एक सूखा कुआँ है और पहाड़ी की तलहटी में देवी करंजेश्वरी का
        मंदिर है। इस पूरे किले को देखने में लगभग एक घंटा लगता है।'
      history: स्रोतों का कहना है कि जंजीरा के सिद्दी हबशी ने इसे 1690 के आसपास बनाया
        था, जबकि यह भी कहा जाता है कि शिवाजी ने इसे 1660 में जीतकर इसका नाम गोविंदगढ़
        रखा था, इसलिए तारीखों में मतभेद है। बाद में संभाजी महाराज के समय यह सिद्दियों
        के हाथों छिन गया। मई 2017 में बंदरगाह क्षेत्र से दस तोपों को यहाँ लाया गया
        था।
      significance: चिपलून के पास एक नदी का किला, जिसे गोविंदगढ़ भी कहा जाता है।
      dos: '- पूरे किले को देखने के लिए लगभग एक घंटे का समय निकालें

        - तलहटी में स्थित करंजेश्वरी मंदिर के दर्शन करें'
      donts: '- तोपों के ऊपर न चढ़ें'
      safety_text: '- यहाँ के खंडहर ऊबड़-खाबड़ हैं और कुछ जगहों पर झाड़ियाँ उगी हुई
        हैं; इसलिए सही जूते पहनें'
