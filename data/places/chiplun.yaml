    mr:
      short_story: चिपळूणमधील रावळतळे भागात असलेले विंध्यवासिनी मंदिर हे देवीच्या
        रौद्र महिषासुर मर्दिनी रूपाला समर्पित आहे. होयसळ शैलीतील ही मूर्ती सुमारे
        800 ते 1,000 वर्षे जुनी असावी असा अंदाज आहे. या मूर्तीला आठ हात असून त्यात
        शस्त्रे आहेत आणि देवीच्या पायाशी एक रेडा आहे. येथे मयूरावर आरूढ झालेली कार्तिकेयाचीही
        मूर्ती आहे.
      history: हे मंदिर कदाचित यादव काळातील असावे. परकीय आक्रमणांच्या वेळी कोळी समाजातील
        बाराव यांनी ही मूर्ती दगड आणि ढिगाऱ्याखाली लपवून ठेवल्याची आख्यायिका आहे.
