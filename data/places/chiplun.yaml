  text:
    en:
      short_story: 'Gowalkot Jetty is located on the southern bank of the Vashishti
        River, adjacent to Govalkot Fort, approximately 10 kilometers from Chiplun.
        It is situated at the base of the fort''s western ramparts.


        Visitors can reach the jetty by descending through a ruined north-facing gate
        of the fort. At the port area, there are five antique cannons partially buried
        upside down in the ground.'
      history: The jetty served as a vital port on the Vashishti River trade route,
        with control of the area shifting between the Siddhis, Marathas, and the British
        East India Company.
      significance: A historic river port featuring buried cannons from the Maratha
        and British eras.
      dos: '- Explore the ruined western gate connecting the fort to the jetty.

        - View the partially buried antique cannons near the port.'
      donts: '- Do not deface the historical ruins or the cannons.'
      safety_text: Watch your step near the ruined structures and the riverbank, as
        the ground can be uneven.
    mr:
      short_story: 'गोवळकोट धक्का (जेट्टी) चिपळूणपासून सुमारे 10 किलोमीटर अंतरावर,
        ऐतिहासिक गोवळकोट किल्ल्याला लागून वाशिष्ठी नदीच्या दक्षिण तीरावर आहे. हा धक्का
        किल्ल्याच्या पश्चिमेकडील तटाच्या पायथ्याशी आहे.


        किल्ल्याच्या उत्तरेकडे असलेल्या एका पडक्या दरवाज्यातून खाली उतरून पर्यटक या
        धक्क्यापर्यंत पोहोचू शकतात. या बंदर परिसरात पाच जुन्या तोफा जमिनीवर उलट्या
        पुरलेल्या अवस्थेत पाहायला मिळतात.'
      history: हा धक्का वाशिष्ठी नदीवरील व्यापारी मार्गावरील एक महत्त्वाचे बंदर होते.
        लगतच्या परिसरावर सिद्दी, मराठे आणि ब्रिटिश ईस्ट इंडिया कंपनीने वेगवेगळ्या
        काळात राज्य केले.
      significance: मराठा आणि ब्रिटिश काळातील पुरलेल्या तोफा असलेले एक ऐतिहासिक नदी
        बंदर.
      dos: '- किल्ल्याला धक्क्याशी जोडणाऱ्या पश्चिमेकडील पडक्या दरवाजाची पाहणी करा.

        - बंदर परिसराजवळ अर्धवट पुरलेल्या जुन्या तोफा नक्की पहा.'
      donts: '- ऐतिहासिक वास्तू किंवा तोफांचे विद्रूपीकरण करू नका.'
      safety_text: पडक्या वास्तू आणि नदीकिनाऱ्याजवळ चालताना काळजी घ्या, कारण येथील
        जमीन चढ-उताराची असू शकते.
    hi:
      short_story: 'गोवलकोट जेट्टी चिपलून से लगभग 10 किलोमीटर दूर ऐतिहासिक गोवलकोट
        किले के बगल में वशिष्ठी नदी के दक्षिणी तट पर स्थित है। यह किले की पश्चिमी
        प्राचीर के आधार पर मौजूद है।


        आगंतुक किले के उत्तर की ओर मुख वाले एक खंडहर द्वार से नीचे उतरकर जेट्टी तक
        पहुंच सकते हैं। बंदरगाह क्षेत्र में पांच प्राचीन तोपें ज़मीन में उल्टी गड़ी
        हुई देखी जा सकती हैं।'
      history: यह जेट्टी वशिष्ठी नदी के व्यापार मार्ग पर एक महत्वपूर्ण बंदरगाह के
        रूप में कार्य करती थी, और इस क्षेत्र का नियंत्रण सिद्धियों, मराठों और ब्रिटिश
        ईस्ट इंडिया कंपनी के बीच बदलता रहा।
      significance: मराठा और ब्रिटिश काल की ज़मीन में गड़ी तोपों वाला एक ऐतिहासिक
        नदी बंदरगाह।
      dos: '- किले को जेट्टी से जोड़ने वाले पश्चिमी खंडहर द्वार को देखें।

        - बंदरगाह के पास ज़मीन में आंशिक रूप से गड़ी हुई पुरानी तोपों को देखें।'
      donts: '- ऐतिहासिक खंडहरों या तोपों को नुकसान न पहुंचाएं।'
      safety_text: खंडहरों और नदी के किनारे चलते समय ध्यान रखें, क्योंकि ज़मीन ऊबड़-खाबड़
        हो सकती है।
