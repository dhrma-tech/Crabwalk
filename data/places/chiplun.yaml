  text:
    en:
      short_story: 'The Parshuram temple sits on a hill at Parshuram village, about
        11 km from Chiplun toward Mumbai, right off the Mumbai-Goa highway. It is
        dedicated to Parashurama, the sixth avatar of Vishnu, who in local belief
        created the Konkan coast.


        The complex has three temples, a tall stone deepmal for oil lamps and a pilgrim
        lodge. Locals say Parashurama leaves for the Himalayas at sunrise and returns
        here at sunset.'
      history: The temple was built at the initiative of Swami Paramhans Brahmendra,
        with financial help from Siddi Rasul Yakut Khan in 1700. In 1726 the Siddis
        demolished it over a dispute about an elephant, and it was later rebuilt.
        It is run by the Shree Dev Bhargavram Devasthan Trust.
      significance: The main shrine to Parashurama in the Konkan, the figure credited
        with creating the coast.
      dos: '- Visit on Akshaya Tritiya, Ram Navami or Mahashivratri for the festivals

        - Stop at Sawatsada waterfall nearby in the monsoon'
      donts: '- Don''t carry footwear into the shrines'
      safety_text: null
    mr:
      short_story: 'परशुराम मंदिर मुंबई-गोवा महामार्गावरून चिपळूणहून मुंबईच्या दिशेने
        सुमारे 11 किमी अंतरावर परशुराम गावात एका टेकडीवर आहे. हे मंदिर विष्णूचा सहावा
        अवतार असलेल्या परशुरामाला समर्पित आहे. स्थानिक मान्यतेनुसार त्यांनीच कोकण
        किनारपट्टीची निर्मिती केली.


        या मंदिर संकुलात तीन मंदिरे, दिव्यांसाठी एक उंच दगडी दीपमाळ आणि भाविकांसाठी
        धर्मशाळा आहे. स्थानिकांच्या म्हणण्यानुसार, परशुराम सूर्योदयावेळी हिमालयात
        जातात आणि सूर्यास्ताच्या वेळी येथे परत येतात.'
      history: हे मंदिर स्वामी परमहंस ब्रह्मेंद्र यांच्या पुढाकाराने आणि सिद्दी रसूल
        याकूत खान यांच्या आर्थिक मदतीने 1700 मध्ये बांधले गेले. एका हत्तीवरून झालेल्या
        वादातून 1726 मध्ये सिद्दींनी ते पाडले, आणि नंतर त्याची पुन्हा बांधणी करण्यात
        आली. श्री देव भार्गवराम देवस्थान ट्रस्ट याचा कारभार पाहतो.
      significance: किनारपट्टी निर्माण करण्याचे श्रेय असलेल्या परशुरामाचे कोकणातील
        मुख्य मंदिर.
      dos: '- उत्सवांसाठी अक्षय्य तृतीया, राम नवमी किंवा महाशिवरात्रीला भेट द्या

        - पावसाळ्यात जवळच असलेल्या सवतसडा धबधब्याला नक्की भेट द्या'
      donts: '- मंदिरात चप्पल किंवा बूट घालून जाऊ नका'
      safety_text: null
    hi:
      short_story: 'परशुराम मंदिर मुंबई-गोवा राजमार्ग के पास, चिपलून से मुंबई की ओर
        लगभग 11 किमी दूर परशुराम गाँव में एक पहाड़ी पर स्थित है। यह मंदिर विष्णु के
        छठे अवतार परशुराम को समर्पित है। स्थानीय मान्यताओं के अनुसार, उन्होंने ही
        कोंकण तट का निर्माण किया था।


        इस मंदिर परिसर में तीन मंदिर, दीयों के लिए एक ऊँचा पत्थर का दीपमाल और तीर्थयात्रियों
        के ठहरने के लिए एक धर्मशाला है। स्थानीय लोगों का कहना है कि परशुराम सूर्योदय
        के समय हिमालय जाते हैं और सूर्यास्त के समय यहाँ लौट आते हैं।'
      history: यह मंदिर स्वामी परमहंस ब्रह्मेंद्र की पहल पर और सिद्दी रसूल याकूत खान
        की आर्थिक मदद से 1700 में बनाया गया था। 1726 में एक हाथी को लेकर हुए विवाद
        के कारण सिद्दियों ने इसे ध्वस्त कर दिया था, और बाद में इसे फिर से बनाया गया।
        इसका संचालन श्री देव भार्गवराम देवस्थान ट्रस्ट करता है।
      significance: तट का निर्माण करने का श्रेय पाने वाले परशुराम का कोंकण में मुख्य
        मंदिर।
      dos: '- त्योहारों के समय अक्षय तृतीया, राम नवमी या महाशिवरात्रि पर दर्शन करें

        - मानसून में पास ही स्थित सवतसडा झरने पर रुकें'
      donts: '- मंदिर के अंदर जूते-चप्पल लेकर न जाएँ'
      safety_text: null
