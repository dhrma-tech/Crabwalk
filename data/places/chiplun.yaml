  status: ai_draft
  name_en: Gowalkot Fort (Govindgad)
  name_mr: गोवळकोट किल्ला (गोविंदगड)
  name_hi: गोवालकोट किला (गोविंदगढ़)
  category: fort
  taluka: Chiplun
  lat: 17.546607
  lng: 73.487846
  coord_source: osm node/9198729624
  osm_id: node/9198729624
  entry_fee_text: null
  entry_fee_inr: null
