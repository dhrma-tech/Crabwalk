  text:
    en:
      short_story: 'Visawa Point is a roadside viewpoint located on the Mumbai-Goa
        Highway in Parshuram Ghat, near Parshi Village in Chiplun. It serves as a
        known rest stop for travelers passing through the Ratnagiri district.


        From this vantage point, visitors can see the surrounding valleys and the
        Vashishti River basin below the ghats. It is an open highway pull-off area
        designed for short breaks.'
      history: It historically served as a stopover for travelers navigating the Mumbai-Goa
        route.
      significance: A convenient highway viewpoint offering expansive sights of the
        Parshuram Ghat and Vashishti River valley.
      dos: '- Park your vehicle safely off the highway while enjoying the view.'
      donts: '- Do not cross the busy highway on foot.'
      safety_text: Traffic on the Mumbai-Goa highway can be fast-moving, so exercise
        caution when pulling over or re-entering the road.
    mr:
      short_story: 'विसावा पॉईंट हा मुंबई-गोवा महामार्गावर परशुराम घाटात, चिपळूणमधील
        पाग (पार्शी) गावाजवळ असलेला एक व्ह्यू पॉईंट आहे. रत्नागिरी जिल्ह्यातून प्रवास
        करणाऱ्या प्रवाशांसाठी हे एक विश्रांतीचे ठिकाण आहे.


        या ठिकाणाहून पर्यटकांना आजूबाजूच्या दऱ्या आणि घाटाखालील वाशिष्ठी नदीच्या खोऱ्याचे
        विस्तीर्ण दृश्य पाहायला मिळते. थोडा वेळ थांबण्यासाठी महामार्गालगतच ही मोकळी
        जागा तयार करण्यात आली आहे.'
      history: मुंबई-गोवा मार्गावरून जाणाऱ्या प्रवाशांसाठी हे ऐतिहासिकदृष्ट्या एक
        महत्त्वाचे विश्रांतीचे ठिकाण होते.
      significance: परशुराम घाट आणि वाशिष्ठी नदीच्या खोऱ्याचे विस्तीर्ण दृश्य दाखवणारा
        महामार्गावरील एक सोयीस्कर व्ह्यू पॉईंट.
      dos: '- दृश्य पाहताना तुमचे वाहन महामार्गाच्या बाजूला सुरक्षितपणे पार्क करा.'
      donts: '- रहदारीचा महामार्ग चालत ओलांडू नका.'
      safety_text: मुंबई-गोवा महामार्गावर वाहनांचा वेग जास्त असतो, त्यामुळे गाडी थांबवताना
        किंवा पुन्हा रस्त्यावर आणताना काळजी घ्या.
    hi:
      short_story: 'विसावा पॉइंट चिपलून में पारशी गांव के पास परशुराम घाट में मुंबई-गोवा
        राजमार्ग पर स्थित एक व्यूप्वाइंट है। रत्नागिरी जिले से गुजरने वाले यात्रियों
        के लिए यह आराम करने का एक जाना-माना स्थान है।


        इस स्थान से आगंतुक आसपास की घाटियों और घाट के नीचे बहने वाली वशिष्ठी नदी की
        घाटी के विस्तृत दृश्य देख सकते हैं। यह हाईवे के किनारे बनी एक खुली जगह है
        जिसे छोटे ब्रेक के लिए डिज़ाइन किया गया है।'
      history: ऐतिहासिक रूप से यह मुंबई-गोवा मार्ग से गुजरने वाले यात्रियों के लिए
        एक ठहराव के रूप में कार्य करता था।
      significance: एक सुविधाजनक हाईवे व्यूप्वाइंट जो परशुराम घाट और वशिष्ठी नदी घाटी
        के विस्तृत दृश्य प्रस्तुत करता है।
      dos: '- नज़ारों का आनंद लेते समय अपने वाहन को हाईवे से किनारे सुरक्षित रूप से
        पार्क करें।'
      donts: '- व्यस्त राजमार्ग को पैदल पार न करें।'
      safety_text: मुंबई-गोवा राजमार्ग पर ट्रैफिक बहुत तेज़ हो सकता है, इसलिए वाहन
        रोकते या वापस सड़क पर आते समय सावधानी बरतें।
