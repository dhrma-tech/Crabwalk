  text:
    en:
      short_story: 'Kumbharli Ghat is the mountain pass on the Chiplun-Karad state
        highway, where the road climbs the Western Ghats from Ratnagiri district into
        Satara district. The road runs at an average height of about 625 m.


        It is one of the few road links between the Konkan coast and the Desh plateau.
        Koyna Dam lies near the eastern end of the pass.'
      history: Peshwa Bajirao II is recorded to have come down the Kumbharli pass
        between 1812 and 1815 on his way to Guhagar.
      significance: The main road route from Chiplun up to Karad and the Koyna area.
      dos: '- Drive it in daylight

        - Combine it with a visit to Koyna Dam at the top'
      donts: '- Don''t stop on blind curves for photos'
      safety_text: Landslides and accidents are reported in the monsoon, including
        a wall collapse and a fatal car crash into a gorge in 2025. Check road status
        after heavy rain and drive slowly.
    mr:
      short_story: 'कुंभार्ली घाट हा चिपळूण-कराड राज्य महामार्गावरील डोंगरमार्ग आहे,
        जिथे रस्ता रत्नागिरी जिल्ह्यातून सह्याद्री ओलांडून सातारा जिल्ह्यात प्रवेश
        करतो. हा रस्ता सरासरी सुमारे 625 मीटर उंचीवरून धावतो.


        कोकण किनारपट्टी आणि देश पठार यांच्यातील मोजक्या रस्ते मार्गांपैकी हा एक आहे.
        या घाटमार्गाच्या पूर्व टोकाजवळ कोयना धरण आहे.'
      history: पपेशवा बाजीराव दुसरे हे 1812 ते 1815 दरम्यान गुहागरला जात असताना कुंभार्ली
        घाटातून खाली उतरल्याची नोंद आहे.
      significance: चिपळूणवरून कराड आणि कोयना परिसराकडे जाणारा मुख्य रस्ता मार्ग.
      dos: '- दिवसाजेव्हा उजाडलेला असतो तेव्हाच वाहन चालवा

        - शिखरावर असलेल्या कोयना धरणाला भेटीची जोड द्या'
      donts: '- फोटो काढण्यासाठी आंधळ्या वळणांवर (ब्लाईंड कव्हर्स) गाडी थांबवू नका'
      safety_text: पावसाळ्यात दरडी कोसळणे आणि अपघात झाल्याचे वृत्त येते, ज्यामध्ये
        2025 मधील भिंत कोसळणे आणि एका दरीत झालेल्या कार अपघाताचा समावेश आहे. मुसळधार
        पावसानंतर रस्त्याची स्थिती तपासा आणि वाहन हळू चालवा.
    hi:
      short_story: 'कुंभार्ली घाट चिपळूण-कराड राज्य राजमार्ग पर स्थित पहाड़ी दर्रा
        है, जहाँ सड़क रत्नागिरी जिले से पश्चिमी घाट पार करते हुए सातारा जिले में प्रवेश
        करती है। यह सड़क औसतन लगभग 625 मीटर की ऊँचाई पर चलती है।


        यह कोंकण तट और देश के पठार के बीच सड़क के कुछ मुख्य मार्गों में से एक है।
        कोयना बांध दर्रे के पूर्वी छोर के पास स्थित है।'
      history: पेशवा बाजीराव द्वितीय के बारे में दर्ज है कि वे 1812 और 1815 के बीच
        गुहागर जाते समय कुंभार्ली दर्रे से नीचे उतरे थे।
      significance: चिपळूण से कराड और कोयना क्षेत्र तक जाने का मुख्य सड़क मार्ग।
      dos: '- दिन के उजाले में गाड़ी चलाएं

        - ऊपर कोयना बांध की यात्रा के साथ इसे जोड़ें'
      donts: '- फोटो के लिए अंधे मोड़ (ब्लाइंड कर्व्स) पर न रुकें'
      safety_text: मानसून में भूस्खलन और दुर्घटनाओं की खबरें आती हैं, जिसमें 2025
        में एक दीवार का गिरना और खाई में कार की घातक दुर्घटना शामिल है। भारी बारिश
        के बाद सड़क की स्थिति की जाँच करें और धीरे गाड़ी चलाएं।
