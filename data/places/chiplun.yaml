        to the goddess in her fierce Mahishasur Mardini form. The Hoysala-style idol,
        estimated at 800 to 1,000 years old, has eight arms holding weapons and a
        buffalo at her feet. There is also an idol of Kartikeya on a peacock.
      history: The temple may date to the Yadava era. During invasions, Bararav of
        the Koli community is said to have hidden it under stones and debris. Chhatrapati
        Sambhaji Maharaj later restored it; 1976 marked its 300th anniversary.
      significance: null
      dos: '- Visit during Navratri for the main festival'
      donts: '- Don''t carry footwear into the temple'
