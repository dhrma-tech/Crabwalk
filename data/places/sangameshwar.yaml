- slug: prachitgad-fort
  status: ai_draft
  name_en: Prachitgad Fort
  name_mr: प्रचितगड किल्ला
  name_hi: प्रचितगढ़ किला
  category: fort
  taluka: Sangameshwar
  lat: 17.225619
  lng: 73.690495
  coord_source: osm node/7196520969
  osm_id: node/7196520969
  entry_fee_text: null
  entry_fee_inr: null
  visit_minutes: 480
  opens: null
  closes: null
  closed_days: []
  best_time: null
  how_to_reach: From Kasba Sangameshwar to Shringarpur village (about 17 km), then
    a 2,500 ft climb.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: closed
  monsoon_reason: Avoid during the monsoon and the two months after.
  is_tide_dependent: false
  seasons: []
  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Prachitgad stands on the Sahyadri crest on the Ratnagiri-Sangli
        border. The base village is Shringarpur, about 17 km by road from Kasba Sangameshwar.
        The climb is about 2,500 feet, with six iron ladders, and the round trip takes
        around 8 hours.


        At the top are rock-cut tanks, a Bhairi Bhavani temple, five small cannons
        and bastions.'
      history: It was likely built to watch the Tivre and Rede ghats, possibly before
        Shivaji's time. It was linked to the Surve family, captured by Shivaji's forces
        in 1660, and taken by the British in 1818.
      significance: null
      dos: '- Take a local guide from Shringarpur

        - Start early in the morning

        - Carry enough water; there is none on the way'
      donts: '- Don''t climb without a guide or experienced companion

        - Don''t go in the monsoon or the two months after'
      safety_text: '- Steep, gravelly and slippery trail with a deep ravine near the
        north gate'
    mr:
      short_story: 'प्रचितगड हा रत्नागिरी-सांगलीच्या सीमेवर सह्याद्रीच्या मुख्य रांगेवर
        स्थित आहे. याच्या पायथ्याचे गाव शृंगारपूर आहे, जे कसबा संगमेश्वरपासून रस्त्याने
        सुमारे 17 किमी अंतरावर आहे. किल्ल्याची चढाई सुमारे 2,500 फुटांची आहे, ज्यामध्ये
        सहा लोखंडी शिड्या लागतात आणि जाऊन-येऊन साधारण 8 तास लागतात.


        माथ्यावर खडकात कोरलेली पाण्याची टाकी, एक भैरी भवानी मंदिर, पाच लहान तोफा आणि
        बुरूज आहेत.'
      history: तिवरे आणि रेडे घाटावर लक्ष ठेवण्यासाठी शिवकाळापूर्वीच हा किल्ला बांधला
        गेला असण्याची शक्यता आहे. हा किल्ला सुर्वे घराण्याशी संबंधित होता, 1660 मध्ये
        शिवरायांच्या सैन्याने तो जिंकला आणि 1818 मध्ये तो ब्रिटिशांच्या ताब्यात गेला.
      significance: null
      dos: '- शृंगारपूरहून सोबत स्थानिक वाटाड्या (गाईड) घ्या

        - सकाळी लवकर चढायला सुरुवात करा

        - सोबत पुरेसे पाणी ठेवा; वाटेत पाणी नाही'
      donts: '- वाटाड्या किंवा अनुभवी सोबत्याशिवाय चढाई करू नका

        - पावसाळ्यात किंवा त्यानंतरचे दोन महिने जाऊ नका'
      safety_text: '- उत्तरेकडच्या दरवाज्याजवळ खोल दरी असून इथली वाट अत्यंत खडी, निसरडी
        आणि घसाऱ्याची आहे'
    hi:
      short_story: 'प्रचितगढ़ रत्नागिरी-सांगली सीमा पर सह्याद्री की चोटी पर स्थित
        है। इसका आधार गाँव श्रृंगारपुर है, जो सड़क मार्ग से कस्बा संगमेश्वर से लगभग
        17 किमी दूर है। इसकी चढ़ाई लगभग 2,500 फीट है, जिसमें छह लोहे की सीढ़ियाँ हैं,
        और पूरी यात्रा में लगभग 8 घंटे लगते हैं।


        चोटी पर चट्टानों को काटकर बनाए गए पानी के कुंड, एक भैरी भवानी मंदिर, पांच
        छोटी तोपें और गढ़ (बुर्ज) हैं।'
      history: इसे संभवतः तिवरे और रेडे घाटों पर नजर रखने के लिए शिवाजी के समय से
        पहले बनाया गया था। यह सुर्वे परिवार से जुड़ा था, जिसे 1660 में शिवाजी की सेना
        ने अपने कब्जे में ले लिया और 1818 में अंग्रेजों ने इसे जीत लिया।
      significance: null
      dos: '- श्रृंगारपुर से एक स्थानीय गाइड लें

        - सुबह जल्दी शुरू करें

        - पर्याप्त पानी साथ रखें; रास्ते में पानी नहीं है'
      donts: '- गाइड या अनुभवी साथी के बिना न चढ़ें

        - मानसून या उसके दो महीने बाद तक न जाएं'
      safety_text: '- उत्तरी द्वार के पास एक गहरी खाई है और यहाँ का रास्ता बहुत खड़ी,
        बजरी वाली और फिसलन भरी है'
