  text:
    en:
      short_story: 'Marleshwar is a Shiva temple inside a cave in the Sahyadri hills,
        18 km from Devrukh in Sangameshwar taluka. A large waterfall flows close by
        and is at its best in the monsoon.


        Every Makar Sankranti a big fair celebrates the wedding of Marleshwar and
        goddess Girija, with bhajans, kirtans and Dashavatar plays over two days.'
      history: null
      significance: One of the most visited Shiva shrines in the district, famous
        for its Makar Sankranti fair.
      dos: '- Visit in the monsoon for the waterfall

        - Plan around Makar Sankranti if you want to see the fair'
      donts: '- Don''t carry footwear into the cave'
      safety_text: '- Paths get muddy and slippery in the rain

        - The temple may close when the waterfall floods the cave area'
    mr:
      short_story: 'मार्लेश्वर हे संगमेश्वर तालुक्यातील देवरुखपासून 18 किमी अंतरावर
        सह्याद्रीच्या पर्वतरांगांमधील एका गुहेत वसलेले शिवमंदिर आहे. जवळूनच एक मोठा
        धबधबा वाहतो जो पावसाळ्यात सर्वात सुंदर दिसतो.


        दर मकर संक्रांतीला इथे मार्लेश्वर आणि गिरिजा देवीच्या विवाहाचा मोठा उत्सव
        साजरा केला जातो. या जत्रेत दोन दिवस भजन, कीर्तन आणि दशावताराचे खेळ चालतात.'
      history: null
      significance: जिल्ह्यातील सर्वात प्रसिद्ध शिवमंदिरांपैकी एक, मकर संक्रांतीच्या
        जत्रेसाठी प्रसिद्ध.
      dos: '- धबधबा पाहण्यासाठी पावसाळ्यात भेट द्या

        - जत्रा पाहायची असेल तर मकर संक्रांतीच्या आसपास नियोजन करा'
      donts: '- गुहेत पादत्राणे (चप्पल/बूट) घालून जाऊ नका'
      safety_text: '- पावसात वाटा चिखलाच्या आणि निसरड्या होतात

        - जेव्हा धबधब्याचे पाणी गुहेच्या परिसरात येते तेव्हा मंदिर बंद केले जाऊ शकते'
    hi:
      short_story: 'मार्लेश्वर संगमेश्वर तालुका में देवरुख से 18 किमी दूर सह्याद्री
        की पहाड़ियों में एक गुफा के अंदर स्थित एक शिव मंदिर है। इसके पास ही एक बड़ा
        जलप्रपात बहता है जो मानसून में बहुत खूबसूरत दिखता है।


        हर मकर संक्रांति पर यहाँ मार्लेश्वर और देवी गिरिजा की शादी का जश्न मनाने के
        लिए एक बड़ा मेला लगता है, जिसमें दो दिनों तक भजन, कीर्तन और दशावतार नाटक होते
        हैं।'
      history: null
      significance: जिले के सबसे अधिक देखे जाने वाले शिव मंदिरों में से एक, जो अपने
        मकर संक्रांति मेले के लिए प्रसिद्ध है।
      dos: '- जलप्रपात देखने के लिए मानसून में जाएँ

        - यदि आप मेला देखना चाहते हैं तो मकर संक्रांति के आसपास की योजना बनाएँ'
      donts: '- गुफा के अंदर जूते-चप्पल न ले जाएं'
      safety_text: '- बारिश में रास्ते कीचड़ भरे और फिसलन वाले हो जाते हैं

        - जब जलप्रपात का पानी गुफा क्षेत्र में भर जाता है तो मंदिर बंद किया जा सकता
        है'
  photo:
    file_url: https://upload.wikimedia.org/wikipedia/commons/4/45/Marleshwar_temple.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original
    credit: Pranav
