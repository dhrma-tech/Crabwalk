  text:
    en:
      short_story: 'Mahimatgad is a hill fort in Sangameshwar taluka, reached via
        Devrukh and Bellari to the base village of Nigudwadi or Kundi. It once guarded
        the old trade road from Sangameshwar to Kolhapur.


        The fort has seven rock-cut cisterns, an east gate, a citadel, a dry lake
        and a Mahishasurmardini temple. From Nigudwadi it is about an hour on a rough
        road and then about 1.5 hours on foot.'
      history: Its cisterns suggest it predates Shivaji, who captured it together
        with Prachitgad in 1661.
      significance: null
      dos: '- Start early

        - Carry water'
      donts: null
      safety_text: '- Thick, thorny bushes on the paths

        - The approach road was badly damaged as of 2019'
    mr:
      short_story: 'महिमतगड हा संगमेश्वर तालुक्यातील एक गिरीदुर्ग आहे, जिथे देवरुख
        आणि बेल्लारीमार्गे पायथ्याच्या निगुडवाडी किंवा कुंडी गावाला पोहोचता येते.
        या किल्ल्याने पूर्वी संगमेश्वर ते कोल्हापूर या जुन्या व्यापारी मार्गाचे रक्षण
        केले होते.


        किल्ल्यावर खडकात कोरलेली सात पाण्याची टाकी, एक पूर्वेकडचा दरवाजा, बालेकिल्ला,
        एक कोरडा तलाव आणि महिषासुरमर्दिनीचे मंदिर आहे. निगुडवाडीपासून खराब रस्त्याने
        सुमारे एक तास आणि त्यानंतर पायी सुमारे 1.5 तास लागतात.'
      history: इथली पाण्याची टाकी सुचवतात की हा किल्ला शिवकाळापूर्वीचा आहे. 1661 मध्ये
        प्रचितगडासोबतच शिवरायांनी हा किल्लाही जिंकून घेतला.
      significance: null
      dos: '- लवकर सुरुवात करा

        - सोबत पाणी ठेवा'
      donts: null
      safety_text: '- वाटेवर दाट आणि काटेरी झुडपे आहेत

        - 2019 च्या माहितीनुसार इथला रस्ता खूप खराब झाला होता'
    hi:
      short_story: 'महिमतगढ़ संगमेश्वर तालुका में एक पहाड़ी किला है, जहाँ देवरुख और
        बेल्लारी होते हुए आधार गाँव निगुडवाड़ी या कुंडी तक पहुँचा जा सकता है। इसने
        कभी संगमेश्वर से कोल्हापुर तक के पुराने व्यापार मार्ग की रक्षा की थी।


        किले में सात चट्टानों को काटकर बनाए गए कुंड, एक पूर्वी द्वार, एक मुख्य गढ़,
        एक सूखी झील और एक महिषासुरमर्दिनी मंदिर है। निगुडवाड़ी से ऊबड़-खाबड़ रास्ते
        पर लगभग एक घंटा और फिर पैदल लगभग 1.5 घंटे लगते हैं।'
      history: इसके कुंडों से पता चलता है कि यह शिवाजी के समय से पहले का है, जिन्होंने
        1661 में प्रचितगढ़ के साथ इसे भी जीत लिया था।
      significance: null
      dos: '- जल्दी शुरू करें

        - पानी साथ रखें'
      donts: null
      safety_text: '- रास्तों पर घनी, कांटेदार झाड़ियाँ हैं

        - 2019 तक इसके पहुँच मार्ग की हालत बहुत खराब थी'
