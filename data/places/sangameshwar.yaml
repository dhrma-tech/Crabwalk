  text:
    en:
      short_story: 'The Amnayeshwar temple in Burambad village is a black stone Shiva
        temple in Hemadpanti style with five spires. It is the family deity of many
        Konkanastha Brahmins. Darshan is from 6 am to 12:30 pm and 4 pm to 8:30 pm.


        Inside are a large single-stone Nandi, a Shivling about 6.5 feet tall with
        eleven silver spouts dripping water on it, and carvings of elephants, peacocks
        and wrestlers on the outer walls. A stone pond with four tirthas and a tall
        deepmal stand in the courtyard.'
      history: Tradition says the Pandavas built the temple in a single night. Another
        legend tells of a stone that split into three, giving the Kataleshwar, Kalpeshwar
        and Amnayeshwar shrines. The temple was renovated a few years ago.
      significance: An old black-stone Hemadpanti Shiva temple, family deity of many
        Konkanastha Brahmins.
      dos: '- Visit on Mahashivratri or Tripurari Pournima for the festivals

        - Look for the four tirthas in the pond when the water is low'
      donts: '- Don''t visit between 12:30 and 4 pm; the temple is closed'
      safety_text: null
    mr:
      short_story: 'बुरंबाड गावातील आम्नायेश्वर मंदिर हे पाच शिखरे असलेली हेमांडपंथी
        शैलीतील काळ्या दगडातील शिवमंदिर आहे. हे अनेक कोकणस्थ ब्राह्मणांचे कुलदैवत
        आहे. दर्शन सकाळी 6 ते दुपारी 12:30 आणि दुपारी 4 ते रात्री 8:30 पर्यंत असते.


        आत एक मोठा एकात्मिक दगडी नंदी, सुमारे 6.5 फूट उंच पिंडी ज्यावर पाणी टिपकण्यासाठी
        अकरा चांदीचे प्रणाल (तोंडळे) आहेत, आणि बाहेरील भिंतीवर हत्ती, मोर आणि मल्लांची
        शिल्पे आहेत. प्रांगणात चार तीर्थांचे दगडी मळे आणि एक उंच दीपमाळ आहे.'
      history: परंपरेनुसार पांडवांनी हे मंदिर एकाच रात्रीत बांधले. दुसरी आख्यायिका
        एका दगडाची आहे जो तीन तुकड्यांत विभागला गेला, ज्यातून कातळेश्वर, कल्पेश्वर
        आणि आम्नायेश्वर ही मंदિरे निर्माण झाली. या मंदिराचा काही वर्षांपूर्वी जीर्णोद्धार
        करण्यात आला.
      significance: एक जुने काळ्या दगडाचे हेमांडपंथी शिवमंदिर, अनेक कोकणस्थ ब्राह्मणांचे
        कुलदैवत.
      dos: '- महाशिवरात्री किंवा त्रिपुरी पौर्णिमेच्या उत्सवासाठी भेट द्या

        - पाणी कमी असताना तलावातील चार तीर्थे पहा'
      donts: '- दुपारी 12:30 ते 4 दरम्यान भेट देऊ नका; मंदिर बंद असते'
      safety_text: null
    hi:
      short_story: 'बुरंबाड गाँव में आमनायेश्वर मंदिर पाँच शिखरों वाली हेमांडपंथी
        शैली का काले पत्थर का शिव मंदिर है। यह कई कोकणस्थ ब्राह्मणों का कुलदैवत है।
        दर्शन सुबह 6 बजे से दोपहर 12:30 बजे तक और दोपहर 4 बजे से रात 8:30 बजे तक होते
        हैं।


        अंदर एक बड़ा एक ही पत्थर से बना नंदी, लगभग 6.5 फीट ऊँचा शिवलिंग है जिस पर
        पानी टपकाने के लिए ग्यारह चाँदी की टोंटियाँ लगी हैं, और बाहरी दीवारों पर हाथियों,
        मोरों और पहलवानों की नक्काशी है। प्रांगण में चार तीर्थों वाला एक पत्थर का
        कुंड और एक ऊँचा दीपमाल स्तंभ है।'
      history: पारंपरिक कथा है कि पांडवों ने इस मंदिर को एक ही रात में बनाया था। एक
        अन्य किंवदंती एक ऐसे पत्थर के बारे में बताती है जो तीन हिस्सों में विभाजित
        हो गया, जिससे कातलेश्वर, कल्पेश्वर और आमनायेश्वर मंदिर बने। मंदिर का कुछ साल
        पहले जीर्णोद्धार किया गया था।
      significance: एक पुराना काले पत्थर का हेमांडपंथी शिव मंदिर, जो कई कोकणस्थ ब्राह्मणों
        का कुलदैवत है।
      dos: '- त्योहारों के लिए महाशिवरात्रि या त्रिपुरी पूर्णिमा पर जाएँ

        - जब पानी कम हो तो कुंड में चार तीर्थों को देखें'
      donts: '- दोपहर 12:30 और 4 बजे के बीच न जाएँ; मंदिर बंद रहता है'
      safety_text: null
