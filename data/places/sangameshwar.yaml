        संगमावर वसले आहे. परंपरेनुसार, या भागात पांडव काळातील सुमारे 360 मंदिरे होती
        असे म्हटले जाते. कर्णेश्वर मंदिर हे आज इथलं मुख्य आकर्षण आहे.
