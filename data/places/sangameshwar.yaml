  text:
    en:
      short_story: 'Bhavanigad Fort is a hill fort located near Kadvai village in
        the Sangameshwar taluka of Ratnagiri district. The trail to the fort passes
        through communities such as Mhadgewadi, Gosaviwadi, and Shirkewadi, leading
        up to a citadel area containing a temple, a bust of Chhatrapati Shivaji Maharaj,
        and an ancient idol of Goddess Bhavani.


        Visitors to the fort can observe ancient water cisterns located near the entrance
        and along the southern tip of the structure.'
      history: Experts claim the fort was built in the 14th century. Chhatrapati Shivaji
        Maharaj renovated it in 1661 and built the Bhavani Mata temple, and the British
        captured the fort in 1818.
      significance: A historic hill fort in Sangameshwar featuring the Bhavani Mata
        temple and ancient water cisterns.
      dos: '- Hire a local rickshaw or private vehicle to reach Kadvai or Mhadgewadi
        base villages

        - Follow the trail through Mhadgewadi, Gosaviwadi, and Shirkewadi'
      donts: '- Do not wander off designated trekking trails into dense vegetation'
      safety_text: The final approach involves a steep walking trail; exercise caution
        during the monsoon when paths may be slippery.
    mr:
      short_story: 'भवानीगड किल्ला हा रत्नागिरी जिल्ह्यातील संगमेश्वर तालुक्यातील
        कडकई (कडवई) गावाजवळ असलेला एक डोंगरी किल्ला आहे. या किल्ल्याकडे जाणारी वाट
        महाडवाडी, गोसावीवाडी आणि शिर्केवाडी या वस्त्यांमधून जाते, जिथे बालेकिल्ल्याच्या
        भागात एक मंदिर, छत्रपती शिवाजी महाराजांचा पुतळा आणि भवानी मातेची प्राचीन मूर्ती
        आहे.


        किल्ल्याला भेट देणाऱ्यांना प्रवेशजվळ आणि दक्षिणेकडील टोकावर प्राचीन पाण्याच्या
        टाक्या पाहायला मिळतात.'
      history: तज्ज्ञांच्या मते हा किल्ला 14 व्या शतकात बांधला गेला. छत्रपती शिवाजी
        महाराजांनी 1661 मध्ये या किल्ल्याचा जिर्णोद्धार करून भवानी मातेचे मंदिर बांधले
        आणि 1815 मध्ये ब्रिटिश सैन्याने हा किल्ला जिंकला.
      significance: भवानी मातेचे मंदिर आणि प्राचीन पाणी साठवण टाक्या असलेला संगमेश्वरमधील
        एक ऐतिहासिक डोंगरी किल्ला.
      dos: '- कडवई किंवा महाडवाडी पायथ्याच्या गावांपर्यंत पोहोचण्यासाठी स्थानिक रिक्षा
        किंवा खाजगी वाहनाचा वापर करा

        - महाडवाडी, गोसावीवाडी आणि शिर्केवाडी मार्गावरील पायवाटेने चाल ु राहा'
      donts: '- ठरवलेल्या ट्रेकिंग वाटेवरून बाजूला जंगलात जाऊ नका'
      safety_text: किल्ल्याच्या वाटेवर चढण आहे; पावसाळ्यात वाट सरकणी असू शकते त्यामुळे
        काळजी घ्या.
    hi:
      short_story: 'भवानीगढ़ किला रत्नागिरी जिले के संगमेश्वर तालुका में कडवई गांव
        के पास स्थित एक पहाड़ी किला है। किले की ओर जाने वाला रास्ता म्हड़गेवाड़ी, गोसावीवाड़ी
        और शिर्केवाड़ी बस्तियों से होकर गुजरता है, जहां गढ़ के भीतर एक मंदिर, छत्रपति
        शिवाजी महाराज की आवर्ती प्रतिमा और देवी भवानी की प्राचीन मूर्ति स्थित है।

        किले में प्रवेश द्वार के पास और दक्षिणी छोर पर प्राचीन जल कुंड बने हुए हैं।'
      history: विशेषज्ञों का दावा है कि इस किले का निर्माण 14वीं शताब्दी में हुआ था।
        छत्रपति शिवाजी महाराज ने 1661 में इस किले का जीर्णोद्धार कर भवानी माता का
        मंदिर बनवाया तथा 1818 में अंग्रेजों ने इस किले पर अधिकार कर लिया।
      significance: भवानी माता मंदिर और प्राचीन जल कुंडों वाला संगमेश्वर का एक ऐतिहासिक
        पहाड़ी किला।
      dos: '- कडवई या म्हड़गेवाड़ी बेस गांवों तक पहुंचने के लिए स्थानीय ऑटो-रिक्शा
        या निजी वाहन का उपयोग करें

        - म्हड़गेवाड़ी, गोसावीवाड़ी और शिर्केवाड़ी के रास्तों का पालन करें'
      donts: '- ट्रेकिंग के निर्धारित रास्तों से हटकर घनी झाड़ियों में न भटकें'
      safety_text: अंतिम रास्ता चढ़ाई वाला है; मानसून के दौरान जब रास्ते फिसलन भरे
