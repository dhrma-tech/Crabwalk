      history: null
      significance: null
      dos: '- मासळीच्या लिलावासाठी संध्याकाळी या

        - बोटीने सुवर्णदुर्ग किल्ल्याला जाण्याचे नियोजन करा'
      donts: '- बोटी आणि लिलाव करणाऱ्या कामगारांच्या मध्ये अडथळा निर्माण करू नका'
