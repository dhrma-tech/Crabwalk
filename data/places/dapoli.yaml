  text:
    en:
      short_story: 'Kanakdurg is a small headland fort right next to Harnai port,
        reached by a flight of steps. It covers about a quarter of a hectare and is
        mostly in ruins, but it still has nine water ponds, a lighthouse and two bastions.


        It was built as a link to Suvarnadurg, the island fort just offshore, and
        gives a good view of it.'
      history: null
      significance: A lookout fort that protected Suvarnadurg, next to Harnai port.
      dos: '- Combine with Harnai beach, the evening fish auction and a boat to Suvarnadurg'
      donts: null
      safety_text: '- Steps and ruins are uneven'
    mr:
      short_story: 'कनकदुर्ग हा हर्णै बंदराच्या अगदी लागून असलेला एक छोटा भूदुर्ग
        आहे, जिथे पायऱ्या चढून जाता येते. हा सुमारे पाव हेक्टरवर पसरलेला असून बहुतांश
        पडझड झाली आहे, तरीही येथे पाण्याचे नऊ कुंड, एक दीपगृह (लाईट हाऊस) आणि दोन
        बुरुज पाहायला मिळतात.


        समुद्रात असणाऱ्या सुवर्णदुर्ग किल्ल्याला जोडणारा दुवा म्हणून तो बांधला गेला
        होता आणि येथून सुवर्णदुर्गाचे विहंगम दृश्य दिसते.'
      history: null
      significance: हर्णै बंदराशेजारील एक टेहळणी किल्ला ज्याने सुवर्णदुर्गाचे संरक्षण
        केले.
      dos: '- हर्णै बीच, संध्याकाळचा मासळीचा लिलाव आणि सुवर्णदुर्गाची बोट सफर याचे
        एकत्रित नियोजन करा'
      donts: null
      safety_text: '- पायऱ्या आणि किल्ल्याचे अवशेष ओबडधोबड आहेत'
    hi:
      short_story: 'कनकदुर्ग हरनाई बंदरगाह के ठीक बगल में एक छोटा मुख्यभूमि का किला
        है, जहां सीढ़ियों से पहुंचा जा सकता है। यह लगभग एक चौथाई हेक्टेयर में फैला
        है और ज्यादातर खंडहर हो चुका है, लेकिन इसमें अभी भी नौ पानी के कुंड, एक लाइटहाउस
        और दो बुर्ज हैं।


        इसे समुद्र तट के ठीक दूर स्थित द्वीप किले सुवर्णदुर्ग के लिए एक लिंक के रूप
        में बनाया गया था, और यहां से उसका अच्छा नजारा दिखता है।'
      history: null
      significance: हरनाई बंदरगाह के बगल में एक निगरानी किला जो सुवर्णदुर्ग की रक्षा
        करता था।
      dos: '- हरनाई समुद्र तट, शाम की मछली नीलामी और सुवर्णदुर्ग के लिए नाव की सवारी
        के साथ मिलाएं'
      donts: null
      safety_text: '- सीढ़ियां और खंडहर ऊबड़-खाबड़ हैं'
