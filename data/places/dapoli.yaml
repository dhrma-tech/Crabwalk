  how_to_reach: Located in Harnai town, about 15 km northwest of Dapoli camp, accessible
    easily by state transport buses or auto-rickshaws via local tar roads.
  nearest_station: Khed Railway Station (approx. 40 km)
  nearest_bus_stop: Harnai Bus Stand
  monsoon_status: risky
  monsoon_reason: High sea tides and heavy rains make swimming and water activities
    hazardous.
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Harnai,_Maharashtra
  is_hidden_gem: false
  text:
    en:
      short_story: 'Harnai Beach is an active coastal stretch near Dapoli, known primarily
        as a major fishing hub. It offers a factual look into the daily operations
        of the local Koli fishing community. The beach is flanked by the historic
        Suvarnadurg and Kanakdurg forts, situated just offshore and along the coast.

        Every evening, the beach functions as an open-air fish auction market where
        boats bring in their daily catch. Visitors can observe the trading of fresh
        seafood directly on the sand.'
      history: Harnai functioned as a trading port and maritime center for centuries,
        heavily fortified by the Marathas under naval commanders like Kanhoji Angre
        to protect the coastline.
      significance: Known for hosting a large, daily open-air fish auction directly
        on the beach.
      dos: '- Visit between 4:00 PM and 6:00 PM to witness the daily fish auction.

        - Bring cash and be prepared to bargain if you wish to buy fresh seafood directly
        from the fishermen.'
      donts: '- Avoid this beach if you are sensitive to strong fish odors.

        - Do not drive your vehicle onto the beach sand, as it can get stuck or interfere
        with the boats.'
      safety_text: The beach gets extremely crowded during the auction, and the sand
        may be littered with fish waste; walk carefully.
    mr:
      short_story: 'हर्णे बीच हा दापोली जवळील एक गजबजलेला आणि मासेमारीसाठी प्रसिद्ध
        असलेला किनारा आहे. हा किनारा स्थानिक कोळी बांधवांच्या दैनंदिन जीवनाचे आणि
        व्यवसायाचे दर्शन घडवतो. या किनाऱ्याच्या एका बाजूला सुवर्णदुर्ग आणि कनकदुर्ग
        हे ऐतिहासिक किल्ले उभे आहेत.

        दररोज संध्याकाळी या किनाऱ्याचे रूपांतर एका मोठ्या मासळी बाजारात होते, जिथे
        बोटी ताज्या माशांची आवक घेऊन येतात. किनाऱ्यावर चालणारा हा ताज्या माशांचा लिलाव
        आणि व्यापार येथे प्रत्यक्ष पाहता येतो.'
      history: हर्णे हे अनेक शतकांपासून एक प्रमुख व्यापारी बंदर राहिले आहे. कान्होजी
        आंग्रे यांच्यासारख्या सरखेलांच्या नेतृत्वाखाली मराठ्यांनी या किनारपट्टीचे
        रक्षण करण्यासाठी येथे मजबूत तटबंदी उभारली होती.
      significance: कोकण किनारपट्टीवरील एका मोठ्या खुल्या मासळी लिलावासाठी (फिश ऑक्शन)
        प्रसिद्ध.
      dos: '- किनाऱ्यावरील मासळीचा लिलाव पाहण्यासाठी संध्याकाळी 4 ते 6 या वेळेत भेट
        द्या.

        - कोळी बांधवांकडून थेट ताजे मासे खरेदी करायचे असल्यास सोबत रोख रक्कम ठेवा
        आणि घासाघीस करण्याची तयारी ठेवा.'
      donts: '- तुम्हाला माशांचा उग्र वास सहन होत नसेल, तर या किनाऱ्यावर जाणे टाळा.

        - तुमची गाडी किनाऱ्यावरील वाळूत नेऊ नका, कारण ती फसू शकते किंवा बोटींना अडथळा
        होऊ शकतो.'
      safety_text: लिलावाच्या वेळी किनाऱ्यावर खूप गर्दी असते आणि वाळूत माशांचे अवशेष
        असू शकतात, त्यामुळे जपून चालावे.
    hi:
      short_story: 'हर्णे बीच दापोली के पास स्थित एक सक्रिय तट है, जो मुख्य रूप से
        मछली पकड़ने के एक बड़े केंद्र के रूप में जाना जाता है। यह स्थानीय कोली मछुआरा
        समुदाय के दैनिक संचालन की एक वास्तविक झलक पेश करता है। इस तट के पास ऐतिहासिक
        सुवर्णदुर्ग और कनकदुर्ग किले स्थित हैं।

        हर शाम, यह समुद्र तट एक खुली मछली नीलामी बाजार में बदल जाता है, जहां नावें
        अपनी दैनिक पकड़ लाती हैं। आगंतुक सीधे रेत पर ताजे समुद्री भोजन के व्यापार
        को देख सकते हैं।'
      history: हर्णे सदियों से एक व्यापारिक बंदरगाह और समुद्री केंद्र के रूप में कार्य
        करता था। कान्होजी आंग्रे जैसे नौसेना कमांडरों के तहत तट की रक्षा के लिए मराठों
        द्वारा इसे मजबूत किया गया था।
      significance: सीधे समुद्र तट पर एक बड़ी, दैनिक खुली मछली नीलामी की मेजबानी के
        लिए जाना जाता है।
      dos: '- दैनिक मछली नीलामी देखने के लिए शाम 4:00 बजे से 6:00 बजे के बीच आएं।

        - यदि आप सीधे मछुआरों से ताजी मछली खरीदना चाहते हैं, तो नकद साथ रखें और मोलभाव
        करने के लिए तैयार रहें।'
      donts: '- यदि आपको मछली की तेज गंध से परेशानी है, तो इस समुद्र तट पर जाने से
        बचें।

        - अपने वाहन को समुद्र तट की रेत पर न चलाएं, क्योंकि यह फंस सकता है या नावों
        में बाधा उत्पन्न कर सकता है।'
      safety_text: नीलामी के दौरान समुद्र तट पर बहुत भीड़ हो सकती है, और रेत पर मछलियों
        का कचरा हो सकता है; सावधानी से चलें।
