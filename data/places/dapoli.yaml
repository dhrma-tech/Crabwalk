  is_hidden_gem: false
  text:
    en:
      short_story: 'Parshuram Bhoomi is a hilltop viewpoint and monument situated
        in Burondi village near Dapoli. The site is anchored by a 21-foot tall statue
        of Lord Parshuram holding a battle axe and bow, standing atop a half-globe
        with a 20-foot radius. The hollow globe functions as an echo chamber.

        From this elevated location, visitors get unobstructed views of the Arabian
        Sea and the red waters of the nearby Ladghar Beach. The quiet environment
        makes it a common spot for relaxation and photography.'
      history: The monument was established on June 16, 2010, by Dnyaneshwar Shivaji
        Gajul from Solapur.
      significance: A hilltop sanctuary featuring a towering statue of Lord Parshuram
        and offering clear views of the Konkan coastline.
      dos: '- Step inside the dome structure below the statue to experience its unique
        acoustics.

        - Visit during the late afternoon to capture the sunset and the red tinge
        of the sea from above.'
      donts: '- Do not litter or create loud noises, as the site is considered a meditation
        spot.

        - Avoid visiting during extreme midday heat, as there is limited shade on
        the open hilltop.'
      safety_text: The approach road is well-maintained but slightly winding; ensure
        your vehicle's brakes are functional when navigating the hill.
    mr:
      short_story: 'परशुराम भूमी हे दापोली जवळील बुरोंडी गावातील एका टेकडीवरील प्रेक्षणीय
        स्थळ आणि स्मारक आहे. या ठिकाणी 20 फूट त्रिज्येच्या एका अर्ध्या पृथ्वीगोलावर
        भगवान परशुरामांची 21 फूट उंचीची मूर्ती उभी आहे. मूर्तीच्या हातात परशू आणि
        धनुष्य दाखवले आहे. हा पोकळ पृथ्वीगोल आतून एक ध्यानमंदिर म्हणून वापरला जातो,
        जिथे आवाजाचा घुमट (इको) तयार होतो.

        या उंचावरील जागेवरून अरबी समुद्राचे आणि जवळच्या लाडघर किनाऱ्यावरील लालसर पाण्याचे
        स्पष्ट दृश्य पाहता येते. येथील शांत वातावरण विश्रांती आणि छायाचित्रणासाठी
        योग्य आहे.'
      history: 16 जून 2010 रोजी सोलापूरच्या ज्ञानेश्वर शिवाजी गाजुळ यांनी या स्मारकाची
        स्थापना केली.
      significance: भगवान परशुरामांची भव्य मूर्ती आणि कोकण किनारपट्टीचे स्पष्ट दृश्य
        देणारे टेकडीवरील एक स्मारक.
      dos: '- मूर्तीच्या खालील घुमटाकार रचनेत प्रवेश करून तिथला अनोखा आवाज (इको) नक्की
        अनुभवा.

        - सूर्यास्त आणि वरून दिसणाऱ्या समुद्राच्या लालसर पाण्याचा आनंद घेण्यासाठी
        संध्याकाळच्या वेळी भेट द्या.'
      donts: '- हे एक ध्यान करण्याचे ठिकाण असल्याने येथे मोठ्याने आवाज करू नका किंवा
        कचरा टाकू नका.

        - दुपारी कडक उन्हात जाणे टाळा, कारण खुल्या टेकडीवर सावलीसाठी जागा कमी आहे.'
      safety_text: टेकडीवरील रस्ता चांगला असला तरी वळणावळणाचा आहे, त्यामुळे गाडी चालवताना
        वाहनाचे ब्रेक सुस्थितीत असल्याची खात्री करा.
    hi:
      short_story: 'परशुराम भूमि दापोली के पास बुरोंडी गांव में स्थित एक पहाड़ी दृश्य
        बिंदु और स्मारक है। इस स्थल पर 20 फुट त्रिज्या वाले एक आधे-ग्लोब के ऊपर भगवान
        परशुराम की 21 फुट ऊंची मूर्ति खड़ी है। मूर्ति के हाथों में युद्ध कुल्हाड़ी
        और धनुष है। खोखला ग्लोब एक इको चेंबर के रूप में कार्य करता है।

        इस ऊंचाई से, आगंतुकों को अरब सागर और पास के लाडघर समुद्र तट के लाल पानी का
        स्पष्ट दृश्य दिखाई देता है। शांत वातावरण इसे विश्राम और फोटोग्राफी के लिए
        एक आम स्थान बनाता है।'
      history: इस स्मारक की स्थापना 16 जून 2010 को सोलापुर के ज्ञानेश्वर शिवाजी गाजुल
        द्वारा की गई थी।
      significance: भगवान परशुराम की विशाल मूर्ति और कोंकण तट के स्पष्ट दृश्यों वाला
        एक पहाड़ी अभयारण्य।
      dos: '- अद्वितीय ध्वनिकी (इको) का अनुभव करने के लिए मूर्ति के नीचे गुंबद संरचना
        के अंदर जाएं।

        - सूर्यास्त और ऊपर से समुद्र की लालिमा देखने के लिए देर दोपहर में आएं।'
      donts: '- कूड़ा न फैलाएं या तेज आवाज न करें, क्योंकि इस स्थल को ध्यान का स्थान
        माना जाता है।

        - चिलचिलाती दोपहर की गर्मी के दौरान जाने से बचें, क्योंकि खुली पहाड़ी पर छाया
        सीमित है।'
      safety_text: पहाड़ी तक जाने वाली सड़क अच्छी स्थिति में है लेकिन घुमावदार है;
        इसलिए सुनिश्चित करें कि आपके वाहन के ब्रेक अच्छी स्थिति में हों।
