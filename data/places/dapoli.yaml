  text:
    en:
      short_story: 'Palgad fort sits in dense forest above Palgad village, about 21
        km from Dapoli on the Dapoli-Khed road. It is an easy climb of about half
        an hour from the Hanuman temple at Killemachi, then about half an hour to
        see the top.


        The fort is small, under an acre, with nine bastions and two gates. Much of
        the wall still stands, and old cannons lie on a bastion and near the smaller
        gate. From the top you can see Mahipatgad, Sumargad and Rasalgad to the east
        and Khed town to the south.'
      history: Local belief credits Shivaji Maharaj with building it. Little else
        is recorded; its position suggests it was a watch post. The village grew up
        below the fort and took its name from it.
      significance: An easy, quiet fort walk with views over three Sahyadri forts.
      dos: '- Start from the Killemachi Hanuman temple

        - Carry water; the tank on top is dry'
      donts: '- Don''t take the old second route; it is no longer used'
      safety_text: null
    mr:
      short_story: 'पालगड किल्ला पालगड गावाच्या वर दाट जंगलात वसलेला आहे, जो दापोली-खेड
        रस्त्यावर दापोलीपासून सुमारे 21 किमी अंतरावर आहे. किल्लेमाची येथील हनुमान
        मंदिरापासून सुमारे अर्ध्या तासाची ही एक सोपी चढाई आहे, आणि त्यानंतर माथा पाहण्यासाठी
        अजून अर्धा तास लागतो.


        हा किल्ला लहान असून एक एकरापेक्षा कमी क्षेत्रात पसरलेला आहे, ज्याला नऊ बुरूज
        आणि दोन प्रवेशदवारे आहेत. बहुतांश तटबंदी आजही उभी असून, एका बुरूजावर आणि लहान
        दरवाज्याजवळ जुन्या तोफा पडलेल्या आहेत. शिखरावरून पूर्वेकडे महिपतिगड, सुमारगड
        आणि रसाळगड तर दक्षिणेकडे खेड शहर स्पष्ट दिसते.'
      history: हा किल्ला छत्रपती शिवाजी महाराजांनी बांधल्याची स्थानिकांची श्रद्धा
        आहे. याविषयी इतर फारशी कागदोपत्री नोंद नाही; परंतु याची भौगोलिक स्थिती पाहता
        हा एक पहारेकरी चौकी असावा असे वाटते. किल्ल्याच्या खाली वस्ती वाढली आणि त्यावरूनच
        या गावाला पालगड हे नाव मिळाले.
      significance: सह्याद्रीच्या तीन किल्ल्यांचे विहंगम दृश्य देणारी एक सोपी व शांत
        किल्ला भ्रमंती.
      dos: '- किल्लेमाची येथील हनुमान मंदिरापासून सुरुवात करा

        - पिण्याचे पाणी सोबत ठेवा; वरची पाण्याची टाकी कोरडी पडली आहे'
      donts: '- जुना दुसरा मार्ग निवडू नका; तो आता वापरला जात नाही'
      safety_text: null
    hi:
      short_story: 'पालगड किला पालगड गाँव के ऊपर घने जंगल में स्थित है, जो दापोली
        से दापोली-खेड़ रोड पर लगभग 21 किमी दूर है। किल्लेमाची के हनुमान मंदिर से लगभग
        आधे घंटे की यह एक आसान चढ़ाई है, फिर ऊपर देखने के लिए लगभग आधा घंटा और लगता
        है।


        यह किला छोटा है, एक एकड़ से कम में फैला है, जिसमें नौ बुर्ज और दो द्वार हैं।
        दीवार का अधिकांश हिस्सा अभी भी खड़ा है, और पुरानी तोपें एक बुर्ज पर और छोटे
        द्वार के पास पड़ी हैं। ऊपर से आप पूर्व में महिपतिगड, सुमारगड और रसालगढ़ तथा
        दक्षिण में खेड़ शहर देख सकते हैं।'
      history: स्थानीय मान्यता इसके निर्माण का श्रेय शिवाजी महाराज को देती है। इसके
        अलावा बहुत कम रिकॉर्डेड इतिहास है; इसकी स्थिति से पता चलता है कि यह एक चौकी
        था। किले के नीचे गाँव बसा और इसी से इसका नाम पड़ा।
      significance: तीन सह्याद्री किलों के दृश्यों के साथ एक आसान, शांत किले की सैर।
      dos: '- किल्लेमाची हनुमान मंदिर से शुरुआत करें

        - पानी साथ रखें; ऊपर की टंकी सूखी है'
      donts: '- पुराने दूसरे मार्ग का उपयोग न करें; इसका अब उपयोग नहीं किया जाता है'
      safety_text: null
