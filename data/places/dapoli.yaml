  text:
    en:
      short_story: 'The Chandika temple is a natural cave of black rock on a plateau
        about 1 km off the Dapoli-Dabhol road, 3 to 4 km from Dabhol harbour. You
        bend low to pass the silver-covered entrance and walk down a narrow, dark
        passage to the goddess.


        The idol is a self-formed stone figure about three feet high, covered in vermilion,
        with four arms holding weapons. Only oil lamps light the sanctum; no electric
        light is allowed inside.'
      history: Tradition links the cave to the Pandavas. A Gosavi saint, Jamna Puri,
        is said to have found the hidden cave in a dream and cleared the entrance,
        and the Puri family has done the rituals ever since; the present priests are
        the 32nd generation. Shivaji Maharaj is said to have visited after taking
        Dabhol.
      significance: A cave shrine lit only by oil lamps, run by the same family for
        over 30 generations.
      dos: '- Visit during Navratri for the festival

        - Go slowly down the dark passage; only two people fit at a time'
      donts: '- Don''t use a torch or phone light in the sanctum

        - Don''t bring non-vegetarian offerings'
      safety_text: The passage is low, narrow and dark. Not suited to people who are
        uneasy in tight spaces.
    mr:
      short_story: 'चंडिका मंदिर हे दाभोळ बंदरापासून 3 ते 4 किमी अंतरावर आणि दापोली-दाभोळ
        रस्त्यापासून सुमारे 1 किमी अंतरावर असलेल्या एका पठारावरील काळ्या पाषाणाची
        नैसर्गिक गुहा आहे. चांदीने मढवलेल्या प्रवेशद्वारातून जाण्यासाठी तुम्हाला वाकून
        जावे लागते आणि देवीच्या दर्शनासाठी एका अरुंद, अंधाऱ्या मार्गावरून चालत जावे
        लागते.


        इथली मूर्ती ही सुमारे तीन फूट उंचीची स्वयंभू पाषाण मूर्ती आहे, जी शेंदूर लावून
        झाकलेली असून तिच्या चार हातात शस्त्रे आहेत. गाभाऱ्यात फक्त तेलाचे दिवे लावलेले
        असतात; आतमध्ये विजेच्या दिव्यांना (लाईट) परवानगी नाही.'
      history: ही गुहा पंडवांशी जोडली असल्याची दंतकथा आहे. जामना पुरी नावाच्या एका
        गोसावी संताने स्वप्नात ही लपलेली गुहा शोधून काढली आणि तिचे प्रवेशद्वार मोकळे
        केले असे मानले जाते, आणि तेव्हापासून पुरी कुटुंबच इथले विधी पार पाडत आहे;
        सध्याचे पुजारी 32 व्या पिढीतील आहेत. छत्रपती शिवाजी महाराजांनी दाभोळ जिंकल्यानंतर
        या मंदिराला भेट दिली होती असे सांगितले जाते.
      significance: केवळ तेलाच्या दिव्यांनी उजळलेले एक गुहा मंदिर, ज्याची पूजा एकाच
        कुटुंबाद्वारे 30 हून अधिक पिढ्यांपासून चालवली जात आहे.
      dos: '- उत्सवासाठी नवरात्रीदरम्यान भेट द्या

        - अंधाऱ्या मार्गावरून हळूहळू खाली जा; एका वेळी फक्त दोनच व्यक्ती जाऊ शकतात'
      donts: '- गाभाऱ्यात टॉर्च किंवा फोनच्या लाईटचा वापर करू नका

        - मांसाहारी नैवेद्य सोबत आणू नका'
      safety_text: येथील मार्ग खाली (झुकलेला), अरुंद आणि अंधारा आहे. ज्या लोकांना
        बंदिस्त किंवा अरुंद जागेची भीती वाटते (क्लॉस्ट्रोफोबिया), त्यांच्यासाठी हे
        योग्य नाही.
    hi:
      short_story: 'चंडिका मंदिर दाभोल बंदर से 3 से 4 किमी और दापोली-दाभोल सड़क से
        लगभग 1 किमी दूर एक पठार पर काले चट्टान की एक प्राकृतिक गुफा है। चांदी से ढके
        प्रवेश द्वार से गुजरने के लिए आपको झुकना पड़ता है और देवी के पास जाने के लिए
        एक संकीर्ण, अंधेरे मार्ग से नीचे चलना पड़ता है।


        मूर्ति लगभग तीन फीट ऊँची एक स्वयंभू पत्थर की आकृति है, जो सिंदूर से ढकी हुई
        है, और चार हाथों में हथियार पकड़े हुए है। गर्भगृह को केवल तेल के दीये रोशन
        करते हैं; अंदर किसी भी बिजली के प्रकाश की अनुमति नहीं है।'
      history: परंपरा इस गुफा को पांडवों से जोड़ती है। कहा जाता है कि एक गोसावी संत,
        जमुना पुरी ने सपने में छिपी हुई गुफा को पाया और प्रवेश द्वार को साफ किया,
        और पुरी परिवार तब से अनुष्ठान करता आ रहा है; वर्तमान पुजारी 32 वीं पीढ़ी के
        हैं। कहा जाता है कि दाभोल पर कब्जा करने के बाद शिवाजी महाराज ने यहाँ दौरा
        किया था।
      significance: केवल तेल के दीयों से रोशन एक गुफा तीर्थ, जिसे 30 से अधिक पीढ़ियों
        से एक ही परिवार द्वारा चलाया जा रहा है।
      dos: '- त्योहार के लिए नवरात्रि के दौरान जाएँ

        - अंधेरे रास्ते से धीरे-धीरे नीचे उतरें; एक बार में केवल दो लोग ही आ सकते
        हैं'
      donts: '- गर्भगृह में टॉर्च या फोन की लाइट का उपयोग न करें

        - मांसाहारी प्रसाद न लाएँ'
      safety_text: रास्ता नीचा, संकरा और अंधेरा है। तंग जगहों से घबराने वाले लोगों
        के लिए यह उपयुक्त नहीं है।
