  text:
    en:
      short_story: 'The Dr. Balasaheb Sawant Konkan Krishi Vidyapeeth Museum is located
        within the College of Forestry at the agricultural university in Dapoli. It
        forms part of the university''s 60-hectare instructional farm dedicated to
        the study of the Konkan region''s flora.


        The facility features a bamboo museum, agroforestry models, and block plantations
        of various tree species. Visitors can also see a mist chamber, a hi-tech plant
        nursery, and the Charak Medicinal Plants Garden, which showcases local medicinal
        herbs and sustainable agricultural practices.'
      history: The university's forestry degree program began in 1985, leading to
        the establishment of an independent College of Forestry in 2005.
      significance: It functions as an educational facility demonstrating regional
        biodiversity, forestry models, and agricultural practices.
      dos: '- Visit during the university''s official working hours.

        - Ask for permission before entering specialized research greenhouses or nurseries.'
      donts: '- Do not pluck leaves, flowers, or saplings from the medicinal gardens.'
      safety_text: null
    mr:
      short_story: 'डॉ. बाळासाहेब सावंत कोकण कृषी विद्यापीठाचे हे संग्रहालय दापोलीतील
        कृषी विद्यापीठाच्या वनशास्त्र महाविद्यालयात (College of Forestry) आहे. कोकणातील
        वनस्पतींच्या अभ्यासासाठी तयार केलेल्या विद्यापीठाच्या 60 हेक्टर प्रक्षेत्राचा
        हा एक भाग आहे.


        येथे एक विशेष बांबू संग्रहालय, कृषी-वनशास्त्र मॉडेल्स आणि विविध प्रकारच्या
        झाडांची लागवड पाहायला मिळते. याशिवाय, अभ्यागतांना मिस्ट चेंबर, हाय-टेक रोपवाटिका
        आणि चरक औषधी वनस्पती उद्यानही पाहता येते, जिथे स्थानिक औषधी वनस्पती आणि शाश्वत
        शेतीचे प्रयोग ठेवले आहेत.'
      history: विद्यापीठात 1985 मध्ये वनशास्त्राचा अभ्यासक्रम सुरू झाला आणि त्यानंतर
        2005 मध्ये स्वतंत्र वनशास्त्र महाविद्यालयाची स्थापना करण्यात आली.
      significance: कोकणातील जैवविविधता, वनशास्त्र आणि कृषी क्षेत्रातील नवनवीन प्रयोग
        लोकांसमोर आणणारे हे एक महत्त्वाचे शैक्षणिक केंद्र आहे.
      dos: '- विद्यापीठाच्या अधिकृत वेळेतच भेट द्या.

        - संशोधनासाठी असलेल्या विशेष ग्रीनहाऊस किंवा रोपवाटिकांमध्ये जाण्यापूर्वी
        परवानगी नक्की घ्या.'
      donts: '- औषधी वनस्पतींच्या बागेतील पाने, फुले किंवा रोपे तोडू नका.'
      safety_text: null
    hi:
      short_story: 'डॉ. बालासाहेब सावंत कोंकण कृषि विद्यापीठ संग्रहालय दापोली में
        कृषि विश्वविद्यालय के वानिकी कॉलेज के भीतर स्थित है। यह कोंकण क्षेत्र की वनस्पतियों
        के अध्ययन के लिए समर्पित विश्वविद्यालय के 60 हेक्टेयर फार्म का एक हिस्सा है।


        इस परिसर में एक विशेष बांस संग्रहालय, एग्रोफोरेस्ट्री मॉडल और विभिन्न पेड़
        प्रजातियों के ब्लॉक प्लांटेशन मौजूद हैं। आगंतुक यहाँ मिस्ट चैंबर, हाई-टेक
        प्लांट नर्सरी और चरक औषधीय पौधा उद्यान भी देख सकते हैं, जो स्थानीय औषधीय जड़ी-बूटियों
        और टिकाऊ कृषि विधियों को प्रदर्शित करता है।'
      history: विश्वविद्यालय का वानिकी डिग्री कार्यक्रम 1985 में शुरू हुआ, जिसके बाद
        2005 में एक स्वतंत्र वानिकी कॉलेज की स्थापना की गई।
      significance: यह क्षेत्रीय जैव विविधता, वानिकी मॉडल और कृषि नवाचार को प्रदर्शित
        करने वाले एक शैक्षिक केंद्र के रूप में कार्य करता है।
      dos: '- विश्वविद्यालय के आधिकारिक कार्य समय के दौरान ही आएं।

        - विशेष अनुसंधान ग्रीनहाउस या नर्सरी में प्रवेश करने से पहले अनुमति लें।'
      donts: '- औषधीय उद्यानों से पत्ते, फूल या पौधे न तोड़ें।'
      safety_text: null
