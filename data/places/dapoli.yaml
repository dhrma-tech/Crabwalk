  text:
    en:
      short_story: 'Burondi Beach is a quiet, rural stretch of the Arabian Sea coastline
        located in the small coastal village of Burondi, a short distance from Ladghar.
        Backed by agricultural lands and traditional Konkani homes, the beach offers
        an uncrowded environment away from heavy tourist traffic.

        The shoreline features fine sand and gentle waves, providing a simple coastal
        setting. Visitors often combine a walk on this quiet shore with a visit to
        the nearby Parshuram Bhoomi hilltop and the local Ganpati temple.'
      history: null
      significance: A secluded and uncrowded rural beach offering a quiet environment
        in a Konkani village setting.
      dos: '- Take a leisurely walk along the shoreline, especially during low tide.

        - Combine your visit with the nearby Parshuram Bhoomi monument and the village
        Ganpati temple.'
      donts: '- Do not expect commercial shacks, water sports, or extensive tourist
        facilities on this rural beach.

        - Avoid swimming deep into the sea, as the beach lacks active lifeguards.'
      safety_text: Due to the absence of lifeguards, swimming should be restricted
        to the shallow waters near the shore.
    mr:
      short_story: 'बुरोंडी बीच हा दापोली तालुक्यातील बुरोंडी गावात वसलेला अरबी समुद्राचा
        एक शांत आणि ग्रामीण किनारा आहे. लाडघरपासून थोड्याच अंतरावर असलेल्या या किनाऱ्याच्या
        मागे शेतजमिनी आणि पारंपारिक कोकणी घरे पाहायला मिळतात. पर्यटकांच्या गर्दीपासून
        दूर असल्याने येथे अतिशय शांत वातावरण असते.

        किनाऱ्यावर मऊ वाळू आणि संथ लाटा असल्याने येथे एक साधा किनारा पाहायला मिळतो.
        पर्यटक अनेकदा या शांत किनाऱ्यावरील फेरफटका, जवळची परशुराम भूमी आणि गावातील
        गणपती मंदिर यांची एकत्रित सफर करतात.'
      history: null
      significance: गर्दी नसलेला आणि पारंपारिक कोकणी गावाच्या पार्श्वभूमीवर असलेला
        एक अतिशय शांत आणि एकांत किनारा.
      dos: '- शांततेचा अनुभव घेण्यासाठी किनाऱ्यावर, विशेषतः ओहोटीच्या वेळी निवांत
        फेरफटका मारा.

        - जवळच असलेली परशुराम भूमी आणि गावातील गणपती मंदिर यांनाही नक्की भेट द्या.'
      donts: '- हा एक ग्रामीण किनारा असल्याने येथे व्यावसायिक दुकाने, वॉटर स्पोर्ट्स
        किंवा पर्यटकांसाठीच्या सुविधांची अपेक्षा करू नका.

        - या किनाऱ्यावर जीवरक्षक (लाईफगार्ड) नसल्याने खोल समुद्रात पोहण्यासाठी जाणे
        टाळा.'
      safety_text: येथे जीवरक्षक उपलब्ध नसल्याने, केवळ किनाऱ्याजवळील उथळ पाण्यातच
        जाणे सुरक्षित ठरते.
    hi:
      short_story: 'बुरोंडी बीच दापोली तालुका के छोटे से तटीय गांव बुरोंडी में स्थित
        अरब सागर तट का एक शांत और ग्रामीण हिस्सा है। लाडघर से थोड़ी ही दूरी पर स्थित
        इस समुद्र तट के पीछे कृषि भूमि और पारंपरिक कोंकणी घर हैं। पर्यटकों की भीड़
        से दूर, यह समुद्र तट एक शांतिपूर्ण वातावरण प्रदान करता है।

        तटरेखा पर मुलायम रेत और शांत लहरें हैं, जो एक साधारण तटीय वातावरण प्रदान करती
        हैं। आगंतुक अक्सर इस शांत किनारे पर टहलने के साथ-साथ पास की परशुराम भूमि और
        स्थानीय गणपति मंदिर के दर्शन करते हैं।'
      history: null
      significance: एक एकांत और भीड़-भाड़ से मुक्त ग्रामीण समुद्र तट जो पारंपरिक कोंकणी
        गांव के परिवेश में एक शांत स्थान प्रदान करता है।
      dos: '- शांतिपूर्ण अनुभव के लिए, विशेष रूप से कम ज्वार (लो टाइड) के दौरान, किनारे
        पर इत्मीनान से सैर करें।

        - अपनी यात्रा को पास के परशुराम भूमि स्मारक और गांव के गणपति मंदिर के दर्शन
        के साथ जोड़ें।'
      donts: '- इस ग्रामीण समुद्र तट पर व्यावसायिक दुकानों, पानी के खेलों या पर्यटन
        सुविधाओं की अपेक्षा न करें।

        - समुद्र में गहराई तक तैरने से बचें, क्योंकि समुद्र तट पर सक्रिय लाइफगार्ड
        नहीं हैं।'
      safety_text: लाइफगार्ड की अनुपस्थिति के कारण, तैराकी को किनारे के पास उथले पानी
        तक ही सीमित रखा जाना चाहिए।
