  text:
    en:
      short_story: 'Pranaldurg Fort, also known as Padmanabhdurg, is a small hill
        fort situated on a 270-foot elevation near the Kotjai River in Dapoli taluka.
        It is located close to the Panhalekaji caves and covers an area of about two
        acres from south to north.


        Visitors must hike a short 15-minute trail from the base to reach the top.
        At the site, you can see a dry water tank, a broken staircase, and crumbling
        two-tiered stone walls. Much of the original structure has been lost to past
        farming activities on the hilltop, but the location offers open views of the
        river basin and forests.'
      history: It is believed to have been constructed around the 12th century. The
        lack of historical records during or after Chhatrapati Shivaji Maharaj's reign
        suggests the fort was abandoned in later periods.
      significance: An ancient coastal hill fort that served as a regional lookout
        point over the Kotjai River basin.
      dos: '- Wear sturdy footwear to navigate the broken stairs and uneven paths.

        - Carry enough drinking water, as the fort''s tanks are dry.'
      donts: '- Do not expect extensive surviving fort structures.'
      safety_text: The crumbling walls and broken stairs require careful footing during
        the ascent.
    mr:
      short_story: 'प्रणालदुर्ग, ज्याला पद्मनाभदुर्ग म्हणूनही ओळखले जाते, हा दापोली
        तालुक्यातील कोटजाई नदीजवळ 270 फूट उंचीवर वसलेला एक छोटा गिरीदुर्ग आहे. हा
        किल्ला पन्हाळेकाजी लेण्यांजवळ असून, तो दक्षिणेकडून उत्तरेकडे सुमारे दोन एकर
        परिसरात पसरलेला आहे.


        गडावर जाण्यासाठी पायथ्यापासून 15 मिनिटांची छोटी पायवाट चढावी लागते. गडावर
        गेल्यावर तुम्हाला एक कोरडं पाण्याचं टाकं, मोडकळीस आलेली पायवाट आणि दुहेरी
        तटबंदीचे अवशेष पाहायला मिळतात. गडावरील शेतीमुळे अनेक मूळ वास्तू नष्ट झाल्या
        आहेत, पण इथून नदीच्या खोऱ्याचा आणि आजूबाजूच्या जंगलाचा स्पष्ट देखावा दिसतो.'
      history: हा किल्ला साधारणतः 12 व्या शतकात बांधला गेला असावा असा अंदाज आहे. छत्रपती
        शिवाजी महाराजांच्या काळात किंवा त्यानंतर या किल्ल्याचा कोणताही ऐतिहासिक उल्लेख
        आढळत नाही, यावरून तो नंतरच्या काळात दुर्लक्षित राहिला असावा.
      significance: कोटजाई नदीच्या खोऱ्यावर लक्ष ठेवण्यासाठी बांधलेला हा एक प्राचीन
        टेहळणी किल्ला आहे.
      dos: '- तुटलेल्या पायऱ्या आणि खडबडीत वाट चढण्यासाठी मजबूत बूट घाला.

        - गडावर पिण्याचे पाणी नसल्याने स्वतःजवळ पुरेसे पाणी ठेवा.'
      donts: '- गडावर खूप मोठे वास्तू अवशेष पाहण्याची अपेक्षा ठेवू नका.'
      safety_text: ढासळलेली तटबंदी आणि तुटलेल्या पायऱ्यांमुळे गड चढताना विशेष काळजी
        घेणे आवश्यक आहे.
    hi:
      short_story: 'प्रणालदुर्ग, जिसे पद्मनाभदुर्ग के नाम से भी जाना जाता है, दापोली
        तालुका में कोटजाई नदी के पास 270 फीट की ऊंचाई पर स्थित एक छोटा पहाड़ी किला
        है। यह पन्हालेकाजी गुफाओं के करीब स्थित है और दक्षिण से उत्तर की ओर लगभग दो
        एकड़ के क्षेत्र में फैला हुआ है।


        किले तक पहुंचने के लिए तलहटी से 15 मिनट की चढ़ाई करनी पड़ती है। शीर्ष पर,
        आप एक सूखा पानी का टैंक, टूटी हुई सीढ़ियां और ढही हुई दोहरी पत्थर की दीवारें
        देख सकते हैं। पहाड़ी की चोटी पर पहले हुई खेती के कारण अधिकांश मूल संरचनाएं
        नष्ट हो गई हैं, लेकिन यहाँ से नदी घाटी और जंगलों का साफ नजारा दिखता है।'
      history: माना जाता है कि इस किले का निर्माण 12वीं शताब्दी के आसपास हुआ था। छत्रपति
        शिवाजी महाराज के शासनकाल के दौरान या उसके बाद इसका कोई ऐतिहासिक उल्लेख नहीं
        मिलता, जिससे पता चलता है कि बाद के समय में इसे छोड़ दिया गया था।
      significance: कोटजाई नदी बेसिन पर नजर रखने के लिए इस्तेमाल किया जाने वाला यह
        एक प्राचीन पहाड़ी किला है।
      dos: '- टूटी सीढ़ियों और उबड़-खाबड़ रास्तों पर चलने के लिए मजबूत जूते पहनें।

        - किले के टैंक सूखे हैं, इसलिए अपने साथ पर्याप्त पीने का पानी ले जाएं।'
      donts: '- किले में बहुत बड़ी या सुरक्षित संरचनाएं देखने की उम्मीद न करें।'
      safety_text: ढहती दीवारों और टूटी सीढ़ियों के कारण चढ़ाई करते समय पैरों का संतुलन
        बनाए रखना आवश्यक है।
