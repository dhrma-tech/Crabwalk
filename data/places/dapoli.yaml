    mr:
      short_story: 'हर्णे हे दापोली तालुक्यातील एक गजबजलेले मासेमारी बंदर आहे. हे
        किनाऱ्यावर संध्याकाळी चालणाऱ्या मासळीच्या लिलावासाठी प्रसिद्ध आहे. होड्या
        परत आल्यावर दिवसभराची मासळी थेट वाळूवरच विकली जाते.


        हा किनारा माडांच्या झाडांनी वेढलेला आहे. समुद्रात सुवर्णदुर्ग हा जलदुर्ग आहे,
