  how_to_reach: Located in Burondi village, about 11-15 km from Dapoli, accessible
    by road via well-maintained local routes.
  nearest_station: Khed Railway Station (approx. 45 km)
  nearest_bus_stop: Burondi Bus Stop
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
