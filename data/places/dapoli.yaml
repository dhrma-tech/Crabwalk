    beach at low tide only.
  nearest_station: Khed
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: true
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Suvarnadurg
  is_hidden_gem: false
  text:
    en:
      short_story: 'Suvarnadurg, the ''golden fort'', is an island fort about 1.6
        km off Harnai, built on a rock in the Arabian Sea. It covers 8 acres and is
        part of the UNESCO World Heritage site ''Maratha Military Landscapes of India'',
        inscribed in 2025.


        There is no jetty: local fishermen take you across from Harnai and you land
        on a small sandy beach, only at low tide. Inside are rock-cut walls, bastions
        with small rooms, two granaries, a stone magazine and a step well that still
        holds water.'
      history: Sources credit Shivaji with building it around 1660, with a shipbuilding
        yard. Kanhoji Angre's fleet was based here from 1696, and the fort was handed
        to him in 1713. A joint Peshwa-British siege in 1755 ended with its capture
        on 12 April 1755. The British took control on 4 December 1818.
      significance: A UNESCO-listed Maratha sea fort and an early base of Kanhoji
        Angre's navy.
      dos: '- Arrange the boat with fishermen at Harnai and agree the return time

        - Check the tide before you go; landing is only possible at low tide

        - Look for the carved tiger, eagle and elephant on the sea gate'
      donts: '- Don''t stay on the island past the agreed return time

        - Don''t attempt the crossing in rough sea'
      safety_text: '- Access depends on low tide; plan the trip around the tide table

        - There is no jetty and no drinking water on the island; carry water

        - The main east entry is blocked by thorny bushes; use the narrow path'
    mr:
      short_story: 'सुवर्णदुर्ग, म्हणजेच ''सोन्याचा किल्ला'', हा हर्णैपासून सुमारे
        1.6 किमी अंतरावर अरबी समुद्रातील एका खडकावर बांधलेला जलदुर्ग आहे. तो 8 एकरांवर
        पसरलेला आहे आणि 2025 मध्ये समाविष्ट करण्यात आलेल्या ''मराठा मिलिटरी लँडस्केप्स
        ऑफ इंडिया'' या युनेस्कोच्या (UNESCO) जागतिक वारसा स्थळाचा एक भाग आहे.


        येथे कोणतीही जेटी नाही: हर्णैतून स्थानिक कोळी बांधव तुम्हाला बोटीने घेऊन जातात
        आणि तुम्ही एका छोट्या वाळूच्या किनाऱ्यावर उतरता, हे फक्त ओहोटीच्या वेळीच शक्य
        होते. आतमध्ये कातळात कोरलेल्या भिंती, छोट्या खोल्या असलेले बुरुज, दोन धान्याची
        कोठारे, एक दगडी दारूगोळा कोठार आणि एक बारव आहे ज्यात आजही पाणी असते.'
      history: सूत्रांनुसार शिवाजी महाराजांनी 1660 च्या सुमारास जहाजबांधणीच्या कारखान्यासह
        हा किल्ला बांधला. कान्होजी आंग्रे यांचे आरमार 1696 पासून येथे होते आणि 1713
        मध्ये हा किल्ला त्यांच्याकडे सोपवण्यात आला. पेशवे आणि ब्रिटिशांच्या संयुक्त
        वेढ्यानंतर 12 एप्रिल 1755 रोजी हा किल्ला जिंकण्यात आला. 4 डिसेंबर 1818 रोजी
        ब्रिटिशांनी त्यावर ताबा मिळवला.
      significance: युनेस्कोच्या यादीत असलेला एक मराठा जलदुर्ग आणि कान्होजी आंग्रे
        यांच्या आरमाराचे सुरुवातीचे एक प्रमुख ठिकाण.
      dos: '- हर्णै येथील कोळी बांधवांसोबत बोटीची व्यवस्था करा आणि परत येण्याची वेळ
        ठरवून घ्या

        - जाण्यापूर्वी भरती-ओहोटीची वेळ तपासा; फक्त ओहोटीच्या वेळीच किनाऱ्यावर उतरता
        येते

        - महादरवाजावरील कोरलेला वाघ, गरुड आणि हत्ती नक्की पाहा'
      donts: '- ठरलेल्या वेळेनंतर बेटावर थांबू नका

        - समुद्र खवळलेला असताना प्रवास करण्याचा प्रयत्न करू नका'
      safety_text: '- किल्ल्यावर जाणे ओहोटीवर अवलंबून असते; वेळापत्रक पाहूनच प्रवासाचे
        नियोजन करा

        - बेटावर जेटी नाही आणि पिण्याचे पाणीही नाही; सोबत पाणी ठेवा

        - पूर्वेकडील मुख्य प्रवेशद्वार काटेरी झुडपांमुळे बंद झाले आहे; जाण्यासाठी
        अरुंद पाऊलवाटेचा वापर करा'
    hi:
      short_story: 'सुवर्णदुर्ग, यानी ''स्वर्ण किला'', हरनाई से लगभग 1.6 किमी दूर
        अरब सागर में एक चट्टान पर बना एक द्वीप किला है। यह 8 एकड़ में फैला है और 2025
        में शामिल ''मराठा मिलिट्री लैंडस्केप्स ऑफ इंडिया'' नामक यूनेस्को (UNESCO)
        विश्व धरोहर स्थल का हिस्सा है।


        यहां कोई जेटी नहीं है: स्थानीय मछुआरे आपको हरनाई से नाव द्वारा ले जाते हैं
        और आप एक छोटे रेतीले समुद्र तट पर उतरते हैं, जो केवल कम ज्वार (ओट) के समय
        ही संभव है। इसके अंदर चट्टानों को काटकर बनाई गई दीवारें, छोटे कमरों वाले बुर्ज,
        दो अन्न भंडार, एक पत्थर का बारूदखाना और एक बावड़ी है जिसमें आज भी पानी रहता
        है।'
      history: स्रोतों के अनुसार शिवाजी महाराज ने 1660 के आसपास एक जहाज निर्माण यार्ड
        के साथ इसका निर्माण किया था। कान्होजी आंग्रे का बेड़ा 1696 से यहाँ स्थित था,
        और 1713 में यह किला उन्हें सौंप दिया गया था। 1755 में पेशवा और अंग्रेजों की
        संयुक्त घेराबंदी के बाद 12 अप्रैल 1755 को इस पर कब्ज़ा कर लिया गया। 4 दिसंबर
        1818 को अंग्रेजों ने इस पर नियंत्रण कर लिया।
      significance: यूनेस्को-सूचीबद्ध एक मराठा समुद्री किला और कान्होजी आंग्रे की
        नौसेना का एक प्रारंभिक अड्डा।
      dos: '- हरनाई में मछुआरों के साथ नाव की व्यवस्था करें और वापसी का समय तय करें

        - जाने से पहले ज्वार-भाटा की जांच करें; केवल कम ज्वार (ओट) के समय ही उतरना
        संभव है

        - समुद्री द्वार पर नक्काशीदार बाघ, चील और हाथी देखें'
      donts: '- तय समय के बाद द्वीप पर न रुकें

        - समुद्र के अशांत होने पर पार करने का प्रयास न करें'
      safety_text: '- पहुंच कम ज्वार पर निर्भर करती है; ज्वार-भाटा की तालिका के अनुसार
        यात्रा की योजना बनाएं

        - द्वीप पर कोई जेटी और पीने का पानी नहीं है; साथ में पानी ले जाएं

        - मुख्य पूर्वी प्रवेश द्वार कंटीली झाड़ियों से अवरुद्ध है; संकरे रास्ते का
        उपयोग करें'
