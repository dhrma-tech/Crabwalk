  text:
    en:
      short_story: 'Shahi Masjid, locally known as Anda Masjid or Masaheb Masjid,
        is a 16th-century historical mosque located near the port of Dabhol in Dapoli.
        Constructed from dressed black trap stone, the mosque features symmetrical
        Iranian-style architecture, a central dome, and minarets, resembling the Jama
        Masjid of Bijapur.

        Although currently in a ruined state, the structure still retains entrance
        stairs sculpted from jet-black stone. It remains an archaeologically protected
        heritage site, reflecting Dabhol''s past status as an international trading
        port.'
      history: Built between 1559 and 1563 by Kamil Khan under the orders of Ayesha
        Bibi, the princess of Bijapur, the mosque was constructed at a cost of approximately
        1.5 million rupees during the Adil Shahi dynasty.
      significance: A 16th-century stone mosque exhibiting Iranian-style architecture,
        reflecting the rich maritime history of the ancient Dabhol port.
      dos: '- Observe the symmetrical architecture, the large central dome, and the
        intricately sculpted black stone entrance.

        - Respect the historical significance of the site, as it is an archaeologically
        protected building.'
      donts: '- Do not climb on the fragile, ruined parts of the mosque structure.

        - Do not deface the ancient stonework or leave behind any litter.'
      safety_text: Since the structure is old and partly in ruins, avoid standing
        directly under unstable archways or damaged roof sections.
    mr:
      short_story: 'दाभोळ बंदराजवळ असलेली शाही मशीद, जिला स्थानिक भाषेत ''अंडा मशीद''
        किंवा ''मासाहेब मशीद'' असेही म्हणतात, ही 16 व्या शतकातील एक ऐतिहासिक वास्तू
        आहे. काळ्या पाषाणात बांधलेली ही मशीद इराणी शैलीतील वास्तुकला, मोठा घुमट आणि
        मिनारांसाठी ओळखली जाते, जी विजापूरच्या जामा मशिदीसारखी दिसते.

        सध्या ही वास्तू काहीशी उद्ध्वस्त अवस्थेत असली तरी, जेट-ब्लॅक स्टोनमधून कोरलेल्या
        तिच्या प्रवेशद्वाराच्या पायऱ्या आजही लक्ष वेधून घेतात. पुरातत्व विभागाद्वारे
        संरक्षित असलेली ही वास्तू दाभोळच्या एका आंतरराष्ट्रीय व्यापारी बंदर म्हणून
        असलेल्या ऐतिहासिक महत्त्वाची साक्ष देते.'
      history: विजापूरची राजकन्या आयेशा बीबी हिच्या आदेशानुसार 1559 ते 1563 या काळात
        कामिल खान याने आदिलशाही राजवटीत सुमारे 15 लाख रुपये खर्च करून या मशिदीचे बांधकाम
        पूर्ण केले.
      significance: प्राचीन दाभोळ बंदराचा इतिहास आणि इराणी वास्तुकलेचे दर्शन घडवणारी
        16 व्या शतकातील एक काळ्या पाषाणाची मशीद.
      dos: '- मशिदीची वास्तुकला, मध्यभागी असलेला मोठा घुमट आणि प्रवेशद्वारावरील काळ्या
        पाषाणातील कोरीव काम पहा.

        - ही पुरातत्व विभागाची संरक्षित वास्तू असल्याने या ऐतिहासिक जागेचा आदर राखा.'
      donts: '- मशिदीच्या कमकुवत आणि उद्ध्वस्त झालेल्या भागांवर चढण्याचा प्रयत्न करू
        नका.

        - प्राचीन दगडांच्या बांधकामाला विद्रुप करू नका किंवा परिसरात कचरा टाकू नका.'
      safety_text: ही वास्तू जुनी आणि काहीशी उद्ध्वस्त अवस्थेत असल्याने, कमकुवत कमानी
        किंवा छताच्या खराब झालेल्या भागाखाली उभे राहणे टाळा.
    hi:
      short_story: 'दाभोल बंदरगाह के पास स्थित शाही मस्जिद, जिसे स्थानीय रूप से ''अंडा
        मस्जिद'' या ''मासाहेब मस्जिद'' के रूप में भी जाना जाता है, 16वीं शताब्दी की
        एक ऐतिहासिक इमारत है। काले पत्थरों से बनी यह मस्जिद अपनी ईरानी शैली की वास्तुकला,
        बड़े गुंबद और मीनारों के साथ अलग ही नजर आती है, जो बीजापुर की जामा मस्जिद
        के समान है।

        यद्यपि यह वर्तमान में खंडहर अवस्था में है, लेकिन यह संरचना अभी भी जेट-ब्लैक
        पत्थर से उकेरी गई प्रवेश सीढ़ियों को प्रदर्शित करती है। पुरातत्व विभाग द्वारा
        संरक्षित यह विरासत स्थल एक अंतरराष्ट्रीय व्यापारिक बंदरगाह के रूप में दाभोल
        के अतीत को दर्शाता है।'
      history: बीजापुर की राजकुमारी आयशा बीबी के आदेश पर 1559 से 1563 के बीच कामिल
        खान द्वारा निर्मित, इस मस्जिद का निर्माण आदिल शाही राजवंश के दौरान लगभग 15
        लाख रुपये की लागत से किया गया था।
      significance: प्राचीन दाभोल बंदरगाह के इतिहास और ईरानी वास्तुकला को दर्शाने
        वाली 16वीं शताब्दी की एक पत्थर की मस्जिद।
      dos: '- मस्जिद की वास्तुकला, बड़े केंद्रीय गुंबद और प्रवेश द्वार पर उकेरे गए
        काले पत्थर के काम को ध्यान से देखें।

        - यह पुरातत्व विभाग की संरक्षित इमारत है, इसलिए इस ऐतिहासिक स्थल का सम्मान
        करें।'
      donts: '- मस्जिद के कमजोर और खंडहर हो चुके हिस्सों पर चढ़ने का प्रयास न करें।

        - प्राचीन पत्थर की संरचना को खराब न करें या परिसर में कूड़ा न फैलाएं।'
      safety_text: चूंकि इमारत पुरानी है और आंशिक रूप से खंडहर है, इसलिए अस्थिर मेहराबों
        या क्षतिग्रस्त छत के हिस्सों के नीचे खड़े होने से बचें।
  photo:
