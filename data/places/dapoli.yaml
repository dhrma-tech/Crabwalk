        अंदर आती हैं और दिन भर की पकड़ी गई मछलियाँ सीधे रेत पर ही बेची जाती हैं।


        यह समुद्र तट ताड़ के पेड़ों से घिरा हुआ है, और समुद्र के अंदर सुवर्णदुर्ग
        का द्वीप किला है, जबकि किनारे पर स्थित पहाड़ी पर कनकदुर्ग और गोवा किले हैं।'
      history: null
      significance: null
      dos: '- नीलामी देखने के लिए शाम को आएँ

