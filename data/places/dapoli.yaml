        छोटा सा मछली पकड़ने वाला गाँव है। यह अरब सागर पर स्थित अपने समुद्र तट के लिए
        जाना जाता है।


        गाँव में एक पुराना शिव मंदिर, श्री देव कोलेश्वर है। स्थानीय लोग मराठी और कोंकणी
        की दालडी बोली बोलते हैं।'
      history: null
      significance: एक पुराने शिव मंदिर के साथ मछली पकड़ने वाले गाँव का समुद्र तट।
      dos: '- गाँव में श्री देव कोलेश्वर मंदिर के दर्शन करें'
      donts: '- समुद्र तट पर कचरा न छोड़ें'
