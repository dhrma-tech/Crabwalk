  wikipedia_url: https://en.wikipedia.org/wiki/Panhalakaji_Caves
  is_hidden_gem: false
  text:
    en:
      short_story: 'Panhalekaji is a group of about 29 rock-cut caves on the right
        bank of the Kotjai stream in Dapoli taluka. Some are Buddhist and some Hindu,
        carved over many centuries.


        Cave 10 has an image of Maha-Chandraroshana on a stupa. Cave 14 has Nath Pantha
        deities, and Cave 19 has a shivling with scriptures on the ceiling. Look for
        the elephant frieze and the carvings of Mahasiddhas.'
      history: Carving began in the 3rd century AD under the Hinayana sect. A Vajrayana
        group added Cave 10 in the 10th-11th centuries. Shiva and Ganapatya worship
        began here under the Silahara rulers. Inscriptions are in Brahmi and Devanagari.
      significance: A rare site where Buddhist and later Hindu and Nath traditions
        share one cave complex.
      dos: '- Carry a torch for the darker caves

        - Go with time to walk along the stream between caves'
      donts: '- Don''t touch or scratch the carvings

        - Don''t litter inside the caves'
      safety_text: '- Rock surfaces can be slippery near the stream, especially in
        the rains'
    mr:
      short_story: 'दापोली तालुक्यातील कोटजाई नदीच्या उजव्या तीरावर सुमारे 29 कातळात
        कोरलेल्या गुहांचा समूह म्हणजे पन्हाळेकाजी लेणी. अनेक शतकांच्या काळात कोरलेली
        ही लेणी काही बौद्ध तर काही हिंदू आहेत.


        लेणी क्रमांक 10 मध्ये स्तूपावर महा-चंद्ररोषणाची मूर्ती आहे. लेणी 14 मध्ये
        नाथ पंथाच्या देवता आहेत, आणि लेणी 19 मध्ये छतावर शिलालेख असलेले शिवलिंग आहे.
        येथील हत्तीची शिल्पे आणि महासिद्धांच्या मूर्ती नक्की पाहा.'
      history: हिनयान पंथाच्या काळात इसवी सनाच्या 3ऱ्या शतकात कोरकामाला सुरुवात झाली.
        10व्या-11व्या शतकात वज्रयान गटाने लेणी क्रमांक 10 ची भर घातली. शिलाहार राजांच्या
        काळात येथे शिव आणि गाणपत्य पूजा सुरू झाली. इथले शिलालेख ब्राह्मी आणि देवनागरी
        लिपीत आहेत.
      significance: हे एक दुर्मिळ ठिकाण आहे जिथे एकाच लेणी समूहात बौद्ध आणि नंतरच्या
        काळातील हिंदू व नाथ परंपरा एकत्र पाहायला मिळतात.
      dos: '- अंधाऱ्या लेण्यांसाठी सोबत टॉर्च ठेवा

        - लेण्यांच्या मधून वाहणाऱ्या प्रवाहाच्या काठावर फिरण्यासाठी पुरेसा वेळ काढून
        जा'
      donts: '- शिल्पांना स्पर्श करू नका किंवा ओरखडे काढू नका

        - लेण्यांच्या आत कचरा करू नका'
      safety_text: '- विशेषतः पावसाळ्यात प्रवाहाजवळील खडकाळ भाग निसरडा होऊ शकतो'
    hi:
      short_story: 'पन्हालेकाजी दापोली तालुका में कोटजाई नदी के दाहिने किनारे पर लगभग
        29 चट्टानों को काटकर बनाई गई गुफाओं का एक समूह है। कई सदियों में उकेरी गईं
        इनमें से कुछ गुफाएं बौद्ध हैं और कुछ हिंदू हैं।


        गुफा 10 में एक स्तूप पर महा-चंद्ररोषण की मूर्ति है। गुफा 14 में नाथ पंथ के
        देवता हैं, और गुफा 19 में छत पर शिलालेखों के साथ एक शिवलिंग है। यहां हाथी
        की नक्काशी और महासिद्धों की मूर्तियां जरूर देखें।'
      history: हीनयान संप्रदाय के तहत तीसरी शताब्दी ईस्वी में नक्काशी शुरू हुई। 10वीं-11वीं
        शताब्दी में वज्रयान समूह ने गुफा 10 जोड़ी। शिलाहार शासकों के काल में यहां
        शिव और गाणपत्य की पूजा शुरू हुई। शिलालेख ब्राह्मी और देवनागरी में हैं।
      significance: एक दुर्लभ स्थल जहां एक ही गुफा परिसर में बौद्ध और बाद की हिंदू
        और नाथ परंपराएं साझा होती हैं।
      dos: '- अंधेरी गुफाओं के लिए टॉर्च साथ रखें

        - गुफाओं के बीच धारा के किनारे टहलने के लिए समय निकालकर जाएं'
      donts: '- नक्काशी को छुएं या खरोंचें नहीं

        - गुफाओं के अंदर कूड़ा न फैलाएं'
      safety_text: '- धारा के पास चट्टानी सतह फिसलन भरी हो सकती है, खासकर बारिश में'
