    mr:
      short_story: 'कोळथरे हे दापोलीपासून सुमारे 19 किमी आणि दाभोळपासून 8 किमी अंतरावर
        किनारपट्टीवरील एक लहानसे मासेमारी करणारे गाव आहे. हे अरबी समुद्रावरील किनार्यासाठी
        प्रसिद्ध आहे.


        या गावात श्री देव कोलेश्वर नावाचे एक जुने शिवमंदिर आहे. येथील लोक मराठी आणि
        कोकणीची ''दालडी'' बोलीभाषा बोलतात.'
      history: null
      significance: एका जुन्या शिवमंदिरासह असलेले मासेमारी करणाऱ्या गावातील समुद्रकिनारा.
      dos: '- गावातील श्री देव कोलेश्वर मंदिराला भेट द्या'
      donts: '- किनाऱ्यावर कचरा टाकू नका'
