  text:
    en:
      short_story: 'Palgad, a village of about 3,000 people between Dapoli and Khed,
        is the birthplace of Pandurang Sadashiv Sane, known as Sane Guruji. He was
        born here on 24 December 1899.


        His best-known book, Shyamchi Aai, a memoir of his childhood and his mother,
        is set in Palgad. The book has been translated into almost every Indian language.'
      history: Sane Guruji left teaching in 1930 to join the freedom movement and
        spent about six and a half years in jail up to 1947. In 1947 his fast at Pandharpur
        led to the Vitthal temple being opened to Dalits.
      significance: The village where Shyamchi Aai is set, and the birthplace of one
        of Maharashtra's best-loved writers.
      dos: '- Read a chapter of Shyamchi Aai before you go

        - Combine with the short Palgad fort climb'
      donts: null
      safety_text: null
    mr:
      short_story: 'दापोली आणि खेड दरम्यान वसलेले सुमारे 3,000 लोकसंख्येचे पालगड हे
        पांडुरंग सदाशिव साने, म्हणजेच साने गुरुजी यांचे जन्मस्थान आहे. त्यांचा जन्म
        येथे 24 डिसेंबर 1899 रोजी झाला.


        त्यांचे बालपण आणि त्यांच्या आईच्या आठवणींवर आधारित ''श्यामची आई'' हे त्यांचे
        सर्वाधिक प्रसिद्ध पुस्तक पालगड येथेच रचले गेले आहे. या पुस्तकाचा जवळपास सर्व
        भारतीय भाषांमध्ये अनुवाद झाला आहे.'
      history: साने गुरुजींनी 1930 मध्ये स्वातंत्र्यलढ्यात सहभागी होण्यासाठी अध्यापन
        सोडले आणि 1947 पर्यंत सुमारे साडेसहा वर्षे कारावासात काढले. 1947 मध्ये पंढरपूर
        येथे त्यांनी केलेल्या उपोषणामुळे विठ्ठल मंदिर शोषितांसाठी (दलितांसाठी) खुले
        करण्यात आले.
      significance: '''श्यामची आई'' ज्या गावात घडले ते गाव, आणि महाराष्ट्रातील अत्यंत
        लाडक्या लेखकाचे जन्मस्थान.'
      dos: '- जाण्यापूर्वी ''श्यामची आई'' पुस्तकातील एखादे प्रकरण वाचा

        - पालगड किल्ल्याच्या छोट्या चढाईसोबत याची जोड द्या'
      donts: null
      safety_text: null
    hi:
      short_story: 'दापोली और खेड़ के बीच लगभग 3,000 की आबादी वाला गाँव पालगड, पांडुरंग
        सदाशिव साने, जिन्हें साने गुरुजी के रूप में जाना जाता है, का जन्मस्थान है।
        उनका जन्म यहाँ 24 दिसंबर 1899 को हुआ था।


        उनकी सबसे प्रसिद्ध पुस्तक ''श्यामची आई'', उनके बचपन और उनकी माँ का संस्मरण,
        पालगड में ही रची गई है। इस पुस्तक का लगभग हर भारतीय भाषा में अनुवाद किया गया
        है।'
      history: साने गुरुजी ने 1930 में स्वतंत्रता आंदोलन में शामिल होने के लिए शिक्षण
        छोड़ दिया और 1947 तक लगभग साढ़े छह साल जेल में बिताए। 1947 में पंढरपुर में
        उनके उपवास के कारण विठ्ठल मंदिर दलितों के लिए खोल दिया गया।
      significance: वह गाँव जहाँ 'श्यामची आई' की पृष्ठभूमि है, और महाराष्ट्र के सबसे
        प्रिय लेखकों में से एक का जन्मस्थान।
      dos: '- जाने से पहले ''श्यामची आई'' का एक अध्याय पढ़ें

        - छोटे पालगड किले की चढ़ाई के साथ इसे जोड़ें'
      donts: null
