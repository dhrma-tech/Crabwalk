        गुहेत सूर्याची मूर्ती ठेवली. सूर्योपासक असलेल्या कनका नावाच्या एका महिलेला
        स्वप्नात याबद्दल समजले आणि तिने हे मंदिर बांधले, ज्याला तिचे नाव दिले गेले.
      significance: कोकणातील एक दुर्मिळ सूर्य मंदिर, जिथे गावरहाटीचा उत्सव आजही तितक्याच
        उत्साहात साजरा होतो.
      dos: '- उष्मा टाळण्यासाठी सकाळी लवकर किंवा दुपारनंतर जा

        - देवघळी समुद्रकिनारा आणि सुमारे 3 किमी अंतरावर असलेल्या आडिवरे येथील महाकाली
        मंदिरासोबत याला भेट द्या'
      donts: '- मंदिरात चपला-बूट घालून जाऊ नका'
      safety_text: null
    hi:
      short_story: 'कशेली का कनकादित्य मंदिर कोंकण तट के गिने-चुने सूर्य मंदिरों में
        से एक है। कोंकणी घर की तरह ढलान वाली छत और लाल लेटराइट पत्थर से बने इस मंदिर
        में बड़े नेत्रों और चांदी के मुकुट वाली सूर्य देव की काले पत्थर की मूर्ति
        है। इसके सामने लकड़ी के खंभों वाला एक बड़ा सभा मंडप है。


        मुख्य त्योहार मित्र सप्तमी है, जो आमतौर पर फरवरी में होता है, जब देवता को
        रथ पर बिठाकर पूरे गांव में घुमाया जाता है।'
      history: स्थानीय लोगों का कहना है कि यह मंदिर 800 साल से अधिक पुराना है। किंवदंती
        है कि गुजरात के वेरावल से आ रहे एक नाविक ने हवा रुकने पर कशेली के पास एक गुफा
        में सूर्य की मूर्ति छोड़ दी थी। सूर्य की उपासक कनका नामक एक महिला को सपने
        में इसके बारे में पता चला और उसने मंदिर बनवाया, जिसका नाम उसी के नाम पर रखा
        गया।
      significance: कोंकण का एक दुर्लभ सूर्य मंदिर, जहां गांव का त्योहार आज भी जीवंत
        है।
      dos: '- गर्मी से बचने के लिए सुबह जल्दी या दोपहर बाद जाएं

        - देवघली समुद्र तट और लगभग 3 किमी दूर आडिवरे के महाकाली मंदिर के साथ इसे घूमने
        की योजना बनाएं'
      donts: '- मंदिर में जूते-चप्पल पहनकर न जाएं'
      safety_text: null
