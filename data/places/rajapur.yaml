- slug: rundhe-tali-petroglyphs
  status: ai_draft
  name_en: Rundhe Tali Petroglyphs
  name_mr: रुंढे तळी कातळशिल्प
  name_hi: रुंधे ताली पेट्रोग्लिफ्स (शैलचित्र)
  category: village
  taluka: Rajapur
  lat: 16.736748
  lng: 73.373237
  coord_source: osm node/12730413928
  osm_id: node/12730413928
  entry_fee_text: null
  entry_fee_inr: null
  visit_minutes: null
  opens: null
  closes: null
  closed_days: []
  best_time: null
  how_to_reach: On a laterite plateau near Rundhe, Rajapur taluka.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Rundhe Tali is one of the sites of the Konkan petroglyphs, prehistoric
        carvings cut into the flat laterite plateaus of the Konkan. The carvings show
        animals such as elephants, tigers, rhinos, stingrays and turtles, and simple
        human figures.


        About 70 such sites with over 1,500 carvings are recorded, many of them in
        Rajapur taluka, such as Barsu and Devache Gothane. The carvings are thought
        to be around 12,000 years old.'
      history: The art is dated from the Mesolithic to the early historic period.
        The lack of domestic animals suggests it was made by hunter-gatherers. The
        Konkan geoglyphs are on India's tentative list for UNESCO World Heritage status.
      significance: Part of the Konkan rock art group on India's UNESCO tentative
        list.
      dos: '- Go with a local guide; the carvings are hard to spot

        - Visit in the dry months when the plateau is clear'
      donts: '- Don''t walk on, scratch or chalk the carvings'
      safety_text: null
    mr:
      short_story: 'रुंढे तळी हे कोकण पेट्रोग्लिफ्सच्या (कातळशिल्प) ठिकाणांपैकी एक
        आहे, जे कोकणातील सपाट जांभ्या पठारावर कोरलेली प्रागैतिहासिक शिल्पे आहेत. या
        शिल्पांमध्ये हत्ती, वाघ, गंडे, शिंगाडे (स्टींग्रे) आणि कासव यांसारखे प्राणी
        आणि साध्या मानवी आकृत्या दर्शवल्या आहेत.


        अशी सुमारे 70 ठिकाणे आणि 1500 हून अधिक शिल्पे नोंदवली गेली आहेत, ज्यापैकी
        बरीच राजापूर तालुक्यात जसे की बारसू आणि देवाचे गोठणे येथे आहेत. ही शिल्पे
        सुमारे 12,000 वर्षे जुनी असल्याचे मानले जाते.'
      history: या कलेचा काळ मेसोलिथिकपासून (मध्य पाषाण युग) ते सुरुवातीच्या ऐतिहासिक
        काळापर्यंत मानला जातो. पाळीव प्राण्यांचा अभाव दर्शवतो की हे शिकारी-संग्राहकांनी
        बनवले होते. कोकणातील जिओग्लिफ्स हे भारताच्या युनेस्को जागतिक वारसा स्थळांच्या
        संभाव्य यादीत आहेत.
      significance: भारताच्या युनेस्कोच्या संभाव्य यादीतील कोकण रॉक आर्ट ग्रुपचा एक
        भाग.
      dos: '- स्थानिक मार्गदर्शकासोबत जा; शिल्पे शोधणे कठीण आहे

        - कोरड्या महिन्यांत भेट द्या जेव्हा पठार स्वच्छ असते'
      donts: '- शिल्पांवर चालु नका, त्यांना खाजव नका किंवा त्यावर खडू लावू नका'
      safety_text: null
    hi:
      short_story: 'रुंधे ताली कोकण पेट्रोग्लिफ्स (शैलचित्र) स्थलों में से एक है,
        जो कोकण के सपाट लेटराइट पठारों पर उकेरी गई प्रागैतिहासिक नक्काशी है। इन नक्काशी
        में हाथियों, बाघों, गैंडों, स्टिंग्रे और कछुओं जैसे जानवरों और सरल मानव आकृतियों
        को दिखाया गया है। दर्जनों ऐसी कलाकृतियाँ हैं।


        लगभग 70 ऐसे स्थल दर्ज किए गए हैं जिनमें 1,500 से अधिक नक्काशी शामिल हैं, जिनमें
        से कई राजापुर तालुका में हैं, जैसे बारसू और देवाचे गोठणे। माना जाता है कि
        ये नक्काशी लगभग 12,000 साल पुरानी हैं।'
      history: इस कला का काल मध्य पाषाण युग से लेकर शुरुआती ऐतिहासिक काल तक का है।
        पालतू जानवरों की अनुपस्थिति से पता चलता है कि यह शिकारी-संग्राहकों द्वारा
        बनाई गई थी। कोकण जियोटैग्ड जियोग्लिफ्स भारत की यूनेस्को विश्व धरोहर स्थल की
        अस्थायी सूची में हैं.
      significance: भारत की यूनेस्को की अस्थायी सूची में शामिल कोकण रॉक आर्ट समूह
        का हिस्सा।
      dos: '- किसी स्थानीय गाइड के साथ जाएँ; नक्काशी को ढूँढना मुश्किल है

        - शुष्क महीनों में जाएँ जब पठार साफ होता है'
      donts: '- नक्काशी पर चलें नहीं, उस पर खरोंचें नहीं और न ही उस पर चाक लगाएँ'
      safety_text: null
