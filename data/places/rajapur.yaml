        में ब्रिटिश कर्नल इमलोक ने इसे अपने कब्जे में ले लिया। 1862 तक इस किले से
        मानवीय बस्ती को पूरी तरह हटा दिया गया था।
      significance: राजापुर तालुक में एक ऐतिहासिक किले के अवशेष और तटीय समुद्र तट
