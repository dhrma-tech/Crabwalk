  text:
    en:
      short_story: 'The Kanakaditya temple at Kasheli is one of the few Sun temples
        on the Konkan coast. Built of red laterite with a sloping roof like a Konkani
        house, it has a black stone idol of the Sun god with large eyes and a silver
        crown, and a big wooden-pillared sabha mandap in front.


        The main festival is Mitra Saptami, usually in February, when the deity is
        taken through the village on a chariot.'
      history: Locals say the temple is over 800 years old. Legend says a boatman
        sailing from Veraval in Gujarat left a Sun idol in a cave near Kasheli when
        the wind dropped. A woman named Kanaka, a Sun worshipper, learned of it in
        a dream and built the temple, which took her name.
      significance: A rare Sun temple of the Konkan, with a living village festival.
      dos: '- Go early or late afternoon to avoid the heat

        - Combine with Devghali beach and the Mahakali temple at Adivare, about 3
        km away'
      donts: '- Don''t carry footwear into the temple'
      safety_text: null
    mr:
      short_story: 'कशेळी येथील कनकादित्य मंदिर हे कोकण किनारपट्टीवरील मोजक्या सूर्य
        मंदिरांपैकी एक आहे. कोकणी घरासारखे उतरते छप्पर आणि लाल जांभ्या दगडात बांधलेल्या
        या मंदिरात, मोठे डोळे आणि चांदीचा मुकुट असलेली सूर्यदेवाची काळ्या पाषाणाची
        मूर्ती आहे. मूर्तीच्या समोर एक मोठा लाकडी खांबांचा सभामंडप आहे.


        येथील मुख्य उत्सव ''मित्र सप्तमी'' हा असून तो साधारणपणे फेब्रुवारीमध्ये असतो,
        जेव्हा देवाची गावातून रथातून मिरवणूक काढली जाते.'
      history: स्थानिकांच्या मते हे मंदिर 800 वर्षांहून जुने आहे. आख्यायिकेनुसार,
