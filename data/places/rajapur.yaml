        आहे. किनारपट्टीच्या भागात असलेला हा परिसर अरबी समुद्राकडे तोंड करून उभा आहे
        आणि जलमार्गावरील जहाजांना मार्गदर्शन करण्याचे काम करतो.


        येथे येणारे प्रवासी किनारपट्टीची रचना आणि आजूबाजूचा सागरकिनारा पाहू शकतात.
        या भागापर्यंत पोहोचण्यासाठी स्थानिक रस्ते उपलब्ध आहेत.'
      history: 1 जानेवारी 1817 रोजी नजीकच्या किल्ल्याजवळ एचएमएस आउटरम ही ब्रिटिश नौका
        बुडाल्यानंतर जैतापूर येथे लाईटहाउस उभारण्यात आला.
      significance: राजापूर तालुक्यातील ऐतिहासिक संदर्भ असलेला किनारपट्टीवरील मार्गदर्शक
        स्तूप.
      dos: '- भेट देण्यापूर्वी स्थानिक हवामान आणि प्रवेश परवानग्या तपासा

