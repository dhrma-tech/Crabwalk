        a banyan tree. The location connects via regional roads from Ratnagiri and
        Rajapur through Nate village.'
      history: Evidence indicates the fort belonged to Kanhoji Angre in 1690 and was
        captured by British Colonel Imlock in 1818. The residential portion was vacated
        by 1862.
      significance: A coastal site featuring a historic fort ruin and open sea views
        in Rajapur taluka.
