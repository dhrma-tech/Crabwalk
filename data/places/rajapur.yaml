  status: ai_draft
  name_en: Yashwantgad Fort
  name_mr: यशवंतगड किल्ला
  name_hi: यशवंतगढ़ किला
  category: fort
  taluka: Rajapur
  lat: 16.630896
  lng: 73.356844
  coord_source: osm way/2039257928
  osm_id: way/2039257928
  entry_fee_text: null
  entry_fee_inr: null
  visit_minutes: null
  opens: null
  closes: null
  closed_days: []
  best_time: null
  how_to_reach: On Rajapur creek, sea on one side.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Yashwantgad is a coastal fort just west of Nate village, about
        30 km from Rajapur, on the north side of Jaitapur creek. Water surrounds it
        on the west and south.


        The fort covers about 7 acres with 21 bastions built of laterite. A 15-foot
        trench guards the land side, and a deep rectangular well sits under the flag
        bastion. Seeing the whole fort takes about three hours.'
      history: It was probably built by the Bijapur rulers in the 16th century to
        guard Jaitapur and Rajapur. Shivaji Maharaj strengthened it after taking Rajapur,
        and a naval dockyard was started at Jaitapur below it after 1674. It passed
        to Kanhoji Angre by 1690 and stayed with the Marathas until the British took
        it in 1818.
      significance: A 7-acre sea fort with 21 bastions watching over Jaitapur creek.
      dos: '- Look for the sign ''Shri Ghera Yashwantgad Fort'' on the Nate-Ambolgad
        road

        - Start with the citadel, then the outer fort, then the sea walls'
      donts: '- Don''t push through the thorny scrub near the seaward wall'
      safety_text: Some stairs and wall ends are broken or overgrown. Wear full-length
        clothes and watch your footing.
    mr:
      short_story: 'यशवंतगड हा जयगड खाडीच्या उत्तर बाजूस, राजापूरपासून सुमारे 30 किमी
        अंतरावर, नाटे गावाच्या अगदी पश्चिमेला असलेला एक सागरी किल्ला आहे. पश्चिम आणि
        दक्षिण बाजूस पाድ्याने याला वेढले आहे.


        किल्ला जांभ्या दगडाने बांधलेल्या 21 बुरुजांसह सुमारे 7 एकर परिसरात पसरलेला
        आहे. जमिनीच्या बाजूने 15 फूट रुंद खंदक संरक्षण करतो आणि झेंडा बुरुजाखाली एक
        खोल आयताकृती विहीर आहे. संपूर्ण किल्ला पाहायला सुमारे तीन तास लागतात.'
      history: जयगड आणि राजापूरचे रक्षण करण्यासाठी 16 व्या शतकात कदाचित विजापूरच्या
        राज्यकर्त्यांनी हा बांधला असावा. राजापूर घेतल्यानंतर छत्रपती शिवाजी महाराजांनी
        तो बळकट केला आणि 1674 नंतर त्याच्या खाली जयपूर येथे नौदल गोदी सुरू झाली. 1690
        पर्यंत तो कान्होजी आंग्रे यांच्याकडे गेला आणि 1818 मध्ये ब्रिटीशांनी तो ताब्यात
        घेईपर्यंत मराठ्यांकडेच राहिला.
      significance: जयगड खाडीवर नजर ठेवणारा 21 बुरुजांचा 7 एकरांचा सागरी किल्ला.
      dos: '- नाटे-आंबोलगड रस्त्यावर ''श्री घेरा यशवंतगड किल्ला'' असा फलक शोधा

        - आधी बालेकिल्ला, नंतर बाह्य किल्ला आणि नंतर समुद्राकडील भिंती पहा'
      donts: '- समुद्राकडील भिंतीजवळील काटेरी झुडपांमधून जबरदस्तीने वाट काढू नका'
      safety_text: काही पायऱ्या आणि भिंतींचे टोक तुटलेले किंवा झाकोळलेले आहेत. पूर्ण
        लांबीचे कपडे घाला आणि चालताना लक्ष ठेवा.
    hi:
      short_story: 'यशवंतगढ़ नाटे गाँव से ठीक पश्चिम में, राजापूर से लगभग 30 किमी
        दूर, जयगढ़ क्रीक के उत्तर की ओर एक तटीय किला है। पश्चिम और दक्षिण में पानी
        इसे घेरे हुए है।


        यह किला लेटराइट से बने 21 बुर्जों के साथ लगभग 7 एकड़ में फैला हुआ है। भूमि
        की ओर से 15 फीट चौड़ी खाई रक्षा करती है, और झंडा बुर्ज के नीचे एक गहरा आयताकार
        कुआँ स्थित है। पूरे किले को देखने में लगभग तीन घंटे लगते हैं।'
      history: यह शायद 16वीं शताब्दी में बीजापुर के शासकों द्वारा जयगढ़ और राजापुर
        की रक्षा के लिए बनाया गया था। राजापुर लेने के बाद शिवाजी महाराज ने इसे मजबूत
        किया, और 1674 के बाद इसके नीचे जयगढ़ में एक नौसेना गोदी शुरू की गई। यह 1690
        तक कान्होजी आंग्रे के पास चला गया और 1818 में अंग्रेजों द्वारा कब्जा किए जाने
        तक मराठों के पास ही रहा।
      significance: जयगढ़ क्रीक पर नजर रखने वाला 21 बुर्जों वाला 7 एकड़ का समुद्री
        किला।
      dos: '- नाटे-अंबोलगढ़ रोड पर ''श्री घेरा यशवंतगढ़ फोर्ट'' का बोर्ड देखें

