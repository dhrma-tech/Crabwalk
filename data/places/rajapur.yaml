        नरम रेत और तटीय क्षेत्र मौजूद है। यहाँ आने वाले पर्यटक तट के पास स्थित अंबोलगढ़
        किले के अवशेष देख सकते हैं।


        किले के परिसर में पुरानी किलेबंदी के अवशेष, एक सूखी कुवॅ और बरगद का पेड़ है।
        यह स्थान राजापुर और रत्नागिरी से नाटे गाँव के रास्ते से जुड़ा हुआ है।'
