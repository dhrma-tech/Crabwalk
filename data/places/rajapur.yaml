  text:
    en:
      short_story: 'Ambolgad is a small square coastal fort in Ambolgad village, Rajapur
        taluka, about 36 km from Rajapur via Nate. It has five bastions, a partly
        dug moat and, inside, a big banyan tree with a broken cannon, ruined buildings
        and a dry well.


        The ramparts have collapsed into mounds and the entrance is hard to spot.
        A walk round takes about half an hour. A beach and Gagangiri Maharaj''s monastery
        are close by.'
      history: Probably built in the 16th century to guard Musakaji port and shipping
        in Jaitapur creek. Linked to Kanhoji Angre by 1690, it was captured by Colonel
        Imlack in 1818.
      significance: null
      dos: '- Combine with Madban beach and Yashwantgad'
      donts: null
      safety_text: '- The entrance is hidden between two bastions; ask locals'
    mr:
      short_story: 'आंबोळगड हा राजापूर तालुक्यातील आंबोळगड गावात असलेला एक छोटा चौरसाकृती
        सागरी किल्ला आहे. नाटे मार्गे राजापूरवरून तो सुमारे 36 किमी अंतरावर आहे. याला
        पाच बुरूज आणि अंशतः खोदलेला खंदक आहे. आतमध्ये एक मोठे वडाचे झाड, एक तुटलेली
        तोफ, पडक्या इमारती आणि एक कोरडी विहीर आहे.


        किल्ल्याची तटबंदी कोसळून तिचे ढिगारे झाले आहेत आणि प्रवेशद्वार शोधणे कठीण
        जाते. संपूर्ण किल्ला फिरण्यासाठी सुमारे अर्धा तास लागतो. जवळच एक समुद्रकिनारा
        आणि गगनगिरी महाराजांचा मठ आहे.'
      history: मुसाकाजी बंदर आणि जैतापूर खाडीतील जहाजांचे रक्षण करण्यासाठी हा किल्ला
        बहुधा 16 व्या शतकात बांधला गेला असावा. 1690 च्या सुमारास त्याचा संबंध कान्होजी
        आंग्रे यांच्याशी होता आणि 1818 मध्ये कर्नल इमलॅकने तो जिंकून घेतला.
      significance: null
      dos: '- माडबन समुद्रकिनारा आणि यशवंतगड सोबत याला भेट द्या'
      donts: null
      safety_text: '- प्रवेशद्वार दोन बुरुजांच्या मध्ये लपलेले आहे; स्थानिकांना विचारा'
    hi:
      short_story: 'अंबोलगढ़, राजापुर तालुका के अंबोलगढ़ गांव में स्थित एक छोटा चौकोर
        तटीय किला है। नाटे के रास्ते यह राजापुर से लगभग 36 किमी दूर है। इसमें पांच
        बुर्ज और आंशिक रूप से खुदी हुई एक खाई है, तथा अंदर एक बड़ा बरगद का पेड़, एक
        टूटी हुई तोप, खंडहर हो चुकी इमारतें और एक सूखा कुआं है।


        प्राचीर ढहकर टीलों में बदल गई है और प्रवेश द्वार आसानी से दिखाई नहीं देता।
        पूरा किला घूमने में लगभग आधा घंटा लगता है। पास ही एक समुद्र तट और गगनगिरी
        महाराज का मठ है।'
      history: मुसाकाजी बंदरगाह और जैतापुर खाड़ी में जहाजों की सुरक्षा के लिए संभवतः
        16वीं शताब्दी में इसे बनाया गया था। 1690 तक इसका संबंध कान्होजी आंग्रे से
        था और 1818 में कर्नल इमलैक ने इस पर कब्ज़ा कर लिया।
      significance: null
      dos: '- माडबन समुद्र तट और यशवंतगढ़ के साथ इसे घूमने की योजना बनाएं'
      donts: null
      safety_text: '- प्रवेश द्वार दो बुर्जों के बीच छिपा हुआ है; स्थानीय लोगों से
        पूछें'
