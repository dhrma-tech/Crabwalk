        वास्तुकला में पारंपरिक सभामंडप और गर्भगृह शामिल हैं और जो घने पेड़ों से घिरा
        है.
      significance: मृदनी नदी के तट पर एक ऐतिहासिक शिव मंदिर और प्राकृतिक झरने से
