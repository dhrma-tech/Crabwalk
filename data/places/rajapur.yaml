  text:
    en:
      short_story: 'The Aryadurga temple stands in Devihasol village, about 18 km
        from Rajapur and 52 km from Ratnagiri. The goddess is the kuldevi of many
        Karhade Brahmin families.


        Inside the shrine are footprints said to be the goddess''s own. An annual
        fair is held in October, on the eighth day of Navratri.'
      history: Legend says a devotee, Palsule Desai, used to visit the goddess at
        Ankola in Karnataka every year. When he could no longer travel, she agreed
        to follow him home if he did not look back. At the Devihasol border he turned
        at the sound of her anklets; she vanished, leaving the footprints where the
        temple now stands.
      significance: Kuldevi of many Karhade Brahmin families.
      dos: null
      donts: '- Don''t carry footwear into the temple'
      safety_text: null
    mr:
      short_story: 'आर्यादुर्गा मंदिर राजापूरपासून सुमारे 18 किमी आणि रत्नागिरीपासून
        52 किमी अंतरावर असलेल्या देवीहसोळ गावात आहे. ही देवी अनेक कऱ्हाडे ब्राह्मण
        कुटुंबांची कुलदेवता आहे.


        गाभाऱ्यात देवीच्याच मानल्या जाणाऱ्या पाऊलखुणा आहेत. ऑक्टोबरमध्ये नवरात्रीच्या
        आठव्या दिवशी इथे वार्षिक जत्रा भरते.'
      history: आख्यायिकेनुसार पळसुले देसाई नावाचे एक भक्त दरवर्षी कर्नाटकातील अंकोला
        येथे देवीच्या दर्शनासाठी जात असत. जेव्हा त्यांना प्रवास करणे शक्य झाले नाही,
        तेव्हा देवीने त्यांच्या मागे त्यांच्या घरी येण्यास सहमती दर्शवली, पण अट घातली
        की त्यांनी मागे वळून पाहता कामा नये. देवीहसोळच्या वेशीवर पैंजणांचा आवाज आल्याने
        ते मागे वळले; तेव्हा देवी अदृश्य झाली, आणि तिथेच तिच्या पाऊलखुणा राहिल्या
        जिथे आज हे मंदिर उभे आहे.
      significance: अनेक कऱ्हाडे ब्राह्मण कुटुंबांची कुलदेवता.
      dos: null
      donts: '- मंदिरात चपला-बूट घालून जाऊ नका'
      safety_text: null
    hi:
      short_story: 'आर्यादुर्गा मंदिर राजापुर से लगभग 18 किमी और रत्नागिरि से 52 किमी
        दूर देवीहसोल गांव में स्थित है। यह देवी कई कऱ्हाड़े ब्राह्मण परिवारों की कुलदेवी
        हैं।


        मंदिर के गर्भगृह में पदचिह्न हैं जिन्हें स्वयं देवी का माना जाता है। अक्टूबर
        में, नवरात्रि के आठवें दिन यहां एक वार्षिक मेला लगता है।'
      history: किंवदंती है कि पल्सुले देसाई नामक एक भक्त हर साल कर्नाटक के अंकोला
        में देवी के दर्शन करने जाते थे। जब वे यात्रा करने में असमर्थ हो गए, तो देवी
