- slug: thibaw-palace
  status: ai_draft
  name_en: Thibaw Palace
  name_mr: थिबा राजवाडा
  name_hi: थिबा पैलेस
  category: museum
  taluka: Ratnagiri
  lat: 16.983578
  lng: 73.311147
  coord_source: osm way/1982780392
  osm_id: way/1982780392
  entry_fee_text: Entry fee applicable (amount not stated by source)
  entry_fee_inr: null
  visit_minutes: null
  opens: '10:00'
  closes: '17:00'
  closed_days: []
  best_time: null
  how_to_reach: null
  nearest_station: Ratnagiri (7 km)
  nearest_bus_stop: Ratnagiri bus stand (1 km)
  monsoon_status: open
  monsoon_reason: null
