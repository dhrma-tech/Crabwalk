  text:
    en:
      short_story: 'Lokmanya Bal Gangadhar Tilak, a leader of India''s freedom movement,
        was born in this house in Tilak Alley, Ratnagiri, and lived here until he
        was about 10. The government has preserved it as a national monument.


        Inside you can see his old photographs, press clippings and items he used.'
      history: Tilak was born here, in a rented house in Tilak Alley, on 23 July 1856
        and lived here until 1866. He went on to become a journalist, teacher, social
        reformer, lawyer and a leading figure of the Indian independence movement.
        He died on 1 August 1920.
      significance: Birthplace of Lokmanya Tilak; a national monument.
      dos: '- Combine with Thibaw Palace and Patit Pavan Mandir in the same city walk'
      donts: '- Don''t touch the displayed items'
      safety_text: null
    mr:
      short_story: 'भारताच्या स्वातंत्र्यलढ्यातील एक प्रमुख नेते, लोकमान्य बाळ गंगाधर
        टिळक यांचा जन्म रत्नागिरीतील टिळक आळीतल्या याच घरात झाला. ते सुमारे 10 वर्षांचे
        होईपर्यंत इथेच राहिले. सरकारने हे घर आता एक राष्ट्रीय स्मारक म्हणून जतन केले
        आहे.


        आतमध्ये तुम्हाला त्यांचे जुने फोटो, वर्तमानपत्रांची कात्रणे आणि त्यांनी वापरलेल्या
        वस्तू पाहता येतील.'
      history: 23 जुलै 1856 रोजी टिळक आळीतील एका भाड्याच्या घरात टिळकांचा जन्म झाला
        आणि 1866 पर्यंत ते इथे राहिले. पुढे ते एक पत्रकार, शिक्षक, समाजसुधारक, वकील
        आणि भारतीय स्वातंत्र्यलढ्याचे प्रमुख नेते बनले. 1 ऑगस्ट 1920 रोजी त्यांचे
        निधन झाले.
      significance: लोकमान्य टिळकांचे जन्मस्थान; एक राष्ट्रीय स्मारक.
      dos: '- एकाच फेरफटक्यामध्ये यासोबतच थिबा पॅलेस आणि पतितपावन मंदिरालाही भेट द्या'
      donts: '- प्रदर्शनातील वस्तूंना हात लावू नका'
      safety_text: null
    hi:
      short_story: 'भारत के स्वतंत्रता आंदोलन के एक प्रमुख नेता, लोकमान्य बाल गंगाधर
        तिलक का जन्म रत्नागिरी की तिलक आली में इसी घर में हुआ था और वे लगभग 10 साल
        की उम्र तक यहीं रहे। सरकार ने इसे एक राष्ट्रीय स्मारक के रूप में संरक्षित
        किया है।


        अंदर आप उनकी पुरानी तस्वीरें, प्रेस क्लिपिंग और उनके द्वारा इस्तेमाल की गई
        चीजें देख सकते हैं।'
      history: तिलक का जन्म 23 जुलाई 1856 को तिलक आली में एक किराए के घर में हुआ था
        और वे 1866 तक यहीं रहे। आगे चलकर वे एक पत्रकार, शिक्षक, समाज सुधारक, वकील
        और भारतीय स्वतंत्रता आंदोलन के एक प्रमुख व्यक्ति बने। 1 अगस्त 1920 को उनका
        निधन हो गया।
      significance: लोकमान्य तिलक का जन्मस्थान; एक राष्ट्रीय स्मारक।
      dos: '- एक ही वॉक में इसके साथ थिबा पैलेस और पतित पावन मंदिर भी घूमें'
      donts: '- प्रदर्शित वस्तुओं को न छुएं'
