  text:
    en:
      short_story: 'The Gateway of Ratnagiri is a structure featuring a sloped roof
        located at the Ratnagiri jetty area near Mandavi Beach. It overlooks the coastal
        waters and serves as a prominent landmark point along the town''s shore.


        Visitors walk along this seaside area to view the expanse of the Arabian Sea,
        the adjacent port zone, and the shoreline breezes. The spot connects local
        pedestrian movement near the waterfront jetty.'
      history: According to local tradition, this coastal defensive and architectural
        structure at the jetty was associated with the work of Pratinidhi Dhondu Bhaskar.
      significance: Coastal landmark structure at the Mandavi jetty area overlooking
        the Arabian Sea.
      dos: '- Visit during morning or late afternoon for comfortable weather.

        - Watch your step near the unpaved edges of the jetty area.'
      donts: '- Do not climb onto structural railings or unsafe walls.

        - Do not litter plastic waste near the waterfront.'
      safety_text: Keep a safe distance from slippery rock surfaces and unguarded
        waterfront edges during high tides.
    mr:
      short_story: 'गेटवे ऑफ रत्‍नागिरी हे रत्‍नागिरीतील मांडवी बीचजवळील जेटी परिसरात
        असलेली उतरत्या छापराची एक वास्तू आहे. ही वास्तू किनारपट्टीच्या पाण्याकडे तोंड
        करून उभी असून शहराच्या काठावरील एक प्रमुख खूण मानली जाते.


        येथे येणारे पर्यटक अरबी समुद्र, लगतचा बंदर परिसर आणि समुद्रावरून वाहणाऱ्या
        वाऱ्याचा आनंद घेण्यासाठी किनाऱ्यावर फेरफटका मारतात. हा परिसर वॉटरफ्रंट जेटीजवळ
        लोकांच्या आवागमनाशी जोडलेला आहे.'
      history: स्थानिक लोकविश्वासानुसार, जेटीवरील या किनारपट्टीवरील संरक्षणात्मक आणि
        वास्तुकलेच्या रचनेचा संबंध प्रतिमेशी म्हणजेच प्रतिनिधी धोंडू भास्कर यांच्या
        कार्याशी जोडला जातो.
      significance: मांडवी जेटी परिसरातील अरबी समुद्राकडे पाहणारी किनारपट्टीची महत्त्वाची
        खूण.
      dos: '- हवामानानुसार सकाळी किंवा दुपारी उशिरा भेट द्या.

        - जेटी परिसरातील कडांवर चालताना काळजी घ्या.'
      donts: '- वास्तूच्या रेलिंगवर किंवा असुरक्षित भिंतींवर चढू नका.

        - किनारपट्टीजवळ प्लॅस्टिक कचरा टाकू नका.'
      safety_text: भरतीच्या वेळी निसरड्या खडकांवर आणि संरक्षक भिंत नसलेल्या कडेवर
        जाताना योग्य अंतर ठेवा.
    hi:
      short_story: 'गेटवे ऑफ़ रत्नागिरी मांडवी बीच के पास रत्नागिरी जेटी क्षेत्र में
        स्थित एक ढलानदार छत वाली संरचना है। यह तटीय जल की ओर मुख किए हुए है और शहर
        के तट पर एक प्रमुख स्थलचिह्न के रूप में कार्य करती है।


        पर्यटक अरब सागर के विस्तार, निकटवर्ती बंदरगाह क्षेत्र और तटीय हवा का आनंद
        लेने के लिए इस समुद्री क्षेत्र में टहलते हैं। यह स्थान जलमार्ग जेटी के पास
        तटीय गतिविधियों को जोड़ता है।'
      history: स्थानीय परंपरा के अनुसार, जेटी पर इस तटीय संरचना का निर्माण कार्य प्रतिनिधि
        धोंडू भास्कर से जुड़ा माना जाता है।
      significance: मांडवी जेटी क्षेत्र में अरब सागर की ओर देखने वाली तटीय संरचना।
      dos: '- सुहाना मौसम पाने के लिए सुबह या देर दोपहर में जाएँ।

        - जेटी क्षेत्र के किनारों पर सावधानी से चलें।'
      donts: '- संरचना की रेलिंग या असुरक्षित दीवारों पर न चढ़ें।

        - तट के पास प्लास्टिक का कचरा न फैलाएँ।'
      safety_text: उच्च ज्वार के दौरान फिसलन भरी चट्टानों और बिना सुरक्षा वाले तटीय
        किनारों से उचित दूरी बनाए रखें।
