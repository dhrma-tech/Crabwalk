  osm_id: way/80527836
  entry_fee_text: Free Entry
  entry_fee_inr: 0
  visit_minutes: 60
  opens: 06:00
  closes: '18:00'
  closed_days: []
  best_time: null
  how_to_reach: About 2 km from Ratnagiri town; a road leads to the entrance gate.
  nearest_station: Ratnagiri Railway Station, 11 km
  nearest_bus_stop: Ratnagiri Bus Stand, 4 km
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Ratnagiri_Fort,_Maharashtra
  is_hidden_gem: false
  text:
    en:
      short_story: 'Ratnadurg sits on a headland about 2 km from Ratnagiri town, with
        the sea on three sides. Most people come for the Bhagwati temple inside the
        walls, then stay for the views from the bastions.


        A walk around the fort takes about an hour. Look out for Rede Buruj, said
        to be its strongest bastion, the lighthouse on one side and the cave below
        the fort.'
      history: The fort dates to the Bahmani period. Shivaji took it from Adil Shah
        of Bijapur in 1670 and added towers on two high points. Kanhoji Angre strengthened
        the citadel between 1750 and 1755, and Dhondu Bhaskar Pratinidhi made minor
        repairs in the Peshwa years. The British took it in 1818. The Bhagwati temple
        was renovated in 1950.
      significance: Ratnagiri's best-known fort, and home to the Bhagwati temple that
        draws most visitors.
      dos: '- Combine the fort walk with a visit to the Bhagwati temple

        - Keep about an hour for the full round of the walls

        - Go early or late in the day for softer light and cooler air'
      donts: '- Don''t lean over the seaward walls and bastions

        - Don''t leave plastic or litter on the fort'
      safety_text: '- The walls drop straight to the sea on three sides; keep children
        close

        - Paths are uneven; wear shoes with grip'
    mr:
      short_story: 'रत्नागिरी शहरापासून सुमारे 2 किमी अंतरावर असलेल्या एका भूशिरावर
        रत्नदुर्ग किल्ला वसलेला असून याच्या तीन बाजूंनी समुद्र आहे. बहुतांश लोक किल्ल्यावरील
        भगवती मंदिराच्या दर्शनासाठी येतात आणि त्यानंतर बुरुजांवरून दिसणाऱ्या नयनरम्य
        दृश्यांचा आनंद घेण्यासाठी तिथे वेळ घालवतात.


        किल्ल्यात फेरफटका मारण्यासाठी सुमारे एक तास लागतो. ''रेडे बुरुज'' हा इथला
        सर्वात भक्कम बुरूज मानला जातो, तो नक्की पहा. एका बाजूला दीपगृह आणि किल्ल्याच्या
        खाली असलेली गुहादेखील पाहण्यासारखी आहे.'
      history: हा किल्ला बहामनी काळातील आहे. 1670 मध्ये शिवाजी महाराजांनी तो विजापूरच्या
        आदिलशहाकडून जिंकून घेतला आणि दोन उंच ठिकाणांवर बुरूज बांधले. 1750 ते 1755
        दरम्यान कान्होजी आंग्रे यांनी बालेकिल्ला मजबूत केला आणि पेशवे काळात धोंडू
        भास्कर प्रतिनिधी यांनी काही किरकोळ डागडुजी केली. 1818 मध्ये ब्रिटिशांनी तो
        जिंकला. 1950 मध्ये भगवती मंदिराचा जीर्णोद्धार करण्यात आला.
      significance: रत्नागिरीतील सर्वात प्रसिद्ध किल्ला, आणि सर्वाधिक भाविकांना आकर्षित
        करणाऱ्या भगवती मंदिराचे घर.
      dos: '- किल्ला पाहण्यासोबतच भगवती मंदिराचेही दर्शन घ्या

        - संपूर्ण किल्ल्याच्या तटबंदीवरून फिरण्यासाठी साधारण एक तासाचा वेळ राखून ठेवा

        - उष्मा टाळण्यासाठी आणि छान उजेडासाठी सकाळी लवकर किंवा संध्याकाळी जा'
      donts: '- समुद्राकडील तटबंदी आणि बुरुजांवरून खाली वाकून पाहू नका

        - किल्ल्यावर प्लास्टिक किंवा कचरा टाकू नका'
      safety_text: '- तीन बाजूंनी तटबंदी थेट समुद्रात उतरते; त्यामुळे लहान मुलांना
        जवळच ठेवा

        - वाटा चढ-उताराच्या आहेत; चांगली पकड असलेले शूज घाला'
    hi:
      short_story: 'रत्नागिरि शहर से लगभग 2 किमी दूर एक अंतरीप पर रत्नदुर्ग किला स्थित
        है, जिसके तीन ओर समुद्र है। अधिकांश लोग चारदीवारी के अंदर स्थित भगवती मंदिर
        के दर्शन के लिए आते हैं, और फिर बुर्जों से नज़ारे देखने के लिए रुकते हैं।


        किले में घूमने में लगभग एक घंटा लगता है। ''रेडे बुर्ज'' को ज़रूर देखें, जिसे
        इसका सबसे मज़बूत बुर्ज कहा जाता है, साथ ही एक तरफ प्रकाशस्तंभ (लाइटहाउस) और
        किले के नीचे स्थित गुफा भी है।'
      history: यह किला बहमनी काल का है। 1670 में शिवाजी ने इसे बीजापुर के आदिल शाह
        से छीन लिया और दो ऊंचे स्थानों पर टावर जोड़े। कान्होजी आंग्रे ने 1750 और 1755
        के बीच गढ़ को मज़बूत किया, और पेशवा काल में धोंडू भास्कर प्रतिनिधि ने मामूली
        मरम्मत करवाई। 1818 में अंग्रेजों ने इस पर कब्ज़ा कर लिया। भगवती मंदिर का 1950
        में जीर्णोद्धार किया गया था।
      significance: रत्नागिरि का सबसे प्रसिद्ध किला, और भगवती मंदिर का घर जो सबसे
        अधिक पर्यटकों को आकर्षित करता है।
      dos: '- किले में घूमने के साथ-साथ भगवती मंदिर के दर्शन भी करें

        - दीवारों का पूरा चक्कर लगाने के लिए लगभग एक घंटे का समय रखें

        - नरम रोशनी और ठंडी हवा के लिए दिन में जल्दी या देर से जाएं'
      donts: '- समुद्र की ओर वाली दीवारों और बुर्जों के ऊपर से न झुकें

        - किले पर प्लास्टिक या कचरा न छोड़ें'
      safety_text: '- तीन ओर से दीवारें सीधे समुद्र में गिरती हैं; बच्चों को पास रखें

        - रास्ते ऊबड़-खाबड़ हैं; अच्छी ग्रिप वाले जूते पहनें'
  photo:
    file_url: https://upload.wikimedia.org/wikipedia/commons/3/3f/Ratnadurg_Entrance.jpg
    credit: Pradeep717
