        झाडीतून वाट काढत किनाऱ्यावर आल्यावर अरबी समुद्राचा विस्तृत विस्तार दिसतो.
        या समुद्रकिनारी कासव संरक्षण प्रकल्प राबवला जातो.'
      history: null
      significance: सुरूबन आणि कासव संरक्षण प्रकल्पासाठी ओळखले जाणारे रत्‍नागिरी तालुक्यातील
        एक किनारपट्टीचे ठिकाण.
      dos: '- स्वच्छता राखण्यासाठी कचरा योग्य ठिकाणी टाकावा

        - परिसराची व झाडीची काळजीपूर्वक सफर करावी'
      donts: '- कासवांच्या अधिवाशाला किंवा घरट्यांना त्रास देऊ नये

        - किनारपट्टीवर मोठा आवाज करणे टाळावे'
      safety_text: किनाऱ्यावर फिरताना भरती-ओहोटीच्या वेळेची नोंद ठेवावी.
    hi:
      short_story: 'गावखडी बीच (जिसे गावखाडी बीच भी कहा जाता है) रत्नागिरी तालुका
        में पावस के पास स्थित है। इस समुद्र तट के पास एक सुरूर वन (पाइन वन) और हरी-भरी
        पहाड़ियाँ हैं।


        पेड़ों के बीच से गुजरते हुए अरब सागर का विस्तार दिखाई देता है। इस समुद्र तट
        पर कछुआ संरक्षण परियोजना भी संचालित की जाती है।'
      history: null
      significance: रत्नागिरी तालुका में पाइन वन और कछुआ संरक्षण पहल वाला एक तटीय
        स्थल।
      dos: '- स्वच्छता बनाए रखने के लिए कचरा सही जगह पर डालें

        - आसपास के पेड़ों और प्रकृति का जिम्मेदारी से आनंद लें'
      donts: '- कछुओं के घोंसले या संरक्षण क्षेत्रों को परेशान न करें

        - तेज आवाज करने या वन्यजीवों को डिस्टर्ब करने से बचें'
      safety_text: तट पर टहलते समय ज्वार-भाटे के समय का ध्यान रखें।
