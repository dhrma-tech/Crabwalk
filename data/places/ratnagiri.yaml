  text:
    en:
      short_story: 'The Marine Aquarium and Museum is situated at Sadanand Wadi near
        Mandavi Beach in Ratnagiri town. Maintained by the Marine Biological Research
        Station, it houses preserved marine specimens, fish varieties, and educational
        exhibits related to local aquatic life.


        Visitors can observe various tanks containing regional fish species and display
        units featuring marine artifacts. The facility serves as an educational center
        for students and tourists exploring the coastal ecosystem of the Konkan region.'
      history: The facility was established in 1985 by the Marine Biological Research
        Station of Ratnagiri under the Department of Fisheries.
      significance: Educational research facility displaying regional marine specimens
        and aquatic life of the Konkan coast.
      dos: '- Check opening hours and ticket availability prior to visiting.

        - Maintain silence inside the indoor exhibition halls.

        - Follow instructions given by facility staff regarding displays.'
      donts: '- Do not touch the preserved specimens or glass tanks.

        - Do not use flash photography where prohibited.'
      safety_text: Exercise normal caution while walking around wet floors near exhibition
        tanks.
    mr:
      short_story: 'मरीन एक्वेरियम आणि म्युझियम हे रत्‍नागिरी शहरातील मांडवी बीचजवळ
        सदानंद वाडी येथे स्थित आहे. मत्स्यव्यवसाय विभागांतर्गत कार्यरत असलेल्या मरीन
        बायोलॉजिकल रिसर्च स्टेशनतर्फे चालवल्या जाणाऱ्या या केंद्रात जतन केलेले सागरी
        नमुने, विविध मासे आणि स्थानिक जलचरांशी संबंधित शैक्षणिक वस्तू प्रदर्शनासाठी
        ठेवल्या आहेत.


        येथे विविध माशांचे टँक आणि सागरी वस्तूंची प्रदर्शने पाहायला मिळतात. कोकण किनारपट्टीच्या
        जलचरांचा अभ्यास करण्यासाठी येणाऱ्या विद्यार्थी आणि पर्यटकांसाठी हे एक महत्त्वाचे
        शैक्षणिक केंद्र आहे.'
      history: या केंद्राची स्थापना 1985 मध्ये रत्‍नागिरीच्या मरीन बायोलॉजिकल रिसर्च
        स्टेशनतर्फे मत्स्यव्यवसाय विभागांतर्गत करण्यात आली.
      significance: कोकण किनारपट्टीच्या प्रादेशिक सागरी नमुन्यांचे आणि जलचरांचे प्रदर्शन
        करणारे शैक्षणिक संशोधन केंद्र.
      dos: '- भेट देण्यापूर्वी वेळा आणि तिकिटांची माहिती तपासा.

        - अंतर्गत प्रदर्शन कक्षात शांतता पाळा.

        - कर्मचाऱ्यांच्या सूचनांचे पालन करा.'
      donts: '- जतन केलेले नमुने किंवा काचेचे टँक यांना हात लावू नका.

        - जिथे प्रतिबंध आहे तिथे फ्लॅश फोटोग्राफी करू नका.'
      safety_text: प्रदर्शनातील टँकजवळ ओल्या जमिनीवर चालताना काळजी घ्या.
    hi:
      short_story: 'मरीन एक्वेरियम और म्यूजियम रत्नागिरी शहर में मांडवी बीच के पास
        सदानंद वाड़ी में स्थित है। मरीन बायोलॉजिकल रिसर्च स्टेशन द्वारा संचालित इस
        केंद्र में स्थानीय जलीय जीवन से संबंधित संरक्षित समुद्री नमूने, मछलियाँ और
        शैक्षिक प्रदर्शन रखे गए हैं।


        यहाँ क्षेत्रीय प्रजातियों की मछलियों वाले टैंक और समुद्री अवशेष देखने को मिलते
        हैं। यह स्थान कोंकण तट के जलीय पारिस्थितिकी तंत्र का अध्ययन करने वाले छात्रों
        और पर्यटकों के लिए एक शैक्षिक केंद्र है।'
      history: इस केंद्र की स्थापना 1985 में मत्स्य विभाग के अंतर्गत रत्नागिरी के
        मरीन बायोलॉजिकल रिसर्च स्टेशन द्वारा की गई थी।
      significance: कोंकण तट के क्षेत्रीय समुद्री नमूनों और जलीय जीवों को प्रदर्शित
        करने वाला शैक्षणिक अनुसंधान केंद्र।
      dos: '- यात्रा करने से पहले समय और टिकट की जानकारी अवश्य जाँच लें।

        - इनडोर प्रदर्शन हॉल के भीतर शांति बनाए रखें।

        - कर्मचारियों के निर्देशों का पालन करें।'
      donts: '- संरक्षित नमूनों या काँच के टैंकों को हाथ न लगाएँ।

        - प्रतिबंधित क्षेत्रों में फ्लैश फोटोग्राफी न करें।'
      safety_text: प्रदर्शनी टैंकों के पास गीले फर्श पर चलते समय सामान्य सावधानी बरतें।
