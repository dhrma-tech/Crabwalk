  text:
    en:
      short_story: 'Aare Ware is a pair of beaches about 22 km from Ratnagiri, on
        the coast road to Ganpatipule, split by a small bay. The road runs right along
        the sea, with wide views on the way.


        The sand is clean and turtles are sometimes seen. An over-the-sea zipline
        opened here in February 2024 and runs from 9:30 am to 6:30 pm.'
      history: null
      significance: Twin quiet beaches on the Ratnagiri-Ganpatipule coast road.
      dos: '- Visit between October and March

        - Stop for sunset on the drive'
      donts: '- Don''t swim'
      safety_text: Currents here look calm but are strong and unpredictable. Stay
        out of the water.
    mr:
      short_story: 'आरे वारे हा रत्नागिरीपासून सुमारे 22 किमी अंतरावर, गणपतीपुळे कडील
        किनारपट्टीच्या रस्त्यावर, एका छोट्या उपसागराने विभागलेला दोन समुद्रकिनाऱ्यांचा
        जोड आहे. रस्ता अगदी समुद्राच्या बाजूने जातो, ज्यावरून वाटेत विस्तीर्ण दृश्ये
        दिसतात.


        वाळू स्वच्छ आहे आणि कधीकधी कासव दिसतात. येथे फेब्रुवारी 2024 मध्ये समुद्रावरील
        झिपलाईन सुरू झाली जी सकाळी 9:30 ते संध्याकाळी 6:30 पर्यंत चालते.'
      history: null
      significance: रत्नागिरी-गणपतीपुळे किनारपट्टीच्या रस्त्यावरील जुळ्या शांत समुद्रकिनाऱ्या.
      dos: '- ऑक्टोबर ते मार्च दरम्यान भेट द्या

        - ड्राईव्ह करताना सूर्यास्तासाठी थांबा'
      donts: '- पोहू नका'
      safety_text: येथील प्रवाह शांत दिसतात पण ते मजबूत आणि अनिश्चित असतात. पाण्यात
        जाऊ नका.
    hi:
      short_story: 'आरे वारे रत्नागिरी से लगभग 22 किमी दूर, गणपतिपुले जाने वाले तटीय
        मार्ग पर, एक छोटी खाड़ी द्वारा विभाजित दो समुद्र तटों (बीचेस) की एक जोड़ी
        है। सड़क सीधे समुद्र के साथ-साथ चलती है, रास्ते में जिसके चौड़े नज़ारे मिलते
        हैं।


        रेत साफ है और कभी-कभी कछुए भी दिखाई देते हैं। यहाँ फरवरी 2024 में समुद्र के
        ऊपर एक ज़िपलाइन शुरू हुई थी जो सुबह 9:30 से शाम 6:30 बजे तक चलती है।'
      history: null
      significance: रत्नागिरी-गणपतिपुले तटीय सड़क पर जुड़वां शांत समुद्र तट।
      dos: '- अक्टूबर से मार्च के बीच जाएँ

        - ड्राइव के दौरान सूर्यास्त देखने के लिए रुकें'
      donts: '- न तैरें'
      safety_text: यहाँ की धाराएँ शांत दिखती हैं लेकिन मजबूत और अप्रत्याशित होती हैं।
        पानी से दूर रहें।
