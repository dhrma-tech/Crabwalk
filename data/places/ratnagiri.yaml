  category: temple
  taluka: Ratnagiri
  lat: 17.145038
  lng: 73.266319
  coord_source: osm way/394726920
  osm_id: way/394726920
  entry_fee_text: No entry fee
  entry_fee_inr: 0
  visit_minutes: 60
  opens: 05:30
  closes: '20:00'
  closed_days: []
  best_time: September to February
  how_to_reach: About 26 km from Ratnagiri; MSRTC buses and cabs from Ratnagiri.
  nearest_station: Ratnagiri (30 km)
  nearest_bus_stop: Ganpatipule bus stand
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Ganpatipule
  is_hidden_gem: false
  text:
    en:
      short_story: 'Ganpatipule is a small coastal town about 26 km from Ratnagiri,
        built around a Ganpati temple right on the beach. The idol here is swayambhu,
        believed to have risen from the soil, and it faces west toward the sea.


        The temple is the reason most people come to Ganpatipule. Pair the darshan
        with the beach, Malgund village next door and the coastal road north to Jaigad.'
      history: Local tradition holds that the swayambhu idol is about 400 years old.
      significance: A major Ganpati pilgrimage centre on the Konkan coast; busiest
        during Gauri-Ganpati and Maghi Ganesh Jayanti.
      dos: '- Dress modestly for the temple

        - Plan for crowds on festival days and long weekends

        - Visit Malgund, about 1 km away, on the same trip'
      donts: '- Don''t carry footwear into the temple premises

        - Don''t use flash photography inside the sanctum unless allowed'
      safety_text: null
    mr:
      short_story: 'गणपतीपुळे हे रत्नागिरीपासून सुमारे 26 किमी अंतरावर असलेले एक छोटे
        किनारपट्टीवरील गाव आहे, जे थेट समुद्रकिनाऱ्यावर असलेल्या गणपती मंदिराभोवती
        वसलेले आहे. इथली मूर्ती स्वयंभू आहे, जी जमिनीतून प्रकट झाली असे मानले जाते,
        आणि तिचे तोंड पश्चिमेकडे समुद्राच्या दिशेने आहे.


        गणपतीपुळ्याला येण्यामागचे मुख्य कारण म्हणजे हे मंदिर. दर्शनासोबतच तुम्ही समुद्रकिनारा,
        शेजारील मालगुंड गाव आणि उत्तरेकडे जयगडला जाणारा सागरी मार्ग याचाही आनंद घेऊ
        शकता.'
      history: स्थानिक आख्यायिकेनुसार ही स्वयंभू मूर्ती सुमारे 400 वर्षे जुनी आहे.
      significance: कोकण किनारपट्टीवरील हे गणपतीचे एक प्रमुख तीर्थक्षेत्र आहे; गौरी-गणपती
        आणि माघी गणेश जयंतीच्या वेळी इथे सर्वात जास्त गर्दी असते.
      dos: '- मंदिरात जाताना सभ्य पोशाख घाला

        - सणांच्या दिवशी आणि सलग सुट्ट्यांमध्ये गर्दी असू शकते, त्याप्रमाणे नियोजन
        करा

        - याच प्रवासात सुमारे 1 किमी अंतरावर असलेल्या मालगुंडला भेट द्या'
      donts: '- मंदिर परिसरात चपला किंवा बूट घालून जाऊ नका

        - परवानगी नसल्यास गाभाऱ्यात फ्लॅश फोटोग्राफी करू नका'
      safety_text: null
    hi:
      short_story: 'गणपतिपुले रत्नागिरी से लगभग 26 किमी दूर एक छोटा तटीय शहर है, जो
        सीधे समुद्र तट पर स्थित गणपति मंदिर के चारों ओर बसा है। यहाँ की मूर्ति स्वयंभू
        है, जिसके बारे में माना जाता है कि यह मिट्टी से प्रकट हुई है, और इसका मुख
        पश्चिम में समुद्र की ओर है。


        ज्यादातर लोग इसी मंदिर के दर्शन के लिए गणपतिपुले आते हैं। दर्शन के साथ आप
        समुद्र तट, पास के मालगुंड गाँव और उत्तर में जयगढ़ जाने वाली तटीय सड़क का भी
        आनंद ले सकते हैं।'
      history: स्थानीय परंपरा के अनुसार, स्वयंभू मूर्ति लगभग 400 साल पुरानी है।
      significance: कोंकण तट पर यह एक प्रमुख गणपति तीर्थस्थल है; गौरी-गणपति और माघी
        गणेश जयंती के दौरान यहाँ सबसे ज्यादा भीड़ होती है।
      dos: '- मंदिर के लिए शालीन कपड़े पहनें

        - त्योहार के दिनों और लंबी छुट्टियों में भीड़ के लिए तैयार रहें

        - इसी यात्रा में लगभग 1 किमी दूर मालगुंड भी जाएँ'
      donts: '- मंदिर परिसर में जूते-चप्पल पहनकर न जाएँ

        - अनुमति के बिना गर्भगृह के अंदर फ्लैश फोटोग्राफी न करें'
      safety_text: null
