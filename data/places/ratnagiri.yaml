  seasons: []
  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Thibaw Palace in Ratnagiri was built by the British to hold Thibaw
        Min, the last king of Burma (now Myanmar), under house arrest. The three-storey
        building has sloping pagoda-style roofs and semi-circular carved wooden windows,
        and a dance hall with a marble floor on the first floor.


        Today it is a museum that keeps some of the king''s belongings. A Buddha idol
        he brought from Burma stands behind the palace.'
      history: The British exiled King Thibaw to Ratnagiri after 1885. The palace
        was built in 1910, and the king and queen lived here until 1916.
      significance: A rare link between Ratnagiri and the last royal family of Burma.
      dos: '- Combine with Thiba Point next door for the sunset'
      donts: '- Don''t touch the displayed objects'
      safety_text: null
    mr:
      short_story: 'म्यानमारच्या (ब्रह्मदेश) थिबा या शेवटच्या राजाला नजरकैदेत ठेवण्यासाठी
        ब्रिटिशांनी रत्नागिरीत थिबा राजवाडा बांधला. तीन मजली असलेल्या या वास्तूला
        पॅगोडा शैलीतील उतरती छपरे आणि अर्धवर्तुळाकार कोरीव लाकडी खिडक्या आहेत. पहिल्या
        मजल्यावर संगमरवरी फरशी असलेला एक डान्स हॉल आहे.


        आज हे एक संग्रहालय असून त्यात राजाच्या काही वस्तू जतन करून ठेवल्या आहेत. राजाने
        ब्रह्मदेशातून आणलेली एक बुद्धाची मूर्ती राजवाड्याच्या मागील बाजूस आहे.'
      history: 1885 नंतर ब्रिटिशांनी थिबा राजाला रत्नागिरीत हद्दपार केले. 1910 मध्ये
        हा राजवाडा बांधला गेला आणि 1916 पर्यंत राजा आणि राणी येथेच वास्तव्यास होते.
      significance: रत्नागिरी आणि ब्रह्मदेशच्या शेवटच्या राजघराण्यातील एक दुर्मिळ
        दुवा.
      dos: '- सूर्यास्त पाहण्यासाठी शेजारच्या थिबा पॉईंटलाही भेट द्या'
      donts: '- प्रदर्शनातील वस्तूंना स्पर्श करू नका'
      safety_text: null
    hi:
      short_story: 'रत्नागिरि में थिबा पैलेस का निर्माण अंग्रेजों द्वारा बर्मा (अब
        म्यांमार) के अंतिम राजा थिबा मिन को नज़रबंद रखने के लिए किया गया था। तीन मंजिला
        इस इमारत में पैगोडा शैली की ढलान वाली छतें और अर्ध-गोलाकार नक्काशीदार लकड़ी
        की खिड़कियां हैं, तथा पहली मंजिल पर संगमरमर के फर्श वाला एक डांस हॉल है।


        आज यह एक संग्रहालय है जिसमें राजा का कुछ सामान रखा गया है। बर्मा से उनके द्वारा
        लाई गई एक बुद्ध प्रतिमा पैलेस के पीछे स्थित है।'
      history: 1885 के बाद अंग्रेजों ने राजा थिबा को रत्नागिरि निर्वासित कर दिया था।
        यह पैलेस 1910 में बनाया गया था, और राजा तथा रानी 1916 तक यहां रहे।
      significance: रत्नागिरि और बर्मा के अंतिम शाही परिवार के बीच एक दुर्लभ कड़ी।
      dos: '- सूर्यास्त देखने के लिए बगल में स्थित थिबा पॉइंट के साथ इसे घूमने की
        योजना बनाएं'
      donts: '- प्रदर्शित वस्तुओं को न छुएं'
      safety_text: null
