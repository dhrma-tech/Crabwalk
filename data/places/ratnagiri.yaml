  wikipedia_url: https://en.wikipedia.org/wiki/Purnagad
  is_hidden_gem: false
  text:
    en:
      short_story: 'Purnagad is a small sea fort on a hill beside the Muchkundi river,
        about 25 km from Ratnagiri. Built of black basalt in a rectangle, it is compact
        but has a lot to see.


        A Maruti idol guards the entrance gate, which is carved with the sun, moon
        and Ganapati. Steps lead to a flag point with wide views of the sea and Purnagad
        beach.'
      history: Some sources credit Shivaji with building it, others Kanhoji Angre.
        It was one of Angre's bases, used to defend against and raid the British and
        to trade with other Europeans. It earned less revenue in the Peshwa period.
      significance: A small but historically important base of Kanhoji Angre's navy.
      dos: '- Climb to the flag point for the view of Purnagad beach

        - Look for the carvings on the entrance gate'
      donts: '- Don''t disturb the ruins inside the fort'
      safety_text: '- Steps and ruins are uneven; watch your footing'
    mr:
      short_story: 'पूर्णगड हा रत्नागिरीपासून सुमारे 25 किमी अंतरावर मुचकुंडी नदीच्या
        काठावरील एका टेकडीवर वसलेला छोटा सागरी किल्ला आहे. काळ्या बेसॉल्ट दगडात आयताकृती
        आकाराचा बांधलेला हा किल्ला छोटा असला तरी इथे पाहण्यासारखे बरेच काही आहे.


        प्रवेशद्वारावर एक मारुतीची मूर्ती असून दरवाजावर सूर्य, चंद्र आणि गणपती कोरलेले
        आहेत. इथून काही पायऱ्या एका ध्वजस्तंभाकडे जातात, जिथून समुद्र आणि पूर्णगड
        बीचचा विस्तृत देखावा पाहायला मिळतो.'
      history: काही नोंदींनुसार हा किल्ला शिवाजी महाराजांनी बांधला होता, तर काहींच्या
        मते तो कान्होजी आंग्रे यांनी बांधला. हे आंग्रेंच्या तळांपैकी एक होते, ज्याचा
        वापर ब्रिटिशांवर हल्ले करण्यासाठी, त्यांच्यापासून संरक्षण करण्यासाठी आणि इतर
        युरोपियनांशी व्यापार करण्यासाठी केला जात असे. पेशवे काळात येथून महसूल कमी
        मिळत असे.
      significance: कान्होजी आंग्रे यांच्या आरमाराचा एक छोटा पण ऐतिहासिक दृष्ट्या
        महत्त्वाचा तळ.
      dos: '- पूर्णगड बीचचे दृश्य पाहण्यासाठी ध्वजस्तंभापर्यंत जा

        - प्रवेशद्वारावरील कोरीव काम आवर्जून पाहा'
      donts: '- किल्ल्यातील अवशेषांचे नुकसान करू नका'
      safety_text: '- पायऱ्या आणि अवशेष ओबडधोबड आहेत; चालताना लक्ष ठेवा'
    hi:
      short_story: 'पूर्णगढ़ रत्नागिरी से लगभग 25 किमी दूर मुचकुंडी नदी के किनारे
        एक पहाड़ी पर स्थित एक छोटा समुद्री किला है। काले बेसाल्ट पत्थर से आयताकार
        आकार में बना यह किला भले ही छोटा है, लेकिन यहाँ देखने के लिए बहुत कुछ है。


        प्रवेश द्वार पर एक मारुति की मूर्ति है, और दरवाज़े पर सूर्य, चंद्रमा और गणपति
        उकेरे गए हैं। यहाँ से कुछ सीढ़ियाँ एक ध्वज स्तंभ तक जाती हैं, जहाँ से समुद्र
        और पूर्णगढ़ बीच का विस्तृत नज़ारा दिखाई देता है।'
      history: कुछ स्रोतों के अनुसार इस किले का निर्माण शिवाजी ने करवाया था, जबकि
        कुछ इसे कान्होजी आंग्रे द्वारा बनवाया गया मानते हैं। यह आंग्रे के ठिकानों
        में से एक था, जिसका उपयोग अंग्रेजों से बचाव और उन पर हमला करने, और अन्य यूरोपीय
        लोगों के साथ व्यापार करने के लिए किया जाता था। पेशवा काल में यहाँ से राजस्व
        कम मिलता था।
      significance: कान्होजी आंग्रे की नौसेना का एक छोटा लेकिन ऐतिहासिक रूप से महत्वपूर्ण
        ठिकाना।
      dos: '- पूर्णगढ़ बीच का नज़ारा देखने के लिए ध्वज स्तंभ तक जाएँ

        - प्रवेश द्वार पर नक्काशी ज़रूर देखें'
      donts: '- किले के अंदर खंडहरों को नुकसान न पहुँचाएँ'
      safety_text: '- सीढ़ियाँ और खंडहर ऊबड़-खाबड़ हैं; चलते समय सावधानी बरतें'
