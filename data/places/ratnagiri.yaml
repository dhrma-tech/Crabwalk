  text:
    en:
      short_story: 'Jaigad fort stands on a cliff at the tip of a peninsula, where
        the Shastri river meets the Arabian Sea, about 14 km from Ganpatipule. The
        13-acre fort still has most of its outer wall and ramparts, with a deep moat
        on the land side.


        Inside you will find the remains of Kanhoji Angre''s palace, a Ganpati temple
        and old wells. The views take in the bay, the open sea and the nearby port.'
      history: The fort is believed to have been built by the Bijapur kings in the
        16th century. The Naiks of Sangameshwar held it and beat back combined Bijapur
        and Portuguese forces in 1583 and 1585. In 1713 Balaji Vishwanath Peshwa ceded
        it to Kanhoji Angre, who strengthened it. The British took it without a fight
        in June 1818.
      significance: One of the best-preserved coastal forts near Ganpatipule, linked
        to the Maratha navy of Kanhoji Angre.
      dos: '- Combine with Ganpatipule and the coastal road

        - Walk the ramparts for views of the Shastri river mouth'
      donts: '- Don''t climb on loose sections of the wall'
      safety_text: '- The fort sits on a cliff; stay back from unfenced edges

        - Take care near the moat'
    mr:
      short_story: 'जयगड किल्ला एका द्वीपकल्पाच्या टोकावर, कड्यावर वसलेला आहे, जिथे
        शास्त्री नदी अरबी समुद्राला मिळते. हे ठिकाण गणपतीपुळ्यापासून सुमारे 14 किमी
        अंतरावर आहे. या 13 एकरात पसरलेल्या किल्ल्याची बाहेरील तटबंदी आणि बुरुज आजही
        सुस्थितीत असून, जमिनीच्या बाजूला एक खोल खंदक आहे.


        किल्ल्याच्या आत तुम्हाला कान्होजी आंग्रे यांच्या वाड्याचे अवशेष, एक गणपती
        मंदिर आणि जुन्या विहिरी पाहायला मिळतील. इथून खाडी, अथांग समुद्र आणि जवळच्या
        बंदराचे सुंदर दृश्य दिसते.'
      history: असे मानले जाते की हा किल्ला 16 व्या शतकात विजापूरच्या राजांनी बांधला
        होता. संगमेश्वरच्या नाईकांनी हा किल्ला जिंकून 1583 आणि 1585 मध्ये विजापूर
        आणि पोर्तुगीजांच्या संयुक्त फौजांना परतवून लावले होते. 1713 मध्ये बाळाजी विश्वनाथ
        पेशव्यांनी तो कान्होजी आंग्रे यांच्याकडे सोपवला, ज्यांनी या किल्ल्याची तटबंदी
        अधिक मजबूत केली. ब्रिटिशांनी जून 1818 मध्ये लढाई न करताच हा किल्ला ताब्यात
        घेतला.
      significance: कान्होजी आंग्रेंच्या मराठा आरमाराशी संबंधित असलेला, गणपतीपुळ्याजवळील
        एक अतिशय चांगल्या स्थितीत जतन केलेला सागरी किल्ला.
      dos: '- गणपतीपुळे आणि सागरी मार्गासोबत यालाही भेट द्या

        - शास्त्री नदीच्या मुखाचे दृश्य पाहण्यासाठी तटबंदीवरून चाला'
      donts: '- तटबंदीच्या कमकुवत किंवा ढासळलेल्या भागावर चढू नका'
      safety_text: '- हा किल्ला एका कड्यावर आहे; कुंपण नसलेल्या कडांपासून लांब राहा

        - खंदकाजवळ काळजी घ्या'
    hi:
      short_story: 'जयगढ़ किला एक प्रायद्वीप के सिरे पर एक चट्टान पर स्थित है, जहाँ
        शास्त्री नदी अरब सागर से मिलती है। यह जगह गणपतिपुले से लगभग 14 किमी दूर है।
        13 एकड़ में फैले इस किले की बाहरी दीवार और बुर्ज अभी भी मौजूद हैं, और ज़मीन
        की तरफ एक गहरी खाई है。


        किले के अंदर आपको कान्होजी आंग्रे के महल के अवशेष, एक गणपति मंदिर और पुराने
        कुएं देखने को मिलेंगे। यहाँ से खाड़ी, खुले समुद्र और पास के बंदरगाह का सुंदर
        नज़ारा दिखता है।'
      history: माना जाता है कि इस किले का निर्माण 16वीं शताब्दी में बीजापुर के राजाओं
        ने करवाया था। संगमेश्वर के नाइकों ने इस पर कब्ज़ा किया और 1583 और 1585 में
        बीजापुर और पुर्तगालियों की संयुक्त सेना को पीछे धकेल दिया। 1713 में बालाजी
        विश्वनाथ पेशवा ने इसे कान्होजी आंग्रे को सौंप दिया, जिन्होंने इसे और मज़बूत
        किया। अंग्रेजों ने जून 1818 में बिना किसी लड़ाई के इसे अपने अधिकार में ले
        लिया।
      significance: गणपतिपुले के पास सबसे अच्छी तरह से संरक्षित तटीय किलों में से
        एक, जो कान्होजी आंग्रे की मराठा नौसेना से जुड़ा है।
      dos: '- गणपतिपुले और तटीय सड़क के साथ यहाँ भी जाएँ

        - शास्त्री नदी के मुहाने का नज़ारा देखने के लिए प्राचीर पर चलें'
      donts: '- दीवार के कमज़ोर या टूटे हुए हिस्सों पर न चढ़ें'
      safety_text: '- किला एक चट्टान पर स्थित है; बिना बाड़ वाले किनारों से दूर रहें

        - खाई के पास सावधानी बरतें'
