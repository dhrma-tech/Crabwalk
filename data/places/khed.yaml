- slug: mahipatgad-fort
  status: ai_draft
  name_en: Mahipatgad Fort
  name_mr: महिपतगड
  name_hi: महिपतगढ़ किला
  category: fort
  taluka: Khed
  lat: 17.844135
  lng: 73.50214
