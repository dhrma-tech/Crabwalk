  text:
    en:
      short_story: 'Nageshwar Temple is a natural cave situated beneath a rock pinnacle
        near Choravane village in Khed taluka. The cave can accommodate around 25
        to 30 people and houses a Shiva Linga.


        Water naturally drips onto the Linga from the cave ceiling throughout the
        year. Outside the cave, there is a rock-cut cistern covered with a protective
        mesh that retains water year-round.'
      history: null
      significance: A natural cave shrine housing a Shiva Linga, functioning as a
        regular resting point for hikers in the Sahyadri mountains.
      dos: '- Carry sufficient water and food for the hike.

        - Hire a local guide from Choravane village.'
      donts: '- Do not litter in the cave or the water cistern.'
      safety_text: The hike from Choravane is steep and physically demanding, requiring
        good fitness.
    mr:
      short_story: 'नागेश्वर मंदिर ही खेड तालुक्यातील चोरवणे गावाजवळील एका मोठ्या
        सुळक्याच्या खाली असलेली एक नैसर्गिक गुहा आहे. या गुहेत साधारण 25-30 लोक बसू
        शकतात आणि आत एक शिवलिंग आहे.


        येथे गुहेच्या छतावरून वर्षभर शिवलिंगावर नैसर्गिकरित्या पाण्याचे थेंब पडत असतात.
        गुहेबाहेर एक पाण्याची टाकी (कुंड) आहे, ज्यावर जाळी बसवली असून त्यात वर्षभर
        पाणी असते.'
      history: null
      significance: सह्याद्रीच्या पर्वतरांगांमध्ये असलेले हे एक नैसर्गिक शिवमंदिर
        असून, ट्रेकर्ससाठी हे एक महत्त्वाचे विश्रांतीचे ठिकाण आहे.
      dos: '- ट्रेकिंग करताना सोबत पुरेसे पाणी आणि अन्न ठेवा.

        - चोरवणे गावातून स्थानिक वाटाड्या सोबत घ्या.'
      donts: '- गुहेत किंवा पाण्याच्या कुंडाजवळ कचरा टाकू नका.'
      safety_text: चोरवणे गावातून येणारा मार्ग खूप खडा आणि दमछाक करणारा आहे, त्यामुळे
        शारीरिक तंदुरुस्ती आवश्यक आहे.
    hi:
      short_story: 'नागेश्वर मंदिर खेड़ तालुका के चोरवणे गांव के पास एक पर्वत की चोटी
        के नीचे स्थित एक प्राकृतिक गुफा है। गुफा के अंदर एक शिवलिंग है और यहाँ 25-30
        लोग आसानी से आ सकते हैं।


        गुफा की छत से साल भर शिवलिंग पर पानी की बूंदें गिरती रहती हैं। बाहर एक पानी
        का कुंड है जिसे जाली से ढका गया है, और इसमें भी साल भर पानी रहता है।'
      history: null
      significance: यह सह्याद्री की पहाड़ियों में स्थित एक प्राकृतिक शिव मंदिर है,
        जो ट्रेकर्स के लिए एक नियमित विश्राम स्थल है।
      dos: '- ट्रेकिंग के लिए अपने साथ पर्याप्त पानी और भोजन ले जाएं.

        - चोरवणे गांव से एक स्थानीय गाइड को साथ रखें.'
      donts: '- गुफा या पानी के कुंड में कचरा न डालें.'
      safety_text: चोरवणे से यहाँ तक का ट्रेक बहुत खड़ी चढ़ाई वाला और शारीरिक रूप
        से थका देने वाला है।
