      donts: '- गडाच्या परिसरात प्लास्टिक किंवा कचरा टाकू नका.'
      safety_text: ट्रेकिंगच्या वाटा खडबडीत आणि अस्पष्ट आहेत; चांगल्या पकडीचे बूट
        घाला आणि अंधार पडल्यानंतर ट्रेकिंग करणे टाळा.
    hi:
      short_story: 'रामगढ़ एक पहाड़ी किला है जो पश्चिमी घाट में खेड़ शहर से लगभग 25
        किलोमीटर उत्तर-पश्चिम में स्थित है। यह पास के पालगढ़ किले के समान पहाड़ी क्षेत्र
        में स्थित है। हाल ही में खेड़ तालुका में ट्रेकर्स द्वारा इस स्थान को फिर से
        खोजा गया है।


        किले के क्षेत्र में आने वाले लोगों को सह्याद्री पर्वतमाला का प्राकृतिक ऊबड़-खाबड़
        इलाका और पुरानी रक्षात्मक संरचनाओं के अवशेष देखने को मिलते हैं। यह क्षेत्र
        के ऐतिहासिक नेटवर्क की एक झलक प्रस्तुत करता है।'
      history: इस किले का उपयोग छत्रपति शिवाजी महाराज के युग में क्षेत्रीय रक्षा नेटवर्क
        के हिस्से के रूप में किया जाता था।
      significance: पालगढ़ के पास सह्याद्री पर्वतमाला में स्थित एक हाल ही में खोजा
        गया पहाड़ी किला।
      dos: '- अपने साथ पर्याप्त पानी और भोजन ले जाएं, क्योंकि पहाड़ी पर कोई दुकानें
        या सुविधाएं नहीं हैं।

        - रास्तों की पहचान न होने पर ट्रेकिंग के लिए आस-पास के गांवों से एक स्थानीय
        गाइड लें।'
      donts: '- किले के परिसर में प्लास्टिक या खाने के रैपर न छोड़ें।'
      safety_text: ट्रेकिंग के रास्ते ऊबड़-खाबड़ और बिना निशान वाले हैं; अच्छी ग्रिप
