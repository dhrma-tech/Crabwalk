  text:
    en:
      short_story: 'The Kalkai Devi temple is in Bharane, about 4 km from Khed, a
        five-minute walk from Bharne Naka on the Mumbai-Goa highway. Cars can drive
        up to the temple parking.


        The goddess is believed to remove misfortune and to protect the women of Bharane
        who have married and moved away. Shops selling puja items line the path, and
        the temple trust runs a pilgrim lodge behind the temple.'
      history: Legend says a Shinde family cow poured its milk daily on a stone here,
        and during an epidemic the goddess rose from the stone and drove away 'kaal',
        death. The temple was renovated in 2002 and a golden kalash was placed on
        the spire in May 2010.
      significance: One of the most visited temples in Khed taluka.
      dos: '- Visit during Navratri or Shimga for the palanquin processions

        - Use the pilgrim lodge if staying overnight'
      donts: '- Don''t park on the highway at Bharne Naka'
      safety_text: null
    mr:
      short_story: 'काळकाई देवीचे मंदिर भरणे येथे आहे, जे खेडपासून सुमारे 4 किमी अंतरावर,
        मुंबई-गोवा महामार्गावरील भरणे नाक्यापासून पाच मिनिटांच्या चालण्याच्या अंतरावर
        आहे. कार थेट मंदिराच्या पार्किंगपर्यंत जाऊ शकतात.


        अशी श्रद्धा आहे की देवी संकट दूर करते आणि भरणे येथील ज्या महिलांचे लग्न होऊन
        त्या बाहेरगावी गेल्या आहेत, त्यांचे रक्षण करते. मंदिराच्या वाटेवर पूजेच्या
        साहित्याची दुकाने आहेत आणि मंदिर ट्रस्टतर्फे मंदिराच्या मागे भाविकांसाठी विश्रामगृह
        चालवले जाते.'
      history: आख्यायिकेनुसार, शिंदे कुटुंबातील एक गाय येथे रोज एका शिळेवर दूध टाकायची
        आणि एका साथीच्या रोगाच्या काळात देवी त्या शिळेतून प्रकट झाली आणि तिने 'काळ'
        (मृत्यू) ला पळवून लावले. मंदिराचा 2002 मध्ये जीर्णोद्धार करण्यात आला आणि मे
        2010 मध्ये शिखरावर सोन्याचा कळस बसवण्यात आला.
      significance: खेड तालुक्यातील सर्वात जास्त भेट दिल्या जाणाऱ्या मंदिरांपैकी एक.
      dos: '- पालखी सोहळ्यांसाठी नवरात्र किंवा शिमग्यादरम्यान भेट द्या

        - रात्री मुक्काम करायचा असल्यास भाविकांच्या विश्रामगृहाचा वापर करा'
      donts: '- भरणे नाक्यावर महामार्गावर गाडी उभी करू नका'
      safety_text: null
    hi:
      short_story: 'कालकाई देवी का मंदिर भरणे में है, जो खेड से लगभग 4 किमी दूर, मुंबई-गोवा
        राजमार्ग पर भरणे नाका से पाँच मिनट की पैदल दूरी पर है। कारें मंदिर के पार्किंग
        तक जा सकती हैं।


        ऐसी मान्यता है कि देवी विपत्ति दूर करती हैं और भरणे की उन महिलाओं की रक्षा
        करती हैं जिनका विवाह होकर वे दूर चली गई हैं। मंदिर के रास्ते पर पूजा सामग्री
        की दुकानें हैं और मंदिर ट्रस्ट द्वारा मंदिर के पीछे तीर्थयात्री विश्रामगृह
        चलाया जाता है।'
      history: किंवदंती है कि शिंदे परिवार की एक गाय यहाँ रोज एक पत्थर पर अपना दूध
        गिराती थी और एक महामारी के दौरान देवी उस पत्थर से प्रकट हुईं और उन्होंने 'काल'
        (मृत्यु) को भगा दिया। मंदिर का जीर्णोद्धार 2002 में किया गया था और मई 2010
        में शिखर पर सोने का कलश स्थापित किया गया था।
      significance: खेड तालुका के सबसे अधिक देखे जाने वाले मंदिरों में से एक।
      dos: '- पालखी जुलूस के लिए नवरात्रि या शिग्मा के दौरान जाएँ

        - यदि रात में रुकना हो तो तीर्थयात्री विश्रामगृह का उपयोग करें'
      donts: '- भरणे नाका पर राजमार्ग पर पार्किंग न करें'
      safety_text: null
