        समूह आहे. मुख्य लेणी हा एक मोठा विहार असून त्यात भिक्षूंसाठी तीन खोल्या आणि
        मागे एक स्तूप आहे, तसेच इतर चार लहान लेण्या आहेत.


        या लेण्या सध्या थोड्या पडक्या अवस्थेत आहेत, पण जर तुम्ही खेडमधून जात असाल
