  text:
    en:
      short_story: 'Sumargad is a small, little-visited fort about 19 km east of Khed,
        at 883 m. The fortification covers only one or two acres, with steep cliffs
        on all sides, many rock-cut cisterns and a cave with a shivling.


        There are two routes, from Mahipatgad or from Rasalgad, both through remote
        forest with no villages nearby.'
      history: Very little of its history is known.
      significance: null
      dos: '- Go with someone who knows the ridge route'
      donts: null
      safety_text: '- Cliffs drop on all sides

        - The forest is remote; carry water and start early'
    mr:
      short_story: 'सुमारगड हा खेडच्या पूर्वेस सुमारे 19 किमी अंतरावर आणि 883 मीटर
        उंचीवर असलेला एक लहान आणि कमी गर्दीचा किल्ला आहे. तटबंदी केवळ एक ते दोन एकरांवर
        पसरलेली आहे, ज्याला चारही बाजूंनी तीव्र उतार असलेले कडे आहेत. इथे कातळात कोरलेली
        पाण्याची अनेक टाकी आणि शिवलिंग असलेली एक गुहा आहे.


        येथे जाण्यासाठी महिपतगड किंवा रसाळगडावरून असे दोन मार्ग आहेत. हे दोन्ही मार्ग
        निर्मनुष्य जंगलातून जातात आणि आसपास कोणतेही गाव नाही.'
      history: या किल्ल्याच्या इतिहासाबद्दल फारच थोडी माहिती उपलब्ध आहे.
      significance: null
      dos: '- पदभ्रमण मार्गाची (ट्रेकची) माहिती असलेल्या व्यक्तीसोबतच जा'
      donts: null
      safety_text: '- चारही बाजूंना तीव्र उतार असलेले कडे आहेत

        - जंगल निर्मनुष्य आहे; सोबत पाणी ठेवा आणि लवकर ट्रेक सुरू करा'
    hi:
      short_story: 'सुमारगढ़ खेड़ के पूर्व में लगभग 19 किमी दूर और 883 मीटर की ऊंचाई
        पर स्थित एक छोटा और कम देखा जाने वाला किला है। किलेबंदी केवल एक या दो एकड़
        में फैली है, जिसके चारों ओर खड़ी चट्टानें, कई पानी के कुंड और शिवलिंग वाली
        एक गुफा है。


        यहां जाने के दो रास्ते हैं, महिपतगढ़ या रसालगढ़ से, दोनों ही सुदूर जंगल से
        होकर गुज़रते हैं और आस-पास कोई गांव नहीं है।'
      history: इसके इतिहास के बारे में बहुत कम जानकारी है।
      significance: null
      dos: '- उस व्यक्ति के साथ जाएं जिसे इस ट्रेक मार्ग की जानकारी हो'
      donts: null
      safety_text: '- चारों तरफ खड़ी चट्टानें हैं

        - जंगल सुदूर और निर्जन है; साथ में पानी रखें और जल्दी शुरुआत करें'
