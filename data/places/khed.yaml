  text:
    en:
      short_story: 'Chakdev is a peak and village in Khed taluka. The location features
        a steep trekking route with a permanent iron ladder, commonly referred to
        as the Chakdeo Shidi, which connects to the nearby village of Valvan.


        At the top, the village contains a temple dedicated to Kedar, the local deity.
        The surrounding area consists of dense forests and rocky terrain.'
      history: Villagers from Chakdev, Shindi, and Valvan previously maintained the
        steep approach using bamboo and wooden bars before a permanent iron structure
        was installed.
      significance: Known for its steep iron ladder approach and the local Kedar Temple.
      dos: '- Wear high-grip hiking shoes to navigate the metal stairs.'
      donts: '- Do not attempt the climb during heavy rain.'
      safety_text: The iron ladder is vertical and steep, requiring careful climbing.
    mr:
      short_story: 'चकदेव हे खेड तालुक्यातील एक शिखर आणि गाव आहे. येथे जाण्यासाठी
        अतिशय उभी लोखंडी शिडी आहे, जिला ''चकदेव शिडी'' म्हणतात. या मार्गाने वळवण गावातही
        जाता येते.


        या गावात ग्रामदैवत केदारेश्वराचे मंदिर आहे. आजूबाजूला घनदाट जंगल आणि खडकाळ
        प्रदेश आहे.'
      history: पूर्वी इथले गावकरी बांबू आणि लाकडाच्या साहाय्याने ही शिडी तयार करून
        वापरत असत, आता तिथे कायमस्वरूपी लोखंडी शिडी बसवण्यात आली आहे.
      significance: हे ठिकाण त्याच्या उभ्या लोखंडी शिडीसाठी आणि स्थानिक केदार मंदिरासाठी
        ओळखले जाते.
      dos: '- लोखंडी शिडीवर चढण्यासाठी चांगल्या ग्रिपचे शूज वापरा.'
      donts: '- पावसाळ्यात शिडीवरून जाणे टाळा.'
      safety_text: येथील शिडी पूर्णपणे उभी असल्यामुळे चढताना आणि उतरताना विशेष काळजी
        घेणे आवश्यक आहे.
    hi:
      short_story: 'चकदेव खेड़ तालुका में स्थित एक चोटी और गाँव है। यहाँ तक पहुँचने
        के लिए एक खड़ी लोहे की सीढ़ी है, जिसे ''चकदेव शिड़ी'' कहा जाता है, जो पास
        के वलवण गाँव को भी जोड़ती है।


        गाँव के शीर्ष पर स्थानीय देवता केदार का मंदिर स्थित है। इसके चारों ओर घने
        जंगल और चट्टानी इलाका है।'
      history: पहले ग्रामीण यहाँ पहुँचने के लिए बाँस और लकड़ी से सीढ़ी बनाते थे, लेकिन
        बाद में यहाँ एक स्थायी लोहे की सीढ़ी लगा दी गई।
      significance: यह स्थान अपने खड़ी लोहे की सीढ़ी वाले रास्ते और केदार मंदिर के
        लिए जाना जाता है।
      dos: '- धातु की सीढ़ियों पर चढ़ने के लिए अच्छी ग्रिप वाले ट्रेकिंग जूते पहनें।'
