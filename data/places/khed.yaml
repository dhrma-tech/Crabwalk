  how_to_reach: Accessible by road from Khed via hill paths and connecting tracks
    near Khopi.
  nearest_station: Satara Railway Station, 51 km
  nearest_bus_stop: Birmini Bus Stop
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
