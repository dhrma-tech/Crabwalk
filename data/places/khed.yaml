  text:
    en:
      short_story: 'Ramgad is a hill fort located in the Western Ghats, approximately
        25 kilometers northwest of Khed town. It is situated in the same mountainous
        region as the nearby Palgad fort. The site has recently been recognized by
        trekkers exploring the Khed taluka.


        Visitors to the fort area find the natural rugged terrain of the Sahyadri
        range and remnants of old defensive structures. It offers a glimpse into the
        region''s historical networks.'
      history: The fort was utilized during the era of Chhatrapati Shivaji Maharaj
        as part of the regional defense network.
      significance: A recently re-explored hill fort in the Sahyadri range, located
        near Palgad.
      dos: '- Carry sufficient water and food, as there are no shops or facilities
        on the hill.

        - Hire a local guide from nearby villages to navigate the unmarked trekking
        trails.'
      donts: '- Do not leave plastic or food wrappers on the fort premises.'
      safety_text: The trekking paths are uneven and not well-marked; wear shoes with
        good grip and avoid trekking after dark.
    mr:
      short_story: 'रामगड हा पश्चिम घाटात, खेड शहराच्या वायव्येस अंदाजे 25 किलोमीटर
        अंतरावर असलेला एक गिरीदुर्ग आहे. हा किल्ला जवळच असलेल्या पालगड किल्ल्याच्या
        डोंगराळ भागात वसलेला आहे. खेड तालुक्यातील ट्रेकर्सनी अलीकडेच या स्थळाची नव्याने
        ओळख करून दिली आहे.


        येथे भेट देणाऱ्यांना सह्याद्रीच्या रांगांमधील नैसर्गिक खडकाळ भूप्रदेश आणि
        जुन्या संरक्षणात्मक बांधकामांचे अवशेष पाहायला मिळतात. यातून परिसराच्या ऐतिहासिक
        संरचनेची झलक पाहायला मिळते.'
      history: छत्रपती शिवाजी महाराजांच्या काळात या किल्ल्याचा वापर प्रादेशिक संरक्षण
        व्यवस्थेचा एक भाग म्हणून केला जात असे.
      significance: पालगडजवळ सह्याद्रीच्या रांगांमध्ये असलेला आणि अलीकडेच नव्याने
        प्रकाशात आलेला एक गिरीदुर्ग.
      dos: '- गडावर दुकाने किंवा इतर सोयी नसल्याने स्वतःसोबत पुरेसे पाणी आणि खाद्यपदार्थ
        ठेवा.

        - गडावर जाणाऱ्या वाटा नक्की माहीत नसल्यास जवळच्या गावातील स्थानिक वाटाड्या
