  how_to_reach: Reachable via Choravane village through a trek route originating from
    Chiplun or Khed taluka.
  nearest_station: Chiplun Railway Station, 22.66 km
  nearest_bus_stop: Choravane Bus Stop
  monsoon_status: risky
