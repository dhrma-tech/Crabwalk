  is_hidden_gem: false
  text:
    en:
      short_story: 'Rasalgad is a hill fort about 15 km east of Khed, at around 500
        m. It sits on a small triangular plateau of about five acres, with two gates
        still in good shape.


        Inside are two rock-cut cisterns, a storeroom, a Veer Maruti idol and the
        Zolai devi temple with a deepmal. The fort is the start of the ridge trek
        to Sumargad and Mahipatgad.'
      history: The More clan of Javli held it before Shivaji took it. The British
        took it from the Peshwas in 1818. It has been a protected monument of the
        Maharashtra archaeology department since 2003. Two more cannons were recovered
        in 2022.
      significance: A well-kept small hill fort and the start of the Rasalgad-Sumargad-Mahipatgad
        ridge trek.
      dos: '- Start from Rasalwadi, about 10 minutes by road from the foothills

        - Go on a weekday to avoid weekend crowds'
      donts: '- Don''t leave litter at the temple or cisterns'
      safety_text: '- Carry water and start early on hot days'
    mr:
      short_story: 'रसाळगड हा खेडच्या पूर्वेस सुमारे 15 किमी अंतरावर आणि 500 मीटर
        उंचीवर असलेला एक डोंगरी किल्ला आहे. हा किल्ला सुमारे पाच एकरांच्या एका लहान
        त्रिकोणी पठारावर वसलेला असून, त्याचे दोन दरवाजे अजूनही सुस्थितीत आहेत.


        किल्ल्याच्या आत दोन कातळात कोरलेली पाण्याची टाकी, एक कोठार, वीर मारुतीची मूर्ती
        आणि दीपमाळ असलेले झोलाई देवीचे मंदिर आहे. सुमारगड आणि महिपतगडकडे जाणाऱ्या
        पदभ्रमण (ट्रेक) मार्गाची सुरुवात याच किल्ल्यापासून होते.'
      history: शिवाजी महाराजांनी हा किल्ला जिंकण्यापूर्वी तो जावळीच्या मोऱ्यांच्या
        ताब्यात होता. 1818 मध्ये ब्रिटिशांनी तो पेशव्यांकडून घेतला. 2003 पासून हे
        महाराष्ट्र पुरातत्त्व विभागाचे संरक्षित स्मारक आहे. 2022 मध्ये येथे आणखी दोन
        तोफा सापडल्या.
      significance: उत्तम स्थितीत असलेला एक लहान डोंगरी किल्ला आणि रसाळगड-सुमारगड-महिपतगड
        पदभ्रमण (ट्रेक) मार्गाची सुरुवात.
      dos: '- पायथ्यापासून रस्त्याने सुमारे 10 मिनिटांच्या अंतरावर असलेल्या रसाळवाडीतून
        सुरुवात करा

        - वीकेंडची गर्दी टाळण्यासाठी आठवड्याच्या इतर दिवशी (सोमवार ते शुक्रवार) जा'
      donts: '- मंदिर किंवा पाण्याच्या टाक्यांजवळ कचरा करू नका'
      safety_text: '- सोबत पाणी ठेवा आणि उन्हाळ्याच्या दिवसांत लवकर ट्रेक सुरू करा'
    hi:
      short_story: 'रसालगढ़ खेड़ के पूर्व में लगभग 15 किमी दूर और 500 मीटर की ऊंचाई
        पर स्थित एक पहाड़ी किला है। यह लगभग पांच एकड़ के एक छोटे त्रिकोणीय पठार पर
        स्थित है, जिसके दो द्वार अभी भी अच्छी स्थिति में हैं。


        किले के अंदर चट्टानों को काटकर बनाए गए दो पानी के कुंड, एक स्टोररूम, एक वीर
        मारुति की मूर्ति और दीपमाल के साथ झोलाई देवी का मंदिर है। यह किला सुमारगढ़
        और महिपतगढ़ तक जाने वाले ट्रेक की शुरुआत है।'
      history: शिवाजी के इसे जीतने से पहले यह जावली के मोरे वंश के पास था। 1818 में
        अंग्रेजों ने इसे पेशवाओं से छीन लिया। 2003 से यह महाराष्ट्र पुरातत्व विभाग
        का एक संरक्षित स्मारक है। 2022 में यहां से दो और तोपें बरामद की गईं।
      significance: एक अच्छी तरह से रखा गया छोटा पहाड़ी किला और रसालगढ़-सुमारगढ़-महिपतगढ़
        ट्रेक की शुरुआत।
      dos: '- तलहटी से सड़क मार्ग द्वारा लगभग 10 मिनट की दूरी पर स्थित रसालवाड़ी से
        शुरुआत करें

        - वीकेंड की भीड़ से बचने के लिए सप्ताह के अन्य दिनों (सोमवार से शुक्रवार)
        में जाएं'
      donts: '- मंदिर या पानी के कुंडों के पास कचरा न छोड़ें'
      safety_text: '- साथ में पानी रखें और गर्म दिनों में जल्दी शुरुआत करें'
