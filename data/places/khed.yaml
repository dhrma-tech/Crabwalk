  entry_fee_inr: null
  visit_minutes: 180
  opens: null
  closes: null
  closed_days: []
  best_time: December to January
  how_to_reach: Trek from Wadi Beldar, reached by a jeepable dirt road from Wadi Jaitapur.
  nearest_station: null
  nearest_bus_stop: Wadi Beldar
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Mahipatgad
  is_hidden_gem: false
  text:
    en:
      short_story: 'Mahipatgad is one of the largest forts in Maharashtra, a 120-acre
        tableland at about 3,490 ft, 23.6 km east of Khed. It has six gateways and
        six battlements, with the remains of Maruti and Ganapati temples, old horse
        stables and two large wells.


        A road reaches Wadi Beldar village; from there it is a steep climb of about
        an hour and a half. The Pareshwar temple is the only shelter on top.'
      history: The fort is credited to Adilshah of Bijapur in the 15th century. Shivaji
        captured it in 1661; it later went to the Peshwas and then to the British
        in 1818.
      significance: A huge forested plateau fort, the northern end of the Rasalgad-Sumargad-Mahipatgad
        ridge.
      dos: '- Go between December and January, the best season

        - Start the climb early from Wadi Beldar'
      donts: '- Don''t drink well water without treating it'
      safety_text: '- Leopards, wild pigs and hyenas live in the forest; stay in groups

        - Watch for snakes on the trail'
    mr:
      short_story: 'खेडच्या पूर्वेस 23.6 किमी अंतरावर आणि 3,490 फूट उंचीवर 120 एकरांच्या
        पठारावर पसरलेला महिपतगड हा महाराष्ट्रातील सर्वांत मोठ्या किल्ल्यांपैकी एक
        आहे. याला सहा दरवाजे आणि सहा तटबंदी आहेत, तसेच येथे मारुती आणि गणपती मंदिरांचे
        अवशेष, जुन्या घोड्यांच्या पागा आणि दोन मोठ्या विहिरी आहेत.


        वाडी बेलदार गावापर्यंत रस्ता जातो; तेथून सुमारे दीड तासाची खडी चढण आहे. किल्ल्यावर
        आसरा घेण्यासाठी पारेश्वर मंदिर हे एकमेव ठिकाण आहे.'
      history: 15 व्या शतकातील विजापूरच्या आदिलशहाने हा किल्ला बांधला असे मानले जाते.
        1661 मध्ये शिवाजी महाराजांनी तो जिंकला; नंतर तो पेशव्यांकडे आणि 1818 मध्ये
        ब्रिटिशांकडे गेला.
      significance: घनदाट जंगलाने वेढलेला एक विस्तीर्ण पठारी किल्ला आणि रसाळगड-सुमारगड-महिपतगड
        पदभ्रमण मार्गाचे उत्तरेकडील टोक.
      dos: '- डिसेंबर आणि जानेवारी दरम्यान जा, हा येथील सर्वोत्तम हंगाम आहे

        - वाडी बेलदार येथून लवकर चढायला सुरुवात करा'
      donts: '- विहिरीचे पाणी शुद्ध केल्याशिवाय पिऊ नका'
      safety_text: '- जंगलात बिबट्या, रानडुक्कर आणि तरस राहतात; समूहाने एकत्र राहा

        - वाटेत सापांपासून सावध राहा'
    hi:
      short_story: 'महिपतगढ़ महाराष्ट्र के सबसे बड़े किलों में से एक है, जो खेड़ के
        पूर्व में 23.6 किमी दूर लगभग 3,490 फीट की ऊंचाई पर 120 एकड़ के पठार पर फैला
        है। इसमें छह द्वार और छह प्राचीर हैं, साथ ही मारुति और गणपति मंदिरों के अवशेष,
        पुराने घोड़ों के अस्तबल और दो बड़े कुएं हैं。


        वाड़ी बेलदार गांव तक एक सड़क जाती है; वहां से लगभग डेढ़ घंटे की खड़ी चढ़ाई
        है। शीर्ष पर आश्रय के लिए पारेश्वर मंदिर एकमात्र जगह है।'
      history: 15वीं शताब्दी में इस किले का निर्माण बीजापुर के आदिलशाह ने करवाया था।
        1661 में शिवाजी ने इस पर कब्ज़ा कर लिया; बाद में यह पेशवाओं के पास और फिर
        1818 में अंग्रेजों के पास चला गया।
      significance: घने जंगल वाला एक विशाल पठारी किला, जो रसालगढ़-सुमारगढ़-महिपतगढ़
        रिज (पहाड़ी धार) का उत्तरी छोर है।
      dos: '- दिसंबर और जनवरी के बीच जाएं, यह सबसे अच्छा मौसम है

        - वाड़ी बेलदार से जल्दी चढ़ाई शुरू करें'
      donts: '- बिना साफ़ किए कुएं का पानी न पिएं'
      safety_text: '- जंगल में तेंदुए, जंगली सूअर और लकड़बग्घे रहते हैं; समूहों में
        एक साथ रहें

        - रास्ते में सांपों से सावधान रहें'
