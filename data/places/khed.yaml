  text:
    en:
      short_story: 'Mahimandangad is a hill fort located in the Sahyadri mountains,
        approximately 33 kilometers northeast of Khed, standing at an elevation of
        3070 feet. The primary trekking trail begins near Araw village and passes
        through a dense karvi forest.


        At the pass between two hilltops, visitors can observe rock-cut water tanks,
        rock-carved steps, and the remains of fortification walls and a bastion where
        the main gate once stood.'
      history: Rock-cut tanks indicate the fort existed before the Maratha era. Due
        to its size and location, it functioned primarily as a watch post during later
        periods.
      significance: An ancient watch post in the Sahyadris featuring rock-cut tanks
        and forest trails.
      dos: '- Use a private vehicle or take the evening government bus from Khed to
        reach Araw village.

        - Pay attention to the animal census cameras installed by the forest department
        along the jungle path.'
      donts: '- Do not damage or tamper with the forest department''s census cameras.'
      safety_text: The ghat road to the base is unpaved and uneven; it is traversed
        using a four-wheel-drive or jeep-like vehicle.
    mr:
      short_story: 'महिमंडणगड हा सह्याद्रीच्या पर्वतरांगांमध्ये खेडच्या ईशान्येस सुमारे
        33 किलोमीटर अंतरावर आणि 3070 फूट उंचीवर असलेला एक गिरीदुर्ग आहे. या किल्ल्याचा
        ट्रेक आरव गावाजवळून सुरू होतो आणि कारवीच्या दाट जंगलातून जातो.


        दोन टेकड्यांच्या मधील खिंडीत पर्यटकांना कातळात खोदलेली पाण्याची टाकी, खडकात
        कोरलेल्या पायऱ्या आणि जिथे एकेकाळी मुख्य दरवाजा होता त्या तटबंदीचे आणि बुरुजाचे
        अवशेष पाहायला मिळतात.'
      history: कातळात कोरलेली पाण्याची टाकी दर्शवतात की हा किल्ला शिवकाळापूर्वी अस्तित्वात
        होता. त्याचा आकार आणि मोक्याचे ठिकाण पाहता, नंतरच्या काळात त्याचा वापर प्रामुख्याने
        टेहळणीसाठी केला जात असे.
      significance: कातळात खोदलेली टाकी आणि जंगलातील वाटा असलेला सह्याद्रीतील एक प्राचीन
        टेहळणीचा किल्ला.
      dos: '- आरव गावी पोहोचण्यासाठी खाजगी वाहन किंवा खेडहून संध्याकाळी सुटणारी एसटी
        बस वापरा.

        - जंगलातील वाटेवर वनविभागाने बसवलेल्या प्राण्यांच्या गणनेच्या कॅमेऱ्यांकडे
        लक्ष असू द्या.'
      donts: '- वनविभागाच्या कॅमेऱ्यांचे कोणतेही नुकसान करू नका किंवा त्यांच्याशी
        छेडछाड करू नका.'
      safety_text: पायथ्यापर्यंत जाणारा घाटाचा रस्ता कच्चा आणि खडबडीत आहे; तिथे जाण्यासाठी
        जीपसारखे वाहन वापरणे योग्य ठरते.
    hi:
      short_story: 'महिमंडनगढ़ एक पहाड़ी किला है जो सह्याद्री पर्वतों में खेड़ से
        लगभग 33 किलोमीटर उत्तर-पूर्व में 3070 फीट की ऊंचाई पर स्थित है। मुख्य ट्रेकिंग
        रास्ता आरव गांव के पास से शुरू होता है और घने कारवी जंगल से होकर गुजरता है।


        दो पहाड़ियों के बीच के दर्रे पर, आगंतुक चट्टानों को काटकर बनाए गए पानी के
        टैंक, चट्टानों में उकेरी गई सीढ़ियां, और किलेबंदी की दीवारों व एक बुर्ज के
        अवशेष देख सकते हैं जहां कभी मुख्य द्वार हुआ करता था।'
      history: चट्टानों में कटे पानी के टैंक बताते हैं कि यह किला मराठा युग से पहले
        मौजूद था। अपने आकार और स्थान के कारण, बाद के समय में इसने मुख्य रूप से एक
        निगरानी चौकी के रूप में काम किया।
      significance: सह्याद्री में एक प्राचीन निगरानी चौकी जिसमें चट्टान काटकर बनाए
        गए टैंक और जंगली रास्ते हैं।
      dos: '- आरव गांव पहुंचने के लिए निजी वाहन का उपयोग करें या खेड़ से शाम की सरकारी
        बस लें।

        - जंगल के रास्ते में वन विभाग द्वारा लगाए गए पशु गणना कैमरों का ध्यान रखें।'
      donts: '- वन विभाग के कैमरों को नुकसान न पहुंचाएं या उनके साथ छेड़छाड़ न करें।'
      safety_text: आधार तक जाने वाली घाट सड़क कच्ची और ऊबड़-खाबड़ है; जीप जैसे वाहन
        का उपयोग करके वहां जाना सबसे अच्छा है।
