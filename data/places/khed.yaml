  text:
    en:
      short_story: 'Raghuveer Ghat is a mountain pass located at an elevation of 1400
        meters in the Sahyadri ranges, about 40 kilometers from Khed city. Built between
        1990 and 2002, it connects Khed to villages like Shindi and Valvan near the
        Koyna backwaters.


        During the monsoon, the pass experiences dense fog and features several seasonal
        waterfalls. Visitors come to see the steep forested valleys and the unique,
        small red-brown crabs native to the area.'
      history: Construction of the ghat road began in 1990 and was completed in 2002
        to connect Khed to remote Konkan villages.
      significance: A high-altitude mountain pass known for its dense monsoon fog
        and steep valley views.
      dos: '- Carry rain gear and warm clothing if visiting during the monsoon.

        - Bring your own food and water, as there is only one hotel at the top.'
      donts: '- Do not harm or pick up the small red-brown crabs found on the road.

        - Do not drive without hazard lights when fog reduces visibility.'
      safety_text: The roads become extremely slippery and dense fog severely reduces
        visibility during heavy rainfall.
    mr:
      short_story: 'रघुवीर घाट हा खेड शहरापासून 40 किलोमीटर अंतरावर सह्याद्रीच्या
        रांगेत 1400 मीटर उंचीवर असलेला एक घाट आहे. 1990 ते 2002 या काळात बांधलेला
        हा घाट खेडला कोयना बॅकवॉटरजवळील शिंदी आणि वळवण सारख्या गावांना जोडतो.


        पावसाळ्यात या घाटात दाट धुके आणि अनेक हंगामी धबधबे पाहायला मिळतात. इथल्या
        तीव्र उताराच्या दऱ्या आणि खास लाल-तपकिरी रंगाचे खेकडे पाहण्यासाठी पर्यटक इथे
        येतात.'
      history: या घाटाच्या रस्त्याचे बांधकाम 1990 मध्ये सुरू झाले आणि खेडला दुर्गम
        कोकणी गावांशी जोडण्यासाठी 2002 मध्ये पूर्ण झाले.
      significance: दाट पावसाळी धुके आणि दऱ्यांच्या दृश्यांसाठी ओळखला जाणारा एक उंच
        घाट.
      dos: '- पावसाळ्यात भेट देत असल्यास रेनकोट आणि उबदार कपडे सोबत ठेवा.

        - घाटाच्या माथ्यावर फक्त एकच हॉटेल असल्याने स्वतःचे अन्न आणि पाणी सोबत ठेवा.'
      donts: '- रस्त्यावर आढळणाऱ्या लहान लाल-तपकिरी खेकड्यांना पकडू नका किंवा त्यांना
        त्रास देऊ नका.

        - धुक्यामुळे समोरचे दिसणे कठीण होते तेव्हा इंडिकेटर चालू केल्याशिवाय गाडी
        चालवू नका.'
      safety_text: पावसाळ्यात रस्ते खूप निसरडे होतात आणि दाट धुक्यामुळे समोरचे पाहणे
        अत्यंत कठीण होते.
    hi:
      short_story: 'रघुवीर घाट सह्याद्री पर्वतमाला में 1400 मीटर की ऊंचाई पर स्थित
        एक पहाड़ी दर्रा है, जो खेड शहर से लगभग 40 किलोमीटर दूर है। 1990 और 2002 के
        बीच बना यह दर्रा खेड को कोयना बैकवाटर के पास शिंदी और वलवण जैसे गांवों से
        जोड़ता है।


        मानसून के दौरान इस दर्रे में घना कोहरा छा जाता है और कई मौसमी झरने दिखाई देते
        हैं। यहाँ आने वाले लोग गहरी जंगली घाटियों और क्षेत्र के अनूठे छोटे लाल-भूरे
        रंग के केकड़ों को देख सकते हैं।'
      history: इस घाट की सड़क का निर्माण 1990 में शुरू हुआ था और खेड को सुदूर कोंकण
        गांवों से जोड़ने के लिए 2002 में पूरा हुआ था।
      significance: घने मानसूनी कोहरे और गहरी घाटियों के दृश्यों के लिए जाना जाने
        वाला एक ऊँचा पहाड़ी दर्रा।
      dos: '- मानसून के दौरान यात्रा करते समय रेन गियर और गर्म कपड़े साथ रखें।

        - अपना खाना और पानी खुद लाएं, क्योंकि घाट के ऊपर केवल एक ही होटल है।'
      donts: '- सड़क पर पाए जाने वाले छोटे लाल-भूरे केकड़ों को न पकड़ें और न ही उन्हें
        कोई नुकसान पहुँचाएँ।

        - कोहरे के कारण दृश्यता कम होने पर हैज़र्ड लाइट के बिना गाड़ी न चलाएँ।'
      safety_text: भारी बारिश के दौरान सड़कें बेहद फिसलन भरी हो जाती हैं और घने कोहरे
        के कारण दृश्यता काफी कम हो जाती है।
