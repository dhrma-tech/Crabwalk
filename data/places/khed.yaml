  text:
    en:
      short_story: 'The Jagbudi is a river flowing through Khed taluka. Originating
        near Khopi in the Western Ghats, it travels through several settlements, including
        Shiv, Ashti, and Karji, before merging into the Vashishti River near Bahirwali.


        The river serves as a water source for local agriculture and supports wetland
        habitats. Its waters are known to be inhabited by mugger crocodiles.'
      history: null
      significance: A major tributary to the Vashishti River and a natural habitat
        for the mugger crocodile in the Konkan region.
      dos: '- Maintain a safe distance from the riverbanks.'
      donts: '- Do not enter the water for swimming or domestic chores.'
      safety_text: The river contains mugger crocodiles, which sometimes enter flooded
        human settlements during the monsoon, making the banks dangerous.
    mr:
      short_story: 'जगबुडी ही खेड तालुक्यातून वाहणारी एक नदी आहे. तिचा उगम पश्चिम
        घाटातील खोपी गावाजवळ होतो आणि ती शिव, करजी अशा गावांमधून वाहत जाऊन वाशिष्ठी
        नदीला मिळते.


        ही नदी स्थानिक शेतीसाठी पाण्याचा स्रोत असून तिच्या पात्रात मगरींचा (Mugger
        crocodile) अधिवास आहे.'
      history: null
      significance: ही वाशिष्ठी नदीची एक प्रमुख उपनदी असून ती मगरींचा नैसर्गिक अधिवास
        म्हणून ओळखली जाते.
      dos: '- नदीच्या काठावर जाताना नेहमी सुरक्षित अंतर ठेवा.'
      donts: '- नदीच्या पाण्यात पोहण्यासाठी किंवा कपडे धुण्यासाठी उतरू नका.'
      safety_text: नदीत मगरी आहेत आणि पावसाळ्यात पुराचे पाणी आल्यावर त्या वस्तीतही
        शिरू शकतात, त्यामुळे काठावर जाणे धोकादायक ठरू शकते.
    hi:
      short_story: 'जगबुडी खेड़ तालुका से होकर बहने वाली एक नदी है। इसका उद्गम पश्चिमी
        घाट में खोपी के पास होता है, और यह शिव, करजी जैसे गांवों से होते हुए बहिरवली
        के पास वाशिष्ठी नदी में मिल जाती है।


        यह नदी स्थानीय कृषि के लिए जल स्रोत का काम करती है और इसके पानी में मगरमच्छ
        (Mugger crocodile) पाए जाते हैं।'
      history: null
      significance: यह वाशिष्ठी नदी की एक प्रमुख सहायक नदी है और मगरमच्छों का एक प्राकृतिक
        आवास है।
      dos: '- नदी के किनारों से सुरक्षित दूरी बनाए रखें।'
      donts: '- पानी में तैरने या कपड़े धोने के लिए प्रवेश न करें।'
      safety_text: नदी में मगरमच्छ होते हैं जो मानसून के दौरान बाढ़ आने पर बस्तियों
        में भी आ सकते हैं, जिससे किनारे पर जाना खतरनाक हो सकता है।
