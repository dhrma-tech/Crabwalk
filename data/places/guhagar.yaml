- slug: vyadeshwar-temple
  status: ai_draft
  name_en: Vyadeshwar Temple
  name_mr: व्याडेश्वर मंदिर
  name_hi: व्याडेश्वर मंदिर
  category: temple
  taluka: Guhagar
  lat: 17.483611
  lng: 73.190217
  coord_source: osm node/2389646767
  osm_id: node/2389646767
  entry_fee_text: No fee
  entry_fee_inr: 0
  visit_minutes: null
  opens: 06:30
  closes: '20:00'
  closed_days: []
  best_time: Mahashivratri
  how_to_reach: In Guhagar town, close to Guhagar beach.
  nearest_station: Chiplun
  nearest_bus_stop: Guhagar bus stand
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Shree_Dev_Vyadeshwar
  is_hidden_gem: false
  text:
    en:
      short_story: 'Shree Vyadeshwar is a Shiva temple in Guhagar town, close to the
        beach. It is the family deity of many Chitpavan families of the Konkan.


        The temple follows the Panchayatan plan: Shiva''s shrine in the centre, with
        shrines to Surya, Ganesha, Ambika and Vishnu-Lakshmi at the four corners,
        and Nandi in front.'
      history: Legend says sage Vyadi installed the lingam here after Parashurama
        created the Konkan coast. The deity was later rediscovered and the present
        structure built in the time of King Sakuran. Several subsidiary shrines and
        the old east gate were replaced from May 2015.
      significance: Kuladevata of many Chitpavan families; Guhagar's main temple.
      dos: '- Visit with Guhagar beach, a short walk away'
      donts: '- Don''t carry footwear into the temple'
      safety_text: null
    mr:
      short_story: 'श्री व्याडेश्वर हे गुहागर शहरातील समुद्रकिनाऱ्याजवळ असलेले एक
        शिवमंदिर आहे. हे कोकणातील अनेक चित्पावन कुटुंबांचे कुलदैवत आहे.


        हे मंदिर पंचायतन शैलीचे आहे: मध्यभागी शंकराची पिंड असून, चार कोपऱ्यांत सूर्य,
        गणेश, अंबिका आणि विष्णू-लक्ष्मी यांची मंदिरे आहेत आणि समोर नंदी आहे.'
      history: आख्यायिकेनुसार, परशुरामाने कोकण किनारपट्टी निर्माण केल्यावर व्याडी
        ऋषींनी येथे शिवलिंगाची स्थापना केली. पुढे या दैवताचा पुन्हा शोध लागला आणि
        सद्यस्थितीतील मंदिर साकुरान राजाच्या काळात बांधले गेले. मे 2015 पासून अनेक
        छोटी मंदिरे आणि जुना पूर्व दरवाजा नव्याने बांधण्यात आला.
      significance: अनेक चित्पावन कुटुंबांचे कुलदैवत; गुहागरचे मुख्य मंदिर.
      dos: '- जवळच असलेल्या गुहागर समुद्रकिनाऱ्यालाही भेट द्या'
      donts: '- मंदिरात पादत्राणे घालून जाऊ नका'
      safety_text: null
    hi:
      short_story: 'श्री व्याडेश्वर गुहागर शहर में समुद्र तट के करीब स्थित एक शिव
        मंदिर है। यह कोंकण के कई चित्पावन परिवारों के कुलदेवता हैं।


        यह मंदिर पंचायतन शैली में बना है: बीच में शिव का मुख्य मंदिर है, और चारों
        कोनों पर सूर्य, गणेश, अंबिका और विष्णु-लक्ष्मी के मंदिर हैं, और सामने नंदी
        विराजमान हैं।'
      history: किंवदंती है कि परशुराम द्वारा कोंकण तट के निर्माण के बाद ऋषि व्याडी
        ने यहां शिवलिंग स्थापित किया था। बाद में इस देवता की फिर से खोज हुई और वर्तमान
        संरचना राजा साकुरान के समय में बनाई गई थी। मई 2015 से कई छोटे मंदिरों और पुराने
        पूर्वी द्वार का पुनर्निर्माण किया गया।
      significance: कई चित्पावन परिवारों के कुलदेवता; गुहागर का मुख्य मंदिर।
      dos: '- कुछ ही दूरी पर स्थित गुहागर समुद्र तट भी जाएं'
      donts: '- मंदिर के अंदर जूते-चप्पल न ले जाएं'
      safety_text: null
  photo:
