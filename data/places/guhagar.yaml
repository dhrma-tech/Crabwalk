  text:
    en:
      short_story: 'Talkeshwar (Tolkeshwar Point) lighthouse stands on a hill on the
        south bank of the Vashishti river mouth, near Dabhol port. It is reached from
        Chiplun through Anjanvel village, about 60 km by road.


        The present tower was built in 1956-58 and its light was switched on in February
        1960.'
      history: A light was first set up here in 1880 on a cast iron column. A small
        masonry tower followed in 1933-34, then the present tower in 1956-58. The
        light source has been upgraded several times since, most recently in 2003.
      significance: A working lighthouse with a recorded history going back to 1880,
        guarding the Dabhol river mouth.
      dos: '- Check visiting hours at the gate before planning'
      donts: '- Don''t photograph equipment if staff ask you not to'
      safety_text: null
    mr:
      short_story: 'टाळकेश्वर (तोळकेश्वर पॉईंट) दीपगृह दाभोळ बंदराच्या जवळ, वाशिष्ठी
        नदीच्या मुखाच्या दक्षिण काठावरील एका टेकडीवर उभे आहे. चिपळूणहून अंजनवेल गावामार्गे
        रस्त्याने येथे पोहोचता येते, जे सुमारे 60 किमी अंतरावर आहे.


        सध्याचा हा टावर 1956-58 मध्ये बांधला गेला आणि फेब्रुवारी 1960 मध्ये त्याचा
        दिवा (लाईट) सुरू करण्यात आला.'
      history: येथे सर्वप्रथम 1880 मध्ये एका कास्ट आयर्नच्या खांबावर दिवा बसवण्यात
        आला होता. त्यानंतर 1933-34 मध्ये एक लहान दगडी व सिमेंटचा टावर उभारला गेला
        आणि नंतर 1956-58 मध्ये सद्यस्थितीतील टावर बनवण्यात आला. तेव्हापासून दिव्याचा
        स्त्रोत अनेक वेळा आधुनिक करण्यात आला असून, सर्वात शेवटी 2003 मध्ये त्याचे
        आधुनिकीकरण झाले.
      significance: दाभोळ नदीच्या मुखाचे रक्षण करणारे आणि 1880 पर्यंतचा लिखित इतिहास
        असलेले एक कार्यरत दीपगृह.
      dos: '- नियोजन करण्यापूर्वी प्रवेशद्वारावरील भेटीच्या वेळा तपासा'
      donts: '- कर्मचाऱ्यांनी फोटो काढण्यास मनाई केल्यास उपकरणांचे फोटो काढू नका'
      safety_text: null
    hi:
      short_story: 'ताळकेश्वर (टोळकेश्वर पॉइंट) दीपगृह दाभोल बंदर के पास, वाशिष्ठी
        नदी के मुहाने के दक्षिणी तट पर एक पहाड़ी पर खड़ा है। यह सड़क मार्ग से अंजनवेल
        गाँव के माध्यम से चिपळूण से लगभग 60 किमी दूर है।


        वर्तमान टावर 1956-58 में बनाया गया था और इसकी लाइट फरवरी 1960 में चालू की
        गई थी।'
      history: यहाँ सबसे पहले 1880 में कास्ट आयरन के खंबे पर एक लाइट लगाई गई थी। इसके
        बाद 1933-34 में एक छोटा चिनाई टॉवर आया, फिर 1956-58 में वर्तमान टॉवर बना।
        तब से लाइट के स्रोत को कई बार अपग्रेड किया गया है, हाल ही में 2003 में।
      significance: दाभोल नदी के मुहाने की रक्षा करने वाला 1880 तक के लिखित इतिहास
        वाला एक कार्यशील दीपगृह।
      dos: '- योजना बनाने से पहले गेट पर विजिटिंग ऑवर की जाँच करें'
      donts: '- यदि कर्मचारी मना करें तो उपकरणों की तस्वीर न लें'
      safety_text: null
