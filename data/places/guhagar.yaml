  how_to_reach: About 29 km from Guhagar by road, then a short walk from Hedavi village.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: true
  seasons: []
  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Bamanghal is a narrow cleft cut into the black rock at Hedavi
        beach by the sea. It is about 20 feet deep, 35 feet long and only 1 to 2 feet
        wide.


        At high tide the waves rush into the cleft and burst out as spray. It is a
        short walk from Hedavi village.'
      history: null
      significance: A natural rock cleft where the sea shoots up at high tide.
      dos: '- Check the tide table and go near high tide

        - Visit between October and March'
      donts: '- Don''t step close to the edge of the cleft'
      safety_text: The rock is slippery and waves surge into the gap without warning.
        Keep children well back from the edge.
    mr:
      short_story: 'हेदवी समुद्रकिनाऱ्यावर काळ्या पाषाणात समुद्राच्या लाटांमुळे निर्माण
        झालेली एक संकीर्ण घळ म्हणजेच बामणघळ होय. ही साधारण 20 फूट खोल, 35 फूट लांब
        आणि फक्त 1 ते 2 फूट रुंद आहे.


        भरतीच्या वेळी समुद्राच्या लाटा या घळीत वेगाने शिरतात आणि पाण्याचा तुषार (फवारा)
        होऊन बाहेर उडतात. हेदवी गावातून चालत जाऊन येथे सहज पोहोचता येते.'
      history: null
      significance: भरतीच्या वेळी समुद्राचे पाणी फवार्यासारखे वर उडणारी एक नैसर्गिक
        पाषाण घळ.
      dos: '- भरतीच्या वेळा तपासा आणि भरतीच्या वेळेच्या आसपास भेट द्या

        - ऑक्टोबर ते मार्च दरम्यान भेट द्या'
      donts: '- घळीच्या कड्याच्या (काठाच्या) अत्यंत जवळ उभे करू नका'
      safety_text: इथला खडक निसरडा असून कुठलाही पूर्वइशारा न देता लाटा अचानक घळीत
        उसळतात. मुलांना कड्याच्या काठापासून सुरक्षित अंतरावर दूर ठेवा.
    hi:
      short_story: 'बा्मणघळ हेदवी समुद्र तट पर काले पत्थरों में समुद्र द्वारा बनाई
        गई एक संकरी दरार है। यह लगभग 20 फीट गहरी, 35 फीट लंबी और केवल 1 से 2 फीट चौड़ी
        है।


        उच्च ज्वार (हाई टाइड) के दौरान लहरें दरार में प्रवेश करती हैं और फव्वारे के
        रूप में बाहर निकलती हैं। यह हेदवी गाँव से थोड़ी पैदल दूरी पर है।'
      history: null
      significance: एक प्राकृतिक चट्टानी दरार जहाँ उच्च ज्वार के दौरान समुद्र का पानी
        ऊपर की ओर उठता है।
      dos: '- ज्वार के समय की जाँच करें और उच्च ज्वार के समय के पास जाएँ

        - अक्टूबर से मार्च के बीच जाएँ'
      donts: '- दरार के किनारे के बहुत करीब न कदम रखें'
      safety_text: चट्टान फिसलन भरी है और लहरें बिना किसी चेतावनी के अंतराल में उमड़
        पड़ती हैं। बच्चों को किनारे से काफी दूर रखें।
