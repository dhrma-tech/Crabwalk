  text:
    en:
      short_story: 'Located at the southern end of Guhagar in Asgoli, this ancient
        temple is dedicated to Lord Shiva. It is situated close to the sea, surrounded
        by coconut groves. Visitors can see the main Shiva shrine and an inscribed
        pillar bearing the name of Lokmanya Tilak.


        A unique natural feature nearby is the presence of a freshwater stream right
        next to the salty sea water.'
      history: The temple is believed to date back to the Puranic era and is considered
        a very old Devasthan in the region.
      significance: An ancient seaside Shiva temple featuring a historic pillar linked
        to Lokmanya Tilak.
      dos: '- Enjoy the peaceful coastal views around the temple complex.

        - Notice the contrast of fresh and salty water near the premises.'
      donts: '- Do not litter the temple surroundings.'
      safety_text: Be cautious when walking near the coastal edge, especially during
        high tide.
    mr:
      short_story: 'हे प्राचीन मंदिर गुहागरच्या दक्षिण टोकाला असगोली येथे आहे. हे
        मंदिर भगवान शिवाला समर्पित असून ते समुद्राच्या अगदी जवळ आहे. आजूबाजूला नारळ
        आणि पोफळीच्या बागा आहेत. येथे मुख्य शिवलिंग आणि लोकमान्य टिळकांच्या नावाचा
        उल्लेख असलेला एक ऐतिहासिक खांब पाहता येतो.


        इथला निसर्ग अतिशय शांत असून खाऱ्या समुद्राच्या अगदी जवळ गोड्या पाण्याचा झरा
        असणे हे इथले एक नैसर्गिक वैशिष्ट्य आहे.'
      history: हे मंदिर पौराणिक काळातील असल्याचे मानले जाते आणि परिसरातील एक अत्यंत
        जुने देवस्थान म्हणून ओळखले जाते.
      significance: एक प्राचीन समुद्रकिनारी असलेले शिवमंदिर, जिथे लोकमान्य टिळकांच्या
        संदर्भातील एक ऐतिहासिक खांब आहे.
      dos: '- मंदिर परिसरातील शांत समुद्रकिनाऱ्याच्या दृश्यांचा आनंद घ्या.

        - आवाराजवळ गोडे आणि खारे पाणी एकत्र असण्याचा नैसर्गिक अनुभव घ्या.'
      donts: '- या शांत मंदिर परिसरात कचरा टाकू नका.'
      safety_text: भरतीच्या वेळी समुद्राजवळ चालताना काळजी घ्या.
    hi:
      short_story: 'यह प्राचीन मंदिर गुहागर के दक्षिणी छोर पर असगोली में स्थित है।
        यह मंदिर भगवान शिव को समर्पित है और समुद्र के बहुत करीब स्थित है। इसके चारो
        ओर नारियल के बाग और हरियाली है। दर्शनार्थी यहाँ मुख्य शिवलिंग और लोकमान्य
        तिलक के नाम वाला एक ऐतिहासिक खंभा देख सकते हैं।


        खारे समुद्र के ठीक बगल में मीठे पानी की उपस्थिति यहाँ की एक अनूठी प्राकृतिक
        विशेषता है।'
      history: माना जाता है कि यह मंदिर पौराणिक काल का है और इस क्षेत्र के सबसे पुराने
        देवस्थानों में से एक है।
      significance: एक प्राचीन समुद्र तटीय शिव मंदिर, जहाँ लोकमान्य तिलक से जुड़ा एक
        ऐतिहासिक खंभा मौजूद है।
      dos: '- मंदिर परिसर के आसपास शांत तटीय दृश्यों का आनंद लें।

        - परिसर के पास मीठे और खारे पानी के अनूठे संगम को देखें।'
      donts: '- मंदिर के शांत परिवेश में कूड़ा न फैलाएं।'
      safety_text: उच्च ज्वार के दौरान तटीय किनारे के पास चलते समय सावधान रहें।
