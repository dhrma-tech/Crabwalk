  best_time: September to May
  how_to_reach: From Guhagar town, travel by road via local transport or private vehicle
    for about 20 km south to reach Hedavi village and beach.
  nearest_station: Chiplun Railway Station, 55 km
  nearest_bus_stop: Hedavi Bus Stand
  monsoon_status: risky
  monsoon_reason: Strong tidal waves and rocky shores make entering the water dangerous
    during the monsoon.
  is_tide_dependent: false
