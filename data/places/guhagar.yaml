  text:
    en:
      short_story: 'The Ganesh temple at Hedavi, 18 km from Guhagar, was built in
        the Peshwa period. The idol is known as Shri Dashabhuja Laxmi Ganesh, a ten-armed
        Ganesha.


        A large fair is held here at Maghi Chaturthi. Bamanghal, a narrow rock cleft
        by the sea, is close by.'
      history: Built in the Peshwa period.
      significance: null
      dos: '- Combine with Bamanghal and Hedavi beach'
      donts: '- Don''t carry footwear into the temple'
      safety_text: null
    mr:
      short_story: 'गुहागरपासून 18 किमी अंतरावर असलेले हेदवीचे हे गणेश मंदिर पेशवे
        काळात बांधले गेले. येथील मूर्ती श्री दशभुजा लक्ष्मी गणेश म्हणून ओळखली जाते,
        जी दहा हातांची आहे.


        माघी चतुर्थीला येथे मोठी जत्रा भरते. समुद्राच्या जवळच खडकांमधील एक नैसर्गिक
        घळ, बामणघळ, अगदी जवळ आहे.'
      history: पेशवे काळात बांधलेले.
      significance: null
      dos: '- बामणघळ आणि हेदवी समुद्रकिनाऱ्यालाही भेट द्या'
      donts: '- मंदिरात पादत्राणे घालून जाऊ नका'
      safety_text: null
    hi:
      short_story: 'गुहागर से 18 किमी दूर हेदवी का गणेश मंदिर पेशवा काल में बनाया
        गया था। इस मूर्ति को श्री दशभुजा लक्ष्मी गणेश के नाम से जाना जाता है, जिनके
        दस हाथ हैं।


        माघी चतुर्थी पर यहां एक बड़ा मेला लगता है। समुद्र के पास चट्टानों के बीच एक
        संकरी दरार, बामणघल, इसके करीब ही है।'
      history: पेशवा काल में निर्मित।
      significance: null
      dos: '- बामणघल और हेदवी समुद्र तट भी जाएं'
      donts: '- मंदिर के अंदर जूते-चप्पल न ले जाएं'
