      short_story: 'अंजनवेल हे गुहागरच्या उत्तरेस सुमारे 10 किमी अंतरावर असलेले एक
        मासेमारी करणारे गाव आहे, जिथे वाशिष्ठी नदी समुद्राला मिळते. येथे अर्धा भाग
        डोंगरावर आणि अर्धा भाग किनारपट्टीवर असलेला प्रसिद्ध गोपालगड किल्ला उभा आहे.


