  text:
    en:
      short_story: 'Vijaygad Fort is a small, ruined fortress covering about two acres
        on the northern bank of the Shastri River creek, near Tavsal village. Surrounded
        by a ditch on three sides, the site now consists mostly of degraded stone
        ramparts.


        Visitors can walk around the remains of the main east-facing entrance gate.
        The structural base of former guard rooms, heavily overgrown by vegetation,
        is also visible.'
      history: Peshwa Nanasaheb captured the fort from Tulaji Angre in 1756, and it
        later fell to the British in 1818 before being abandoned.
      significance: A historic coastal outpost built to monitor the Shastri River
        creek alongside its sister fort, Jaigad.
      dos: '- Combine your trip with a visit to the nearby Jaigad Fort across the
        creek.

        - Wear sturdy shoes, as the path and ruins are covered in dense vegetation.'
      donts: '- Do not expect well-preserved structures, as the fort is in a state
        of severe ruin.'
      safety_text: The terrain is uneven, unmaintained, and overgrown, so watch your
        step for loose stones and wild animals.
    mr:
      short_story: 'विजयगड किल्ला हा गुहागर तालुक्यातील तवसाळ गावाजवळ, शास्त्री नदीच्या
        खाडीच्या उत्तरेकडील तीरावर असलेला सुमारे दोन एकरांवर पसरलेला एक छोटासा आणि
        पडझड झालेला किल्ला आहे. तीन बाजूंनी खंदकाने वेढलेल्या या किल्ल्यावर आता प्रामुख्याने
        फक्त पडक्या तटबंदी उरल्या आहेत.


        येथे येणारे पर्यटक पूर्वेकडील मुख्य प्रवेशद्वाराचे अवशेष पाहू शकतात. जुन्या
        पहारेकऱ्यांच्या खोल्यांच्या पायाचा भागही येथे दिसतो, ज्यावर आता मोठ्या प्रमाणावर
        झाडी वाढली आहे.'
      history: पेशवे नानासाहेब यांनी 1756 मध्ये तुळाजी आंग्रे यांच्याकडून हा किल्ला
        जिंकला होता, त्यानंतर 1818 मध्ये तो ब्रिटिशांच्या ताब्यात गेला आणि नंतर ओस
        पडला.
      significance: शास्त्री नदीच्या खाडीवर लक्ष ठेवण्यासाठी जयगडच्या जोडीने बांधलेली
        एक ऐतिहासिक किनारी चौकी.
      dos: '- खाडीच्या पलीकडे असलेल्या जयगड किल्ल्याच्या भेटीसोबत या किल्ल्याला भेट
        देण्याचे नियोजन करा.

        - किल्ल्याचा मार्ग आणि अवशेष झाडाझुडपांनी वेढलेले असल्याने चालण्यासाठी मजबूत
        बूट घाला.'
      donts: '- किल्ला मोठ्या प्रमाणावर कोसळलेला असल्याने येथे सुस्थितीतील वास्तू
        पाहण्याची अपेक्षा करू नका.'
      safety_text: येथील रस्ता खडबडीत, देखभाल न केलेला आणि झुडपांनी वाढलेला आहे, त्यामुळे
        चालताना निसरडे दगड आणि वन्यजीवांपासून सावध राहा.
    hi:
      short_story: 'विजयगढ़ किला गुहागर तालुका के तवसाल गांव के पास, शास्त्री नदी
        की खाड़ी के उत्तरी तट पर लगभग दो एकड़ में फैला एक छोटा और खंडहर हो चुका किला
        है। तीन तरफ से खाई से घिरे इस स्थान पर अब मुख्य रूप से टूटी हुई पत्थर की प्राचीरें
        ही बची हैं।


        पर्यटक पूर्व की ओर मुख वाले मुख्य प्रवेश द्वार के अवशेषों के आसपास घूम सकते
        हैं। पुराने गार्ड कमरों का आधार भी यहां दिखाई देता है, जिस पर काफी झाड़ियां
        उग आई हैं।'
      history: पेशवा नानासाहेब ने 1756 में तुलाजी आंग्रे से इस किले पर कब्जा कर लिया
        था, और बाद में 1818 में यह अंग्रेजों के अधीन हो गया और अंततः इसे छोड़ दिया
        गया।
      significance: अपने सहयोगी जयगढ़ किले के साथ शास्त्री नदी की खाड़ी की निगरानी
        के लिए बनाई गई एक ऐतिहासिक तटीय चौकी।
      dos: '- खाड़ी के उस पार स्थित जयगढ़ किले की यात्रा के साथ यहां आने की योजना
        बनाएं।

        - रास्ता और खंडहर घनी वनस्पतियों से ढके होने के कारण मजबूत जूते पहनकर आएं।'
      donts: '- किले के खंडहर अवस्था में होने के कारण यहां अच्छी तरह से संरक्षित संरचनाओं
        की उम्मीद न करें।'
      safety_text: यहां का इलाका ऊबड़-खाबड़, बिना रखरखाव वाला और झाड़ियों से भरा है,
        इसलिए चलते समय ढीले पत्थरों और जंगली जानवरों से सावधान रहें।
