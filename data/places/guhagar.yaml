  how_to_reach: 13 km from Guhagar to Anjanvel village; a road leads up to the gate,
    about 30 minutes on foot.
  nearest_station: Chiplun (51 km)
  nearest_bus_stop: Guhagar bus stand (13 km)
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Anjanvel_Fort
  is_hidden_gem: false
  text:
    en:
      short_story: 'Gopalgad, also called Anjanvel fort, is a laterite sea fort on
        a 300 ft hill near Anjanvel, 13 km from Guhagar. The rectangular fort covers
        7 acres, with walls 12 ft high and 8 ft thick, 15 bastions and a dry moat
        all round.


        It is split into three parts, Varchakot, Parkot and Balekot, and there is
        a mango orchard inside the walls. The old Uddalakeshwar temple is nearby,
        and Talkeshwar lighthouse is about 2 km away.'
      history: Tradition says King Ramaraya built it, date unknown. Adil Shah took
        it in 1424 and Shivaji in 1660, adding a dockyard and naming it Gopalgad.
        Khairiyat Khan held it from 1699 for 46 years, Tulaji Angre won it in 1745,
        Ramji Mahadev Bivalkar in 1756, and Colonel Kennedy took it in 1818.
      significance: A large coastal fort guarding the mouth of the Vashishti river.
      dos: '- Combine with Talkeshwar lighthouse and Anjanvel beach

        - Walk the walls for views over the river mouth'
      donts: '- Don''t climb the bastion walls'
      safety_text: '- Parts of the fort are in ruins; watch your step'
    mr:
      short_story: 'गुहागरपासून 13 किमी अंतरावर अंजनवेलजवळ 300 फूट उंचीच्या टेकडीवर
        असलेला गोपाळगड हा जांभा दगडाचा जलदुर्ग आहे, ज्याला अंजनवेलचा किल्ला असेही
        म्हणतात. 7 एकरांवर पसरलेल्या या आयताकृती किल्ल्याची तटबंदी 12 फूट उंच आणि
        8 फूट जाड असून, त्याला 15 बुरुज आणि सभोवताली एक कोरडा खंदक आहे.


        हा किल्ला वरचाकोट, पारकोट आणि बालेकोट अशा तीन भागांत विभागलेला असून, तटबंदीच्या
        आत आंब्याची बाग आहे. जुने उद्दाळकेश्वर मंदिर जवळच आहे आणि टळकेश्वर दीपगृह
        सुमारे 2 किमी अंतरावर आहे.'
      history: परंपरेनुसार, रामराया राजाने हा किल्ला बांधला, पण त्याची तारीख अज्ञात
        आहे. आदिलशहाने 1424 मध्ये आणि शिवाजी महाराजांनी 1660 मध्ये हा किल्ला जिंकला,
        त्यात गोदी बांधून त्याचे गोपाळगड असे नामकरण केले. 1699 पासून 46 वर्षे तो खैरियात
        खानाच्या ताब्यात होता. 1745 मध्ये तुळाजी आंग्रे यांनी, 1756 मध्ये रामजी महादेव
        बिवलकर यांनी हा किल्ला जिंकला आणि 1818 मध्ये कर्नल केनेडीने तो ताब्यात घेतला.
      significance: वाशिष्ठी नदीच्या मुखाचे रक्षण करणारा एक मोठा किनारी किल्ला.
      dos: '- टळकेश्वर दीपगृह आणि अंजनवेल समुद्रकिनाऱ्यालाही भेट द्या

        - नदीच्या मुखाचे दृश्य पाहण्यासाठी तटबंदीवरून चाला'
      donts: '- बुरुजांच्या भिंतींवर चढू नका'
      safety_text: '- किल्ल्याचे काही भाग ढासळलेले आहेत; जपून चाला'
    hi:
      short_story: 'गुहागर से 13 किमी दूर अंजनवेल के पास 300 फीट ऊंची पहाड़ी पर स्थित
        गोपालगढ़ एक लैटेराइट समुद्री किला है, जिसे अंजनवेल किला भी कहा जाता है। 7
        एकड़ में फैले इस आयताकार किले की दीवारें 12 फीट ऊंची और 8 फीट मोटी हैं, जिसमें
        15 बुर्ज और चारों ओर एक सूखी खाई है।


        इसे तीन भागों में बांटा गया है: वरचाकोट, पारकोट और बालेकोट, और दीवारों के
        अंदर एक आम का बगीचा है। पुराना उद्दालकेश्वर मंदिर पास ही है, और टलकेश्वर लाइटहाउस
        लगभग 2 किमी दूर है।'
      history: परंपरा के अनुसार, इसे राजा रामराय ने बनवाया था, हालांकि तारीख अज्ञात
        है। आदिल शाह ने 1424 में और शिवाजी ने 1660 में इसे जीता, इसमें एक डॉकयार्ड
        जोड़ा और इसका नाम गोपालगढ़ रखा। 1699 से 46 वर्षों तक यह खैरियात खान के पास
        रहा, 1745 में तुलाजी आंग्रे ने, 1756 में रामजी महादेव बिवलकर ने इसे जीता और
        1818 में कर्नल कैनेडी ने इस पर कब्ज़ा कर लिया।
      significance: वशिष्ठी नदी के मुहाने की रक्षा करने वाला एक बड़ा तटीय किला।
      dos: '- टलकेश्वर लाइटहाउस और अंजनवेल समुद्र तट भी जाएं

        - नदी के मुहाने के नज़ारे देखने के लिए दीवारों पर चलें'
      donts: '- बुर्ज की दीवारों पर न चढ़ें'
      safety_text: '- किले के कुछ हिस्से खंडहर में हैं; संभलकर चलें'
