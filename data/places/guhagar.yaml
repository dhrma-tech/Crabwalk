  text:
    en:
      short_story: 'Veldur Creek is situated about 12.5 kilometers from Guhagar on
        the southern side of the Dabhol water channel. The area does not have a traditional
        sandy beach but offers a scenic coastal environment.


        Visitors can watch ferries crossing the channel between Dhopave and Dabhol,
        or spot dolphins cruising in the water. A large gas and power plant is also
        visible near Veldur.'
      history: null
      significance: A coastal inlet known for ferry crossings and dolphin spotting.
      dos: '- Take a boat ride to spot dolphins in the creek.

        - Enjoy a lazy evening watching the ferries cross the water channel.'
      donts: '- Do not expect a sandy beach, as the shoreline here is rocky and industrial.'
      safety_text: null
    mr:
      short_story: 'वेळदूरची खाडी गुहागरपासून सुमारे 12.5 किलोमीटर अंतरावर दाभोळ खाडीच्या
        दक्षिण बाजूला आहे. या भागात वाळूचा पारंपरिक समुद्रकिनारा नसून एक सुंदर किनारी
        भाग पाहायला मिळतो.


        इथून धोपावे आणि दाभोळ दरम्यान चालणाऱ्या फेरी बोटींची ये-जा पाहता येते. तसेच
        खाडीच्या पाण्यात डॉल्फिनचे दर्शनही होऊ शकते. वेळदूरजवळ रत्नागिरी गॅस अँड पॉवर
        प्लांट (एनरॉन) देखील दिसतो.'
      history: null
      significance: फेरी बोटींचा प्रवास, निवांत संध्याकाळ आणि डॉल्फिन पाहण्यासाठी
        प्रसिद्ध असलेला एक किनारी भाग.
      dos: '- खाडीत डॉल्फिन पाहण्यासाठी बोट राइडचा आनंद घ्या.

        - जलमार्गावरून जाणाऱ्या फेरी बोटी पाहत निवांत संध्याकाळ घालवा.'
      donts: '- येथे वाळूच्या किनाऱ्याची अपेक्षा करू नका, कारण इथला किनारा खडकाळ आणि
        औद्योगिक स्वरूपाचा आहे.'
      safety_text: null
    hi:
      short_story: 'वेलदुर क्रीक गुहागर से लगभग 12.5 किलोमीटर दूर दाभोल जलमार्ग के
        दक्षिणी किनारे पर स्थित है। इस क्षेत्र में पारंपरिक रेतीला समुद्र तट नहीं
        है, लेकिन यह एक सुंदर तटीय वातावरण प्रदान करता है।


        आगंतुक धोपावे और दाभोल के बीच चैनल पार करने वाली घाट नौकाओं (फेरी) को देख
        सकते हैं, या पानी में डॉल्फिन को तैरते हुए देख सकते हैं। वेलदुर के पास रत्नागिरी
        गैस और बिजली संयंत्र भी दिखाई देता है।'
      history: null
      significance: एक तटीय क्षेत्र जो फेरी क्रॉसिंग और डॉल्फिन देखने के लिए जाना
        जाता है।
      dos: '- क्रीक में डॉल्फिन देखने के लिए नाव की सवारी करें।

        - जलमार्ग पार करने वाली घाट नौकाओं को देखते हुए एक शांत शाम बिताएं।'
      donts: '- यहाँ रेतीले समुद्र तट की अपेक्षा न करें, क्योंकि यहाँ का किनारा पथरीला
        और औद्योगिक है।'
      safety_text: null
