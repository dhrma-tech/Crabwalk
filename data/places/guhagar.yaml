  text:
    en:
      short_story: 'Located about 16 kilometers from Guhagar, Dhopave Jetty sits on
        the southern bank of the Dabhol creek. It serves as a major transit point
        for the local ferry service connecting Dhopave to Dabhol on the northern side.


        Visitors can load their vehicles onto the ferry to cross the water channel.
        It is a quiet spot to observe the backwaters and catch glimpses of dolphins.'
      history: null
      significance: A vital ferry transit point across the Dabhol creek offering vehicle
        transport and backwater views.
      dos: '- Use the daytime ferry service to transport your vehicle across the creek
        to Dabhol.

        - Look out for dolphins swimming along the water channel.'
      donts: '- Do not plan to use the ferry during the monsoon season when services
        are closed.

        - Do not visit expecting a beach, as the jetty area is purely for transit
        and water views.'
      safety_text: Ensure your vehicle brakes and gears are properly engaged while
        loaded on the ferry.
    mr:
      short_story: 'गुहागरपासून सुमारे 16 किलोमीटर अंतरावर असलेली धोपावे जेटी दाभोळ
        खाडीच्या दक्षिण तीरावर आहे. धोपावे ते उत्तरेकडील दाभोळला जोडणाऱ्या स्थानिक
        फेरी सेवेसाठी हे एक महत्त्वाचे केंद्र आहे.


        इथून प्रवासी आपली वाहने फेरी बोटीत चढवून खाडी पार करू शकतात. हे खाडीचे शांत
        दृश्य पाहण्यासाठी, जाणाऱ्या-येणाऱ्या बोटींची हालचाल पाहण्यासाठी आणि डॉल्फिनची
        झलक पाहण्यासाठी एक उत्तम ठिकाण आहे.'
      history: null
      significance: दाभोळ खाडी पार करण्यासाठी वाहन वाहतूक आणि खाडीचे सुंदर दृश्य देणारे
        एक महत्त्वाचे फेरी केंद्र.
      dos: '- तुमचे वाहन दाभोळला नेण्यासाठी दिवसा चालणाऱ्या फेरी सेवेचा वापर करा.

        - जलमार्गात पोहणारे डॉल्फिन पाहण्यासाठी नजर ठेवा.'
      donts: '- पावसाळ्यात फेरी सेवा बंद असल्याने या काळात जाण्याचे टाळा.

        - येथे समुद्रकिनाऱ्याची अपेक्षा करू नका, कारण हा परिसर केवळ वाहतूक आणि पाणी
        पाहण्यासाठी आहे.'
      safety_text: तुमची गाडी फेरी बोटीवर उभी करताना गाडीचे गिअर आणि ब्रेक योग्य प्रकारे
        लागलेले आहेत याची खात्री करा.
    hi:
      short_story: 'गुहागर से लगभग 16 किलोमीटर दूर स्थित, धोपावे जेटी दाभोल क्रीक
        के दक्षिणी तट पर है। यह धोपावे को उत्तरी तरफ दाभोल से जोड़ने वाली स्थानीय
        फेरी (नाव) सेवा के लिए एक प्रमुख पारगमन बिंदु के रूप में कार्य करता है।


        आगंतुक जलमार्ग पार करने के लिए अपने वाहनों को फेरी पर लाद सकते हैं। यह बैकवाटर
        को देखने और क्रीक में डॉल्फिन की झलक पाने के लिए एक शांत जगह है।'
      history: null
      significance: दाभोल क्रीक के पार एक महत्वपूर्ण फेरी पारगमन बिंदु जो वाहन परिवहन
        और बैकवाटर के दृश्य प्रस्तुत करता है।
      dos: '- अपने वाहन को क्रीक के पार दाभोल ले जाने के लिए दिन के समय फेरी सेवा
        का उपयोग करें।

        - जलमार्ग के साथ तैरने वाले डॉल्फिन पर नज़र रखें।'
      donts: '- मानसून के मौसम के दौरान फेरी का उपयोग करने की योजना न बनाएं जब सेवाएं
        बंद रहती हैं।

        - समुद्र तट की उम्मीद के साथ यहां न आएं, क्योंकि जेटी क्षेत्र पूरी तरह से
        पारगमन और पानी के दृश्यों के लिए है।'
      safety_text: फेरी पर लोड होने के दौरान सुनिश्चित करें कि आपके वाहन के ब्रेक
        और गियर ठीक से लगे हुए हैं।
