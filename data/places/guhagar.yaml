  wikipedia_url: null
  is_hidden_gem: false
  text:
    en:
      short_story: 'Hedavi Beach is a dark-sand cove situated between the white-sand
        shores of Guhagar and Ganpatipule. The shoreline is highly rugged, dominated
        by massive rock formations and crashing tidal waves rather than smooth sand.


        At one end of the beach lies the Uma Maheshwari Temple. Nearby is the natural
        rocky gorge known as Bamn Ghal, where seawater splashes up to 30 feet high
        during high tides.'
      history: Hedavi is a historic village known for its ancient temples dating back
        to the Peshwa period and earlier.
      significance: A rocky coastal cove famous for its dark sand and the dramatic
        Bamn Ghal water gorge.
      dos: '- Visit Bamn Ghal during high tide to see the seawater column splashing
        through the gorge.

        - Explore the historic Uma Maheshwari and Dashabhuja Ganpati temples nearby.'
      donts: '- Do not attempt to swim or dive here under any circumstances.'
      safety_text: The beach is very rocky and currents are dangerous, making it entirely
        unsafe for swimming.
    mr:
      short_story: 'हेदवी बीच हा गुहागर आणि गणपतीपुळे यांच्या पांढऱ्या वाळूच्या किनाऱ्यांच्या
        मध्ये असलेला काळ्या वाळूचा किनारा आहे. येथील किनारा गुळगुळीत वाळूचा नसून,
        अत्यंत खडकाळ आहे आणि येथे समुद्राच्या मोठ्या लाटा खडकांवर आदळताना दिसतात.


        किनाऱ्याच्या एका टोकाला उमा महेश्वरी मंदिर आहे. जवळच बामणघळ नावाची एक नैसर्गिक
        खडकाळ घळ आहे, जिथे भरतीच्या वेळी समुद्राचे पाणी 30 फुटांपर्यंत उसळते.'
      history: हेदवी हे पेशवेकालीन आणि त्याआधीच्या प्राचीन मंदिरांसाठी ओळखले जाणारे
        एक ऐतिहासिक गाव आहे.
      significance: काळी वाळू आणि बामणघळीच्या नैसर्गिक आश्चर्यासाठी प्रसिद्ध असलेला
        एक खडकाळ समुद्रकिनारा.
      dos: '- भरतीच्या वेळी घळीतून उसळणारे पाणी पाहण्यासाठी बामणघळीला नक्की भेट द्या.

        - जवळच असलेल्या ऐतिहासिक उमा महेश्वरी आणि दशभुजा गणपती मंदिराला भेट द्या.'
      donts: '- कोणत्याही परिस्थितीत येथे पोहण्याचा किंवा पाण्यात उड्या मारण्याचा
        प्रयत्न करू नका.'
      safety_text: हा किनारा अतिशय खडकाळ असून येथील पाण्याचे प्रवाह धोकादायक आहेत,
        त्यामुळे येथे पोहणे पूर्णपणे असुरक्षित आहे.
    hi:
      short_story: 'हेदवी बीच गुहागर और गणपतिपुले के सफेद रेत वाले तटों के बीच स्थित
        एक काले रेत वाली खाड़ी है। यह तट रेतीला कम और पथरीला ज्यादा है, जहां बड़ी-बड़ी
        चट्टानें हैं और समुद्र की तेज लहरें उनसे टकराती हैं।


        तट के एक छोर पर उमा माहेश्वरी मंदिर स्थित है। पास ही बामन घल नामक एक प्राकृतिक
        चट्टानी दरार है, जहां उच्च ज्वार के दौरान समुद्र का पानी 30 फीट तक ऊपर उछलता
        है।'
      history: हेदवी एक ऐतिहासिक गांव है जो पेशवा काल और उससे भी पुराने समय के प्राचीन
        मंदिरों के लिए जाना जाता है।
      significance: अपनी काली रेत और बामन घल के पानी के फव्वारे के लिए प्रसिद्ध एक
        चट्टानी तटीय खाड़ी।
      dos: '- दरार से पानी को ऊपर उछलते देखने के लिए उच्च ज्वार के समय बामन घल की
        यात्रा करें।

        - पास ही स्थित ऐतिहासिक उमा माहेश्वरी और दशभुजा गणपति मंदिरों के दर्शन करें।'
      donts: '- किसी भी परिस्थिति में यहां तैरने या गोता लगाने का प्रयास न करें।'
      safety_text: यह तट बहुत पथरीला है और यहां पानी का बहाव खतरनाक है, इसलिए यह तैरने
        के लिए बिल्कुल भी सुरक्षित नहीं है।
