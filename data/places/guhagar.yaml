      significance: पश्चिमाभिमुख पांढऱ्या संगमरवरी गणेश मूर्तीसाठी प्रसिद्ध असलेल
        एक स्थानिक मंदिर.
      dos: '- जवळच असलेल्या गुहागर समुद्रकिनाऱ्याला नक्की भेट द्या.

        - मूर्तीच्या उजवीकडे वळलेल्या वैशिष्ट्यपूर्ण सोंडेचे दर्शन घ्या.'
      donts: '- मंदिराच्या नियमांत बसत नसल्यास गाभाऱ्यातील मूर्तीचे फोटो काढू नका.'
