        एक एकांत समुद्र तट।
      dos: '- स्थानीय जलीय पक्षियों को देखने के लिए तट के किनारे टहलें।

        - यहां व्यावसायिक दुकानें कम हैं, इसलिए अपना भोजन और पानी साथ लाएं।'
