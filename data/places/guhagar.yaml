    hi:
      short_story: 'श्री उफराटा गणपति मंदिर गुहागर में समुद्र तट के पास स्थित एक हिंदू
        मंदिर है। यह मंदिर भगवान गणेश को समर्पित है और अपनी शुद्ध सफेद संगमरमर की
        मूर्ति के लिए जाना जाता है।


        आमतौर पर पूर्व की ओर मुख वाली गणेश मूर्तियों के विपरीत, चार भुजाओं वाली इस
        मूर्ति के हाथों में फरसा और त्रिशूल है और इसका मुख पश्चिम में अरब सागर की
        ओर है। मूर्ति की सूंड दाहिनी ओर मुड़ी हुई है।'
      history: null
      significance: पश्चिम की ओर मुख वाली एक अनूठी सफेद संगमरमर की गणेश मूर्ति के
        लिए प्रसिद्ध एक स्थानीय मंदिर।
      dos: '- कुछ ही दूरी पर स्थित गुहागर समुद्र तट पर जाएं।

        - मूर्ति की दाहिनी ओर मुड़ी हुई अनूठी सूंड के दर्शन करें।'
      donts: '- यदि मंदिर के नियमों में मनाही हो तो गर्भगृह के अंदर तस्वीर न लें।'
