  text:
    en:
      short_story: 'Located in Palshet, these natural sites offer unique geographical
        formations. The Palshet cave spans about 3 kilometers, beginning at the beach
        and leading up to a nearby hilltop. The Musrundi cave (also known as Waghbil
        cave) features a man-made undersea wall recently discovered by archaeologists.


        There is also a natural gorge in the black rock measuring 35 feet long and
        20 feet deep, where seawater gushes in forcefully during high tide.'
      history: null
      significance: A 3-kilometer coastal cave system and an archaeological site featuring
        an ancient undersea wall.
      dos: '- Visit the gorge during high tide to watch the seawater splash through
        the rocks.

        - Carry a flashlight if you plan to explore the cave entrances.'
      donts: '- Do not attempt scuba diving near the undersea wall unless you are
        an experienced diver.'
      safety_text: Watch your step on the wet and slippery basalt rocks, and stay
        clear of the gorge edge during high tides.
    mr:
      short_story: 'पालशेतमध्ये असलेल्या या नैसर्गिक गुहा त्यांच्या भौगोलिक रचनेसाठी
        ओळखल्या जातात. पालशेतची गुहा सुमारे 3 किलोमीटर लांब असून ती समुद्रकिनाऱ्यावरून
        सुरू होऊन जवळच्या डोंगरावर संपते. मुसरुंडी गुहेत (वाघबीळ गुहा) पुरातत्वशास्त्रज्ञांना
        अलीकडेच समुद्राखालील एक प्राचीन मानवनिर्मित भिंत सापडली आहे.


        येथे काळ्या खडकात 35 फूट लांब आणि 20 फूट खोल अशी एक नैसर्गिक घळ आहे, जिथे
        समुद्राचे पाणी वेगाने आत शिरते.'
      history: null
      significance: 3 किलोमीटर लांबीची किनारी गुहा आणि समुद्राखालील प्राचीन भिंत असलेली
        एक पुरातत्वीय जागा.
      dos: '- भरतीच्या वेळी खडकांमधून वेगाने उडणारे समुद्राचे पाणी पाहण्यासाठी या
        घळीला भेट द्या.

        - गुहेच्या प्रवेशद्वाराजवळ फिरायचे असल्यास सोबत बॅटरी (टॉर्च) ठेवा.'
      donts: '- तुम्ही अनुभवी स्कूबा डायव्हर नसल्यास समुद्राखालील भिंतीजवळ डायव्हिंगचा
        प्रयत्न करू नका.'
      safety_text: निसरड्या काळ्या खडकांवर चालताना जपा आणि भरतीच्या वेळी घळीच्या कडेपासून
        दूर राहा.
    hi:
      short_story: 'पालशेत में स्थित ये गुफाएं अपनी अनूठी भौगोलिक संरचनाओं के लिए
        जानी जाती हैं। पालशेत गुफा लगभग 3 किलोमीटर लंबी है, जो समुद्र तट से शुरू होकर
        पास की पहाड़ी की चोटी तक जाती है। मुसरुंडी गुफा (वाघबिल गुफा) में पुरातत्वविदों
        ने हाल ही में समुद्र के नीचे एक प्राचीन मानव निर्मित दीवार की खोज की है।


        यहाँ काले चट्टान में 35 फुट लंबी और 20 फुट गहरी एक प्राकृतिक खाई भी है, जहाँ
        समुद्र का पानी तेजी से अंदर आता है।'
      history: null
      significance: 3 किलोमीटर लंबी तटीय गुफा प्रणाली और समुद्र के नीचे एक प्राचीन
        दीवार वाला एक पुरातात्विक स्थल।
      dos: '- उच्च ज्वार के दौरान चट्टानों से टकराते समुद्री पानी को देखने के लिए
        इस खाई की यात्रा करें।

        - यदि आप गुफा के प्रवेश द्वारों का पता लगाना चाहते हैं तो अपने साथ एक टॉर्च
        रखें।'
      donts: '- यदि आप एक अनुभवी स्कूबा गोताखोर नहीं हैं, तो समुद्र के नीचे की दीवार
        के पास गोता लगाने का प्रयास न करें।'
      safety_text: गीली और फिसलन भरी बेसाल्ट चट्टानों पर संभलकर चलें, और उच्च ज्वार
        के दौरान खाई के किनारे से दूर रहें।
