      short_story: 'पालशेत बीच रत्नागिरी जिले के गुहागर क्षेत्र में स्थित एक शांत
        और प्राकृतिक समुद्र तट है। अत्यधिक व्यावसायिक तटों के विपरीत, यह एक एकांत
        तट है जहां का मौसम सुहावना और अरब सागर का दृश्य सुंदर है।


        पर्यटक तट के किनारे कई तरह के प्रवासी और स्थानीय जलीय पक्षियों को देख सकते
        हैं। यह तट अपने शांत वातावरण और सूर्यास्त के दृश्यों के लिए जाना जाता है।'
      history: null
