  text:
    en:
      short_story: 'Dolphin Point is a scenic viewpoint situated in Anjanvel village,
        Guhagar taluka, near the Talkeshwar Point Lighthouse and Talkeshwar Temple.
        It offers expansive views of the Arabian Sea, crashing waves, and the rocky
        coastal cliffs.


        Visitors often use this vantage point for dolphin spotting tours. Wild dolphins
        can sometimes be seen swimming in the calm waters, especially during the early
        afternoon.'
      history: null
      significance: A popular coastal viewpoint in Maharashtra for spotting wild dolphins
        in their natural habitat.
      dos: '- Bring binoculars or a zoom lens for a better chance at spotting dolphins.

        - Visit between October and March when the sea is calmer.'
      donts: '- Do not visit during the monsoon season due to rough seas and high
        winds.'
      safety_text: The cliff edges can be steep, so maintain a safe distance from
        the edge while observing the sea.
    mr:
      short_story: 'अंजनवेल (गुहागर) येथील टळकेश्वर दीपगृह आणि टळकेश्वर मंदिराजवळ
        डॉल्फिन पॉईंट हा एक नयनरम्य निसर्ग बिंदू आहे. येथून अरबी समुद्र, लाटा आणि
        खडकाळ किनारपट्टीचे विहंगम दृश्य दिसते.


        हा परिसर डॉल्फिन पाहण्यासाठी प्रसिद्ध असून, दुपारच्या वेळी समुद्राच्या शांत
        पाण्यात अनेकदा जंगली डॉल्फिन पोहताना दिसतात.'
      history: null
      significance: महाराष्ट्रातील नैसर्गिक अधिवासात जंगली डॉल्फिन पाहण्यासाठी प्रसिद्ध
        असलेला किनारी पॉईंट.
      dos: '- डॉल्फिन पाहण्यासाठी दुर्बीण किंवा झूम लेन्स कॅमेरा सोबत ठेवा.

        - समुद्र शांत असतो तेव्हा ऑक्टोबर ते मार्च दरम्यान भेट द्या.'
      donts: '- पावसाळ्यात समुद्र खवळलेला असल्याने आणि सोसाट्याचा वारा असल्याने येथे
        जाणे टाळा.'
      safety_text: कड्याचा भाग तीव्र उताराचा असल्याने, समुद्राचे दृश्य पाहताना कड्यापासून
        सुरक्षित अंतर ठेवा.
    hi:
      short_story: 'डॉल्फिन पॉइंट गुहागर तालुका के अंजनवेल गांव में टल्केश्वर लाइटहाउस
        और टल्केश्वर मंदिर के पास स्थित एक सुंदर व्यूप्वाइंट है। यहां से अरब सागर,
        लहरों और चट्टानी तटीय पहाड़ियों का शानदार दृश्य दिखाई देता है।


        यह जगह डॉल्फिन देखने के लिए लोकप्रिय है, जहां खासकर दोपहर के समय शांत पानी
        में जंगली डॉल्फिन को तैरते हुए देखा जा सकता है।'
      history: null
      significance: महाराष्ट्र में प्राकृतिक आवास में जंगली डॉल्फिन देखने के लिए एक
        प्रसिद्ध तटीय व्यूप्वाइंट।
      dos: '- डॉल्फिन देखने के लिए अपने साथ दूरबीन या ज़ूम लेंस वाला कैमरा रखें।

        - अक्टूबर से मार्च के बीच यहां आएं, जब समुद्र शांत रहता है।'
      donts: '- मानसून के दौरान समुद्र के उग्र होने और तेज हवाओं के कारण यहां न आएं।'
      safety_text: चट्टान के किनारे खड़ी ढलान वाले हो सकते हैं, इसलिए समुद्र देखते
        समय किनारे से सुरक्षित दूरी बनाए रखें।
