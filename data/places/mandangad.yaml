        गावामध्ये स्थित एक जलसंचय प्रकल्प आहे. या परिसरात स्थानिक वनस्पती आणि ग्रामीण
        भूभागाने वेढलेला बॅकवॉटर जलाशय आहे.


        येथील पर्यटक खुले पाणी आणि सभोवतालचा पाणलोट क्षेत्र पाहू शकतात. हे सोवेली
        आणि मंडणगड भागातून जाणारे स्थानिक रस्त्यांनी पोहोचण्यायोग्य आहे.'
      history: null
      significance: मंडणगड तालुक्यातील विन्हे गावातील एक स्थानिक जलशाय आणि धरण संरचना.
      dos: '- धरण स्थळापर्यंत पोहोचण्यासाठी ठरवलेले स्थानिक मार्ग वापर.

        - जलाशयाजवळील स्थानिक मालमत्ता आणि शेतीच्या सीमांचा आदर करा.'
      donts: '- खोल पाण्यात किंवा जलाशयाच्या पात्रात प्रवेश करू नका.

        - धरण संरचनेत अनधिकृत कृती करू नका.'
      safety_text: सुरक्षा भिंती नसल्यामुळे पाण्याच्या काठापासून आणि सांडव्याच्या
        भागापासून सुरक्षित अंतर ठेवा.
    hi:
      short_story: 'विन्हे बांध रत्नागिरी जिले के मंडणगड तालुका में विन्हे गाँव में
        स्थित एक जल संचय संरचना है। इस क्षेत्र में स्थानीय वनस्पतियों और ग्रामीण भूभाग
        से घिरा हुआ एक बैकवाटर जलाशय है।


        यहाँ आने वाले आगंतुक खुले जलाशय और आसपास के जलग्रहण क्षेत्र को देख सकते हैं।
        यह सोवेली और मंडणगड क्षेत्र से गुजरने वाले स्थानीय सड़कों के माध्यम से सुगम
        है।'
      history: null
      significance: मंडणगड तालुका के विन्हे गाँव में स्थित एक स्थानीय जल जलाशय और
        बांध संरचना।
      dos: '- बांध स्थल तक पहुँचने के लिए निर्धारित स्थानीय मार्गों का उपयोग करें।

        - जलाशय के पास स्थानीय संपत्ति और कृषि सीमाओं का सम्मान करें।'
      donts: '- गहरे पानी या जलाशय बेसिन में प्रवेश न करें।

        - बांध संरचना के आसपास अनधिकृत गतिविधियाँ न करें।'
      safety_text: पानी के किनारे और स्पिलवे क्षेत्रों से सुरक्षित दूरी बनाए रखें
        क्योंकि सुरक्षा बैरियर अनुपस्थित हो सकते हैं।
