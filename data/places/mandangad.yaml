- slug: bankot-fort
  status: ai_draft
  name_en: Bankot Fort (Himmatgad)
  name_mr: बाणकोट किल्ला (हिंमतगड)
  name_hi: बाणकोट किला (हिम्मतगढ़)
  category: fort
  taluka: Mandangad
  lat: 17.978218
  lng: 73.040202
  coord_source: osm node/3900342792
  osm_id: node/3900342792
  entry_fee_text: null
  entry_fee_inr: null
  visit_minutes: null
  opens: null
  closes: null
  closed_days: []
  best_time: null
  how_to_reach: About 47 km from Dapoli by road, or by the Bagmandala-Bankot ferry
    from Harihareshwar; a road reaches the fort.
  nearest_station: null
  nearest_bus_stop: null
  monsoon_status: open
  monsoon_reason: null
  is_tide_dependent: false
  seasons: []
  wikipedia_url: https://en.wikipedia.org/wiki/Bankot_fort
  is_hidden_gem: false
  text:
    en:
      short_story: 'Bankot fort, also called Himmatgad or Fort Victoria, stands on
        a 300 ft hill above the mouth of the Savitri river, about 47 km from Dapoli.
        It is built of laterite with a moat cut into the rock.


        The main gate faces Bankot creek. Look for the Nagarkhana and a bastion with
        a secret entrance. From Harihareshwar you can cross by the Bagmandala-Bankot
        ferry; a road now reaches the fort.'
      history: The earliest known mention is in Ptolemy's records from the 1st century
        AD, as Mandagora, and Hieun Tsang is said to have sailed from Bankot in 640
        AD. The Portuguese took it from Adil Shah in 1548. Kanhoji Angre won it in
        1700 and named it Himmatgad. It surrendered to a British fleet in 1755, was
        renamed Fort Victoria, and was later handed to the Peshwas.
      significance: One of the oldest recorded ports on this coast, guarding the Savitri
        river mouth.
      dos: '- Combine with Velas beach and the Bagmandala ferry

        - Allow about half an hour from the village to the gate'
      donts: '- Don''t enter areas under renovation'
      safety_text: '- Renovation work is ongoing; follow signs on site'
    mr:
      short_story: 'बाणकोट किल्ला, ज्याला हिंमतगड किंवा फोर्ट व्हिक्टोरिया असेही म्हणतात,
        दापोलीपासून सुमारे 47 किमी अंतरावर सावित्री नदीच्या मुखावर 300 फूट उंचीच्या
        टेकडीवर उभा आहे. हा जांभ्या दगडाने बांधलेला असून त्यात खडकात कोरलेला एक खंदक
        आहे.


        किल्ल्याचा मुख्य दरवाजा बाणकोट खाडीच्या दिशेने आहे. येथील नगारखाना आणि गुप्त
        मार्ग असलेला बुरूज आवर्जून पहा. हरिहरेश्वरहून तुम्ही बागमंडला-बाणकोट फेरीने
        (बोट) खाडी पार करू शकता; आता किल्ल्यापर्यंत थेट रस्ताही झाला आहे.'
      history: या बंदराचा सर्वात जुना उल्लेख पहिल्या शतकातील टॉलेमीच्या नोंदींमध्ये
        'मंडागोरा' असा आढळतो, आणि असे मानले जाते की 640 इसवी सनामध्ये ह्युएन त्संग
        याने बाणकोट येथूनच समुद्रमार्गे प्रवास केला होता. 1548 मध्ये पोर्तुगीजांनी
        हा किल्ला आदिलशहाकडून जिंकून घेतला. त्यानंतर 1700 मध्ये कान्होजी आंग्रे यांनी
        तो जिंकला आणि त्याचे नाव 'हिंमतगड' ठेवले. 1755 मध्ये हा किल्ला ब्रिटिशांच्या
        नौदलाला शरण गेला, त्याचे नाव बदलून 'फोर्ट व्हिक्टोरिया' ठेवले गेले आणि नंतर
        तो पेशव्यांच्या स्वाधीन करण्यात आला.
      significance: या किनाऱ्यावरील सर्वात जुन्या नोंद असलेल्या बंदरांपैकी एक, जे
        सावित्री नदीच्या मुखाचे रक्षण करते.
      dos: '- वेळास समुद्रकिनारा आणि बागमंडला फेरीसोबत या किल्ल्याला भेट देण्याचे
        नियोजन करा

        - गावातून किल्ल्याच्या मुख्य दरवाजापर्यंत जाण्यासाठी साधारण अर्ध्या तासाचा
        वेळ ठेवा'
      donts: '- नूतनीकरणाचे काम चालू असलेल्या भागात जाऊ नका'
      safety_text: '- किल्ल्यावर नूतनीकरणाचे काम चालू आहे; तिथे लावलेल्या सूचना फलकांचे
        पालन करा'
    hi:
      short_story: 'बाणकोट किला, जिसे हिम्मतगढ़ या फोर्ट विक्टोरिया भी कहा जाता है,
        दापोली से लगभग 47 किमी दूर सावित्री नदी के मुहाने पर 300 फीट ऊंची पहाड़ी पर
        स्थित है। यह लेटराइट (जांभा) पत्थर से बना है और इसमें चट्टान को काटकर बनाई
        गई एक खाई है।


        मुख्य द्वार बाणकोट खाड़ी की ओर है। यहां नगारखाना और गुप्त प्रवेश द्वार वाला
        एक बुर्ज जरूर देखें। हरिहरेश्वर से आप बागमंडला-बाणकोट फेरी द्वारा नदी पार
        कर सकते हैं; अब किले तक एक सड़क भी पहुंचती है।'
      history: इसका सबसे पहला ज्ञात उल्लेख पहली शताब्दी ईस्वी के टॉलेमी के अभिलेखों
        में मंदागोरा के रूप में मिलता है, और कहा जाता है कि ह्वेनसांग ने 640 ईस्वी
        में बाणकोट से समुद्री यात्रा की थी। पुर्तगालियों ने इसे 1548 में आदिल शाह
        से छीन लिया था। कान्होजी आंग्रे ने इसे 1700 में जीता और इसका नाम हिम्मतगढ़
        रखा। 1755 में इसने एक ब्रिटिश बेड़े के सामने आत्मसमर्पण कर दिया, इसका नाम
        बदलकर फोर्ट विक्टोरिया कर दिया गया, और बाद में इसे पेशवाओं को सौंप दिया गया।
      significance: इस तट पर सबसे पुराने दर्ज बंदरगाहों में से एक, जो सावित्री नदी
        के मुहाने की रक्षा करता है।
      dos: '- वेलास समुद्र तट और बागमंडला फेरी के साथ यहां की यात्रा का संयोजन करें

        - गांव से गेट तक जाने के लिए लगभग आधा घंटा का समय रखें'
      donts: '- जीर्णोद्धार वाले क्षेत्रों में प्रवेश न करें'
      safety_text: '- जीर्णोद्धार का काम चल रहा है; साइट पर संकेतों का पालन करें'
