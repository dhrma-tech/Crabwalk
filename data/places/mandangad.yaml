  text:
    en:
      short_story: 'Bankot creek is where the Savitri river meets the sea at the northern
        tip of Ratnagiri district. Bankot village sits on its south bank, about 47
        km from Dapoli, with the fort above it.


        A ferry crosses the river between Bagmandla on the Harihareshwar side and
        Bankot, which makes this the usual way in from Raigad.'
      history: The fort above the creek guarded the Savitri trade route. It changed
        hands from Bijapur to the Portuguese in 1548, to Kanhoji Angre around 1700,
        and to the British in 1755, who called it Fort Victoria.
      significance: The river mouth that marks the northern edge of Ratnagiri district,
        with a ferry link to Harihareshwar.
      dos: '- Take the Bagmandla-Bankot ferry

        - Walk up to Bankot fort, about 30 minutes'
      donts: null
      safety_text: null
    mr:
      short_story: 'बाणकोट खाडी म्हणजे ती जागा जिथे सावित्री नदी रत्नागिरी जिल्ह्याच्या
        उत्तर टोकाला समुद्राला मिळते. बाणकोट गाव त्याच्या दक्षिण काठावर, दापोलीपासून
        सुमारे 47 किमी अंतरावर, त्याच्या वरच्या किल्यासह वसलेले आहे.


        हरिहरेश्वर बाजूकडील बागमांडला आणि बाणकोट दरम्यान नदीत एक फेरी चालते, ज्यामुळे
        रायगडहून येण्याचा हा नेहमीचा मार्ग बनतो.'
      history: खाडीवरील किल्याने सावित्रीच्या व्यापारी मार्गाचे रक्षण केले. 1548 मध्ये
        तो विजापूरकडून पोर्तुगीजांकडे, 1700 च्या सुमारास कान्होजी आंग्रे यांच्याकडे
        आणि 1755 मध्ये ब्रिटीशांकडे गेला, ज्यांनी त्याला 'फोर्ट व्हिक्टोरिया' म्हटले.
      significance: रत्नागिरी जिल्ह्याची उत्तर सीमा चिन्हांकित करणारी नदीची खाडी,
        हरिहरेश्वरशी फेरी लिंकसह.
      dos: '- बागमांडला-बाणकोट फेरी घ्या

        - बाणकोट किल्यापर्यंत चालत जा, सुमारे 30 मिनिटे'
      donts: null
      safety_text: null
    hi:
      short_story: 'बाणकोट क्रीक वह जगह है जहाँ सावित्री नदी रत्नागिरी जिले के उत्तरी
        छोर पर समुद्र से मिलती है। बाणकोट गाँव इसके दक्षिणी तट पर, दापोली से लगभग
        47 किमी दूर, इसके ऊपर स्थित किले के साथ बसा हुआ है।


        हरिहरेश्वर की ओर के बागमंडला और बाणकोट के बीच नदी पार करने के लिए एक फेरी
        चलती है, जिससे यह रायगढ़ से आने का सामान्य मार्ग बन जाता है।'
      history: क्रीक के ऊपर के किले ने सावित्री व्यापार मार्ग की रक्षा की। यह 1548
        में बीजापुर से पुर्तगालियों के पास, 1700 के आसपास कान्होजी आंग्रे के पास और
        1755 में अंग्रेजों के पास चला गया, जिन्होंने इसे 'फोर्ट विक्टोरिया' कहा था।
      significance: रत्नागिरी जिले की उत्तरी सीमा को चिह्नित करने वाला नदी का मुहाना,
