  text:
    en:
      short_story: 'Bankot Beach is located in the coastal village of Bankot in Mandangad
        taluka, Ratnagiri district, near where the Savitri River meets the Arabian
        Sea. It is a quiet shoreline surrounded by casuarina trees.


        Visitors can walk along the sand, watch the estuary, and see the historic
        Bankot Fort located on a nearby hill. The beach is known for its calm environment
        and is often visited by people exploring the fort.'
      history: Bankot became part of the Bombay Presidency in 1756. The nearby Bankot
        Fort served as the first residency of the British East India Company in the
        Southern Konkan region.
      significance: It is a quiet coastal spot at the Savitri River estuary, located
        just below a historic fort.
      dos: '- Carry your own food and water, as commercial facilities are limited.

        - Visit during the morning or late afternoon to avoid the midday heat.'
      donts: '- Do not leave trash or plastic on the beach.

        - Do not swim deep into the water, as tidal currents near the estuary can
        be strong.'
      safety_text: Be cautious near the water, as there are no lifeguards on duty
        and the estuary currents can be unpredictable.
    mr:
      short_story: 'बाणकोट बीच हा रत्नागिरी जिल्ह्यातील मंडणगड तालुक्यातील बाणकोट
        या किनारपट्टीवरील गावात आहे. हा समुद्रकिनारा सावित्री नदी आणि अरबी समुद्राच्या
        संगमाजवळ असून, येथे सुरूच्या झाडांची गर्दी पाहायला मिळते.


        येथे येणारे पर्यटक वाळूतून फेरफटका मारू शकतात, खाडीचे पाणी पाहू शकतात आणि
        जवळच्या टेकडीवर असलेला ऐतिहासिक बाणकोट किल्ला पाहू शकतात. हा किनारा शांततेसाठी
        ओळखला जातो आणि किल्ला पाहायला येणारे लोक अनेकदा येथेही भेट देतात.'
      history: 1756 मध्ये बाणकोट बॉम्बे प्रेसिडेन्सीचा भाग बनला. जवळच असलेला बाणकोट
        किल्ला हे दक्षिण कोकण प्रदेशातील ब्रिटिश ईस्ट इंडिया कंपनीचे पहिले निवासस्थान
        होते.
      significance: सावित्री नदीच्या खाडीजवळ ऐतिहासिक किल्ल्याच्या पायथ्याशी असलेले
        हे एक शांत ठिकाण आहे.
      dos: '- इथे दुकाने किंवा हॉटेल्स जास्त नसल्याने, स्वतःचे अन्न आणि पाणी सोबत
        ठेवा.

        - दुपारचे ऊन टाळण्यासाठी सकाळी किंवा संध्याकाळी भेट द्या.'
      donts: '- किनाऱ्यावर कचरा किंवा प्लास्टिक फेकू नका.

        - खाडीजवळ पाण्याचा प्रवाह वेगवान असू शकतो, त्यामुळे खोल पाण्यात पोहायला जाऊ
        नका.'
      safety_text: येथे जीवरक्षक नसल्यामुळे आणि खाडीतील पाण्याचा प्रवाह बदलत असल्याने,
        पाण्याजवळ जाताना काळजी घ्या.
    hi:
      short_story: 'बाणकोट बीच महाराष्ट्र के रत्नागिरी जिले के मंडणगढ़ तालुका के बाणकोट
        गाँव में स्थित है। यह समुद्र तट सावित्री नदी और अरब सागर के संगम के पास है,
        और कैसुरिना (सुरू) के पेड़ों से घिरा हुआ है।


        यहाँ आने वाले पर्यटक रेत पर टहल सकते हैं, मुहाने को देख सकते हैं और पास की
        पहाड़ी पर स्थित ऐतिहासिक बाणकोट किला देख सकते हैं। यह तट अपनी शांति के लिए
        जाना जाता है और किले के दर्शन करने वाले लोग अक्सर यहाँ आते हैं।'
      history: 1756 में बाणकोट बॉम्बे प्रेसीडेंसी का हिस्सा बन गया था। पास स्थित बाणकोट
        किला दक्षिणी कोंकण क्षेत्र में ब्रिटिश ईस्ट इंडिया कंपनी की पहली रेजीडेंसी
        था।
      significance: यह सावित्री नदी के मुहाने पर ऐतिहासिक किले के ठीक नीचे स्थित एक
        शांत तटीय स्थान है।
      dos: '- अपने साथ खाने-पीने की चीज़ें और पानी ले जाएँ, क्योंकि यहाँ व्यावसायिक
        सुविधाएँ सीमित हैं।

        - दोपहर की धूप से बचने के लिए सुबह या देर दोपहर में यहाँ जाएँ।'
      donts: '- समुद्र तट पर कचरा या प्लास्टिक न छोड़ें।

        - मुहाने के पास पानी का बहाव तेज़ हो सकता है, इसलिए गहरे पानी में तैरने न
        जाएँ।'
      safety_text: पानी के पास सतर्क रहें, क्योंकि यहाँ कोई लाइफगार्ड नहीं है और मुहाने
        की धाराएँ अप्रत्याशित हो सकती हैं।
