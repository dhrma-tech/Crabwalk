        आया और बाद में आंग्रे, सिद्दी तथा 1818 में अंग्रेजों के अधीन हो गया।
      significance: मंडणगड पहाड़ी किले के अंदर स्थित एक ऐतिहासिक मजार।
      dos: '- मजार और किले के परिसर में गरिमा और मर्यादा बनाए रखें

        - किले पर चढ़ाई के दौरान पीने का पानी साथ रखें

        - किले के असमान रास्तों पर चलने के लिए उपयुक्त जूते पहनें'
      donts: '- किसी भी ऐतिहासिक संरचना या कब्र को नुकसान न पहुँचाएं

