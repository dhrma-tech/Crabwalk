  text:
    en:
      short_story: 'Velas is a coastal village in Mandangad taluka where Olive Ridley
        sea turtles come ashore to nest. The conservation group Sahyadri Nisarg Mitra
        found the nesting site, and the villagers formed the Kasav Mitra Mandal to
        protect it.


        In the season, volunteers walk the beach every morning, fence each nest and,
        after 45 to 60 days, release the hatchlings in the evening. Visitors watch
        from behind the fence. Most village houses run simple homestays with meals
        included.'
      history: null
      significance: One of Maharashtra's best-known Olive Ridley nesting beaches,
        protected by the villagers themselves.
      dos: '- Book a village homestay early for festival weekends

        - Watch hatchling releases from behind the fence

        - Follow the volunteers'' instructions'
      donts: '- Don''t cross the fence or touch the hatchlings

        - Don''t use flash or torches near the nests

        - Don''t walk on fenced nest areas'
      safety_text: '- Weekends in the festival season are very crowded'
    mr:
      short_story: 'वेळास हे मंडणगड तालुक्यातील एक किनारी गाव आहे, जिथे ऑलिव्ह रिडले
        (Olive Ridley) जातीची समुद्री कासवे अंडी घालण्यासाठी किनाऱ्यावर येतात. ''सह्याद्री
        निसर्ग मित्र'' या संस्थेने येथील कासवांची अंडी घालण्याची जागा शोधून काढली
        आणि त्यानंतर ग्रामस्थांनी त्यांच्या संरक्षणासाठी ''कासव मित्र मंडळ'' स्थापन
        केले.


        कासवांच्या हंगामात, स्वयंसेवक दररोज सकाळी किनाऱ्यावर गस्त घालतात, प्रत्येक
        घरट्याभोवती कुंपण घालतात आणि 45 ते 60 दिवसांनंतर संध्याकाळी पिल्लांना समुद्रात
        सोडतात. पर्यटक कुंपणाच्या बाहेरून हा सोहळा पाहू शकतात. गावातील बहुतांश घरांमध्ये
        जेवणासहित साध्या होमस्टेची सोय उपलब्ध आहे.'
      history: null
      significance: स्वतः ग्रामस्थांनी संरक्षित केलेला हा महाराष्ट्रातील सर्वात प्रसिद्ध
        ऑलिव्ह रिडले कासवांच्या किनाऱ्यांपैकी एक आहे.
      dos: '- कासव महोत्सवाच्या वीकेंडसाठी गावातील होमस्टेचे बुकिंग लवकर करा

        - कासवांच्या पिल्लांना समुद्रात सोडण्याचा सोहळा कुंपणाच्या बाहेरूनच पहा

        - स्वयंसेवकांच्या सूचनांचे पालन करा'
      donts: '- कुंपण ओलांडू नका किंवा कासवांच्या पिल्लांना स्पर्श करू नका

        - कासवांच्या घरट्यांजवळ फ्लॅश किंवा टॉर्च वापरू नका

        - कुंपण घातलेल्या घरट्यांच्या भागात चालू नका'
      safety_text: '- महोत्सवाच्या हंगामात शनिवार-रविवारी येथे खूप गर्दी असते'
    hi:
      short_story: 'वेलास मंडणगढ़ तालुका का एक तटीय गांव है जहां ओलिव रिडले (Olive
        Ridley) समुद्री कछुए अंडे देने के लिए तट पर आते हैं। संरक्षण समूह ''सह्याद्री
        निसर्ग मित्र'' ने इस घोंसले के स्थान की खोज की, और ग्रामीणों ने इसकी रक्षा
        के लिए ''कासव मित्र मंडल'' का गठन किया।


        कछुओं के मौसम में, स्वयंसेवक हर सुबह समुद्र तट पर गश्त करते हैं, प्रत्येक
        घोंसले पर बाड़ लगाते हैं और 45 से 60 दिनों के बाद, शाम को बच्चों को समुद्र
        में छोड़ देते हैं। पर्यटक बाड़ के पीछे से इसे देखते हैं। गांव के अधिकांश घरों
        में भोजन के साथ साधारण होमस्टे की सुविधा उपलब्ध है।'
      history: null
      significance: यह महाराष्ट्र के सबसे प्रसिद्ध ओलिव रिडले कछुओं के समुद्र तटों
        में से एक है, जिसे स्वयं ग्रामीणों द्वारा संरक्षित किया गया है।
      dos: '- कछुआ महोत्सव के सप्ताहांत के लिए गांव में होमस्टे जल्दी बुक करें

        - कछुए के बच्चों को समुद्र में छोड़े जाते हुए बाड़ के पीछे से ही देखें

        - स्वयंसेवकों के निर्देशों का पालन करें'
      donts: '- बाड़ पार न करें या कछुए के बच्चों को न छुएं

        - घोंसलों के पास फ्लैश या टॉर्च का प्रयोग न करें

        - बाड़ वाले घोंसले के क्षेत्रों में न चलें'
      safety_text: '- महोत्सव के मौसम में सप्ताहांत में यहां बहुत भीड़ होती है'
