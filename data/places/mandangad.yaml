        नाही तर वापरा'
      donts: '- ऐतिहासिक वास्तू किंवा कबरांचे नुकसान करू नका

        - किल्ल्याच्या धोकादायक आणि सुरक्षित नसलेल्या कड्यांच्या टोकांवर जाऊ नका'
