  text:
    en:
      short_story: 'Saint Dawood Khan Mazar is located inside Mandangad Fort, situated
        in Mandangad taluka of Ratnagiri district. The fort sits on a hill approximately
        1,200 feet above sea level and overlooks the surrounding terrain near the
        town.


        Within the fort complex, visitors can observe the mazar (tomb) of Saint Dawood
        Khan along with several other Muslim graves. The site also features historical
        fort remains, a Ganesha temple, and perennial water tanks such as Thorla Talao.'
      history: Mandangad Fort, which houses the mazar, was built to safeguard the
        trade route through the Savitri River and underwent restoration during the
        Adilshahi rule of Bijapur before coming under the control of Chhatrapati Shivaji
        Maharaj in 1661, later passing through the hands of the Angres, Siddis, and
        the British in 1818.
      significance: A historical mazar located inside the hill fort of Mandangad.
      dos: '- Maintain proper decorum and respect at the mazar and fort site

        - Carry drinking water as amenities on the fort hill are limited

        - Wear comfortable footwear suitable for walking on uneven fort terrain'
      donts: '- Do not deface or damage any historical structures or graves

        - Do not wander near unguarded steep edges of the hill fort'
      safety_text: Exercise caution near the deep valley edges on the western side
        of the hill fort.
    mr:
      short_story: 'संत दाऊद खान यांची मजार रत्नागिरी जिल्ह्यातील मंडणगड तालुक्यात
        असलेल्या मंडणगड किल्ल्याच्या आवारात आहे. हा किल्ला शहराच्या पाठीमागे एका टेकडीवर
        समुद्रासपाटीपासून साधारण 1,200 फूट उंचावर स्थित आहे.


        किल्ल्याच्या परिसरामध्ये संत दाऊद खान यांची मजार तसेच इतर अनेक मुस्लिम कब्र
        पाहता येतात. याशिवाय किल्ल्यावर पाण्याचे टाके (थोरला तलाव), गणपती मंदिर आणि
        जुन्या वास्तूंचे अवशेष पाहण्यास मिळतात.'
      history: सावित्री नदीच्या व्यापारी मार्गाच्या रक्षणासाठी बांधलेल्या या किल्ल्यावर
        आदिलशाही राजवटीत दुरुस्ती झाली. पुढे 1661 मध्ये हा किल्ला छत्रपती शिवाजी महाराजांच्या
        ताब्यात आला आणि नंतर आंग्रे, सिद्दी व 1815-1818 दरम्यान ब्रिटिशांच्या हाती
        गेला.
      significance: मंडणगड किल्ल्याच्या आवारात असलेली ऐतिहासिक संत दाऊद खान मजार.
      dos: '- मजार आणि किल्ला परिसरात योग्य आदर व शांतता राखा

        - गडचढाई करताना पिण्याचे पाणी सोबत ठेवा

