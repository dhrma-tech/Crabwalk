  text:
    en:
      short_story: 'Situated in Koldhe village, this ancient Shiva temple is built
        in the Hemadpanti architectural style. The entire structure is made of red
        laterite stone joined meticulously without cement. The courtyard features
        four deepmalas.


        The sanctum houses a Shiva lingam carved from a single solid black stone.
        Koldhe is also known as the ancestral village of Moropant Tambe, the father
        of Rani Laxmibai. The temple complex includes a sabhamandap with a carved
        wooden entrance and a modern Kalkai temple behind it.'
      history: Koldhe is the native village of the Tambe family, ancestors of Rani
        Laxmibai. According to legend, the temple was built by a Brahmin from the
        Tambe family after a cowherd discovered a Shiva lingam where a cow was shedding
        milk.
      significance: An ancient, cementless Hemadpanti stone temple linked to the maternal
        ancestors of Rani Laxmibai.
      dos: '- Visit during the Mahashivratri festival to see traditional palanquin
        processions.

        - Notice the precision of the laterite stone joints built without cement.'
      donts: '- Do not plan to stay overnight, as there are no accommodation facilities
        at the temple.'
      safety_text: null
    mr:
      short_story: 'कोलधे गावात स्थित हे प्राचीन शिवमंदिर हेमाडपंती स्थापत्यशैलीत
        बांधले आहे. मंदिराचे संपूर्ण बांधकाम जांभ्या दगडात सिमेंटचा वापर न करता केलेले
        आहे. मंदिराच्या प्रांगणात चार दीपमाळा आहेत.


        गर्भगृहातील शिवपिंडी अखंड काळ्या पाषाणाची आहे. कोलधे हे राणी लक्ष्मीबाईंचे
        वडील मोरोपंत तांबे यांचे मूळ गाव आहे. या मंदिर परिसरात लाकडी कोरीव काम असलेला
        सभामंडप असून, मागच्या बाजूला आधुनिक कालकाई मंदिर आहे.'
      history: कोलधे हे राणी लक्ष्मीबाईंचे पूर्वज असलेल्या तांबे घराण्याचे मूळ गाव
        आहे. आख्यायिकेनुसार, एका गाईने दगडावर पान्हा सोडल्यानंतर तिथे शिवपिंडी सापडली,
        त्यानंतर तांबे कुटुंबातील एका ब्राह्मणाने हे मंदिर बांधले.
      significance: राणी लक्ष्मीबाईंच्या माहेरच्या पूर्वजांशी संबंधित असलेले हे सिमेंटविना
        बांधलेले हेमाडपंती शिवमंदिर आहे.
      dos: '- महाशिवरात्रीच्या उत्सवात येथील पारंपरिक पालखी सोहळा पाहण्यासाठी आवर्जून
        भेट द्या.

        - सिमेंटविना जांभ्या दगडांची केलेली अचूक जुळणी नक्की पहा.'
      donts: '- मंदिर परिसरात राहण्याची व्यवस्था नसल्याने मुक्कामाचे नियोजन करू नका.'
      safety_text: null
    hi:
      short_story: 'कोलधे गांव में स्थित यह प्राचीन शिव मंदिर हेमाडपंती वास्तुकला
        शैली में बनाया गया है। पूरी संरचना लाल जांभा पत्थर से बनी है, जिसे बिना सीमेंट
        के जोड़ा गया है। मंदिर के प्रांगण में चार दीपमालाएं हैं।


        गर्भगृह में एक ही ठोस काले पत्थर से उकेरा गया शिवलिंग स्थापित है। कोलधे रानी
        लक्ष्मीबाई के पिता मोरोपंत तांबे का पैतृक गांव भी है। मंदिर परिसर में नक्काशीदार
        लकड़ी के प्रवेश द्वार वाला एक सभामंडप और पीछे एक आधुनिक कालकाई मंदिर है।'
      history: कोलधे तांबे परिवार (रानी लक्ष्मीबाई के पूर्वज) का मूल गांव है। किंवदंती
        के अनुसार, एक गाय द्वारा एक पत्थर पर दूध गिराए जाने के बाद वहाँ शिवलिंग मिला
        था, जिसके बाद तांबे परिवार के एक ब्राह्मण ने यह मंदिर बनवाया था।
      significance: रानी लक्ष्मीबाई के मायके के पूर्वजों से जुड़ा, बिना सीमेंट के
        बना यह एक प्राचीन हेमाडपंती शिव मंदिर है।
      dos: '- पारंपरिक पालखी जुलूस देखने के लिए महाशिवरात्रि उत्सव के दौरान यहाँ आएं।

        - बिना सीमेंट के जांभा पत्थरों को जोड़ने की सटीक कारीगरी को अवश्य देखें।'
      donts: '- रात रुकने की योजना न बनाएं, क्योंकि मंदिर में ठहरने की कोई सुविधा
        नहीं है।'
