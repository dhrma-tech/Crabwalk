  text:
    en:
      short_story: 'Khorninko is an irrigation dam near Lanja whose reservoir has
        become a local picnic spot. After the rains, small waterfalls and streams
        run around it, and a short walk from Khorninko village leads to the waterfall
        and backwaters.


        The road in passes mango and cashew orchards and paddy fields. A quick visit
        takes about 40 minutes.'
      history: null
      significance: A quiet dam and waterfall spot in the Lanja countryside.
      dos: '- Carry your own food, water and a waste bag

        - Go from September to February when the reservoir is full'
      donts: '- Don''t swim in the reservoir'
      safety_text: No shops or help on site. Nearest medical help is in Lanja.
    mr:
      short_story: 'खोरनिन्को हे लांजा जवळील एक सिंचन धरण आहे, ज्याचा जलाशय एक स्थानिक
        पिकनिक स्पॉट बनला आहे. पावसानंतर, त्याच्या आसपास लहान धबधबे आणि ओढे वाहतात,
        आणि खोरनिन्को गावातून थोडी चालत गेल्यास धबधबा आणि बॅकवॉटरपर्यंत पोहोचता येते.


        आतील रस्ता आंबा आणि काजूच्या बागा आणि धान्याच्या शेतांमधून जातो. एक द्रुत
        भेट सुमारे 40 मिनिटे घेते.'
      history: null
      significance: लांजाच्या ग्रामीण भागातील एक शांत धरण आणि धबधब्याचे ठिकाण.
      dos: '- तुमचे स्वतःचे अन्न, पाणी आणि कचऱ्याची पिशवी सोबत ठेवा

        - सप्टेंबर ते फेब्रुवारी दरम्यान जा जेव्हा जलाशय भरलेला असतो'
      donts: '- जलाशयात पोहू नका'
      safety_text: ठिकाणी कोणतीही दुकाने किंवा मदत उपलब्ध नाही. जवळची वैद्यकीय मदत
        लांजा येथे आहे.
    hi:
      short_story: 'खोरनिन्को लांजा के पास एक सिंचाई बांध है जिसका जलाशय एक स्थानीय
        पिकनिक स्थल बन गया है। बारिश के बाद, इसके आस-पास छोटे झरने और धाराएँ बहती
        हैं, और खोरनिन्को गाँव से थोड़ी दूर पैदल चलने पर झरना और बैकवाटर तक पहुँचा
        जा सकता है।


        अंदर का रास्ता आम और काजू के बागों और धान के खेतों से होकर गुजरता है। एक त्वरित
        यात्रा में लगभग 40 मिनट लगते हैं।'
      history: null
      significance: लांजा के ग्रामीण इलाकों में एक शांत बांध और झरने का स्थान।
      dos: '- अपना भोजन, पानी और कचरे का बैग अपने साथ रखें

        - सितंबर से फरवरी के बीच जाएँ जब जलाशय भरा हो'
      donts: '- जलाशय में न तैरें'
      safety_text: साइट पर कोई दुकान या मदद नहीं है। निकटतम चिकित्सा सहायता लांजा
        में है।
