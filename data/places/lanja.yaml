  text:
    en:
      short_story: 'Satavali is a small watch fort on the bank of the Muchkundi river,
        about 18 km from Lanja. Built of laterite stacked without mortar, it has five
        bastions, a dry well, cannon loopholes and a deep moat on two sides, though
        it is now largely overgrown.


        The village''s wooden Vitthal-Rakhumai temple, with a cannon in its courtyard,
        is worth a stop after the fort.'
      history: Satavali was a secondary river port and the fort watched the river
        trade. It changed hands from Sardar Doroji in Shivaji's time to Kanhoji Angre
        (1713), the Peshwas (1755) and the British (1818).
      significance: null
      dos: '- Visit the Vitthal-Rakhumai temple in the village'
      donts: null
      safety_text: '- The fort is overgrown; wear long trousers and shoes'
    mr:
      short_story: 'साटवली हा लांजापासून सुमारे 18 किमी अंतरावर मुचकुंडी नदीच्या तीरावर
        असलेला एक छोटा टेहळणी किल्ला आहे. कोणत्याही चुन्याचा वापर न करता केवळ जांभा
        दगड एकावर एक रचून बांधलेल्या या किल्ल्याला पाच बुरूज, एक कोरडी विहीर, तोफांसाठी
        झरोके आणि दोन बाजूंनी खोल खंदक आहे, जरी आता तिथे मोठ्या प्रमाणावर झाडी वाढली
        असली तरी.


        किल्ला पाहिल्यानंतर गावातल्या लाकडी विठ्ठल-रखुमाई मंदिराला नक्की भेट द्या,
        ज्याच्या अंगणात एक तोफ ठेवली आहे.'
      history: साटवली हे नदीवरील दुय्यम बंदर होते आणि हा किल्ला नदीवरील व्यापारावर
        लक्ष ठेवून असे. शिवाजी महाराजांच्या काळात सरदार दोरोजी, त्यानंतर कान्होजी
        आंग्रे (1713), पेशवे (1755) आणि शेवटी ब्रिटिशांच्या (1818) ताब्यात हा किल्ला
        गेला.
      significance: null
      dos: '- गावातल्या विठ्ठल-रखुमाई मंदिराला नक्की भेट द्या'
      donts: null
      safety_text: '- किल्ल्यावर खूप झाडी वाढली आहे; लांब पँट आणि बूट घाला'
    hi:
      short_story: 'साटवली लांजा से लगभग 18 किमी दूर मुचकुंडी नदी के तट पर एक छोटा
        निगरानी किला है। बिना गारे के केवल लेटराइट (जांभा) पत्थरों को एक के ऊपर एक
        रखकर बनाए गए इस किले में पांच बुर्ज, एक सूखा कुआं, तोपों के लिए झरोखे और दो
        तरफ एक गहरी खाई है, हालांकि अब यहां काफी झाड़ियां उग आई हैं।


        किले के बाद गांव के लकड़ी के विट्ठल-रखुमाई मंदिर में जाना एक अच्छा विकल्प
        है, जिसके प्रांगण में एक तोप रखी है।'
      history: साटवली एक द्वितीयक नदी बंदर था और किला नदी के व्यापार पर नजर रखता था।
        यह शिवाजी के समय में सरदार दोरोजी से लेकर कान्होजी आंग्रे (1713), पेशवाओं
        (1755) और फिर अंग्रेजों (1818) के हाथों में गया।
      significance: null
      dos: '- गांव में विट्ठल-रखुमाई मंदिर के दर्शन करें'
      donts: null
      safety_text: '- किले में बहुत झाड़ियां उग आई हैं; पूरी पैंट और जूते पहनें'
