  text:
    en:
      short_story: 'Located in Mouje Kot village in Lanja taluka, this memorial is
        dedicated to Rani Laxmibai of Jhansi. Kot is the ancestral village of the
        Newalkar family. Rani Laxmibai’s husband, Maharaja Gangadhar Rao Newalkar,
        belonged to this lineage.


        The site serves as a historical marker commemorating the roots of the Jhansi
        royal family in the Ratnagiri district. It stands as a modest tribute to the
        historical connection between the Konkan region and the Maratha empire''s
        northern expansion.'
      history: The Newalkars of Jhansi originally hailed from Kot village in Ratnagiri
        before migrating northward during the Peshwa era. The memorial was established
        to honor the Queen's marital ties to this specific village.
      significance: It marks the ancestral village of the Newalkar royal family of
        Jhansi.
      dos: '- Combine your trip with a visit to Koldhe, the maternal village of Rani
        Laxmibai, located nearby.

        - Speak to the village elders to learn about the region''s historical ties.'
      donts: '- Do not expect a large, modern museum; it is a modest village memorial.'
      safety_text: null
    mr:
      short_story: 'लांजा तालुक्यातील मौजे कोट गावात असलेले हे स्मारक झाशीची राणी
        लक्ष्मीबाई यांना समर्पित आहे. कोट हे नेवाळकर घराण्याचे मूळ गाव आहे. राणी लक्ष्मीबाईंचे
        पती, महाराज गंगाधरराव नेवाळकर याच घराण्यातील होते.


        हे स्मारक झाशीच्या राजघराण्याची रत्नागिरी जिल्ह्याशी असलेली नाळ दर्शवते. कोकण
        आणि मराठा साम्राज्याच्या उत्तरेकडील विस्तारातील ऐतिहासिक संबंधांची आठवण म्हणून
        हे स्मारक ओळखले जाते.'
      history: पेशवे काळात उत्तरेकडे स्थलांतर करण्यापूर्वी झाशीचे नेवाळकर मुळचे रत्नागिरीतील
        याच कोट गावचे होते. राणी लक्ष्मीबाईंचे या गावाशी असलेले सासरचे नाते जपण्यासाठी
        हे स्मारक उभारण्यात आले आहे.
      significance: झाशीच्या नेवाळकर राजघराण्याचे मूळ गाव दर्शवणारे स्मारक.
      dos: '- या भेटीसोबतच राणी लक्ष्मीबाईंचे माहेर असलेल्या जवळच्या कोलधे गावाला
        नक्की भेट द्या.

        - गावाचा ऐतिहासिक वारसा जाणून घेण्यासाठी स्थानिक ग्रामस्थांशी संवाद साधा.'
      donts: '- येथे मोठ्या आधुनिक संग्रहालयाची अपेक्षा करू नका; हे गावातील एक साधे
        स्मारक आहे.'
      safety_text: null
    hi:
      short_story: 'लांजा तालुका के मौजे कोट गांव में स्थित यह स्मारक झाँसी की रानी
        लक्ष्मीबाई को समर्पित है। कोट नेवालकर परिवार का पैतृक गांव है। रानी लक्ष्मीबाई
        के पति, महाराजा गंगाधर राव नेवालकर इसी वंश के थे।


        यह स्थान रत्नागिरी जिले में झाँसी शाही परिवार की जड़ों को दर्शाता है। यह स्मारक
        कोंकण क्षेत्र और मराठा साम्राज्य के उत्तरी विस्तार के बीच ऐतिहासिक संबंध को
        श्रद्धांजलि देता है।'
      history: पेशवा काल के दौरान उत्तर की ओर पलायन करने से पहले, झाँसी के नेवालकर
        मूल रूप से रत्नागिरी के इसी कोट गांव के थे। महारानी के इस गांव से वैवाहिक
        संबंधों का सम्मान करने के लिए यह स्मारक स्थापित किया गया था।
      significance: यह झाँसी के नेवालकर शाही परिवार के पैतृक गांव को चिह्नित करता
        है।
      dos: '- इस यात्रा के साथ रानी लक्ष्मीबाई के मायके, पास के कोलधे गांव के दर्शन
        भी करें।

        - इस क्षेत्र के ऐतिहासिक संबंधों के बारे में जानने के लिए गांव के बुजुर्गों
        से बात करें।'
      donts: '- किसी बड़े आधुनिक संग्रहालय की उम्मीद न करें; यह गांव का एक साधारण
        स्मारक है।'
