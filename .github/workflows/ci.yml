name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hardening 2026-11 (SEC-23): read-only token; actions pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholders for the build: the prerendered /navigate runs the Supabase hook (no DB call).
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-placeholder
      # The production build names the exact tiles host in its CSP (SEC-10) and stops without one.
      PMTILES_BASE_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Full suite on a fresh local stack (migrations + seed); Google is never used.
      E2E_SUPABASE: local
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start fresh Supabase (applies migrations + seed; Mailpit for email OTP)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - run: pnpm --filter @crabwalk/web exec playwright install --with-deps chromium
      # Screenshot baselines are rendered on Windows (local); CI runs every other shell check.
      - run: pnpm --filter @crabwalk/web exec playwright test --grep-invert snapshot

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          # Checked against the release's published SHA-256 before anything is extracted.
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner -v .

  db:
    runs-on: ubuntu-latest
    env:
      # Placeholders so config.toml's env() refs resolve; CI never signs in with Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start fresh Supabase (applies migrations + seed)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,supavisor
      - name: RLS tests
        run: pnpm exec supabase test db
      - name: Generated DB types are up to date
        run: |
          pnpm run db:types
          git diff --exit-code apps/web/src/lib/db.types.ts
