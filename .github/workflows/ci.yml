name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholders for the build: the prerendered /navigate runs the Supabase hook (no DB call).
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Full suite on a fresh local stack (migrations + seed); Google is never used.
      E2E_SUPABASE: local
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start fresh Supabase (applies migrations + seed; Mailpit for email OTP)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - run: pnpm --filter @crabwalk/web exec playwright install --with-deps chromium
      # Screenshot baselines are rendered on Windows (local); CI runs every other shell check.
      - run: pnpm --filter @crabwalk/web exec playwright test --grep-invert snapshot

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner -v .

  db:
    runs-on: ubuntu-latest
    env:
      # Placeholders so config.toml's env() refs resolve; CI never signs in with Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start fresh Supabase (applies migrations + seed)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,supavisor
      - name: RLS tests
        run: pnpm exec supabase test db
      - name: Generated DB types are up to date
        run: |
          pnpm run db:types
          git diff --exit-code apps/web/src/lib/db.types.ts
